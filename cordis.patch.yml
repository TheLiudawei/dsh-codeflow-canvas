# ============================================================================
# dsh-codeflow-canvas —— DSH bundle patch
# ============================================================================
# 这是插件的“挂载声明”。DSH 启动时按 bundle 层栈叠加各插件 patch，本文件把
# 插件挂进 profile 的配置树。单行插件（host 半 + client 半同一个包）：
# 这一条 entry 同时激活 lib/index.js（Host）与 lib/client.js（浏览器侧）。
#
# 安装（本地开发，不需要构建）：
#   dsh plugin --profile desktop add link:<本目录绝对路径>
# 或在“设置 → 插件”里安装本地目录。
# ============================================================================

- insert:
    - id: codeflow-canvas
      name: dsh-codeflow-canvas
