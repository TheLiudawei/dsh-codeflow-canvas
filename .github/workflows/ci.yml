name: CI

# Runs the plugin's dependency-free test suites on all three desktop platforms
# DSH ships for. The plugin has no npm dependencies and no build step, so the
# only requirement is a Node runtime — the suites import node:* builtins and
# this repository's own modules, never the DSH host.
#
# 16 of the 18 suites run here. The two that do not:
#   tests/mac/     macOS field diagnostics — a manual kit that needs an
#                  installed DSH and a real desktop session (see its README)
#   contrast.mjs   a module imported by validate/menu, not a standalone suite
# tests/_log-off.mjs is a side-effect helper imported by other suites.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/images/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      # One platform failing must still tell us about the other two.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22]

    steps:
      - uses: actions/checkout@v4
        with:
          # tests/release.mjs 需要标签来核对版本纪律
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Environment
        shell: bash
        run: |
          node --version
          npm --version
          git --version

      - name: validate — structure, behaviour, canvas assets, XSS
        # 一个套件红了仍要跑完其余，一轮就能看到全部失败
        if: always()
        shell: bash
        run: node tests/validate.mjs

      - name: regression — per-fix regressions
        # 一个套件红了仍要跑完其余，一轮就能看到全部失败
        if: always()
        shell: bash
        run: node tests/regression.mjs

      - name: cards — re-import merge, stale cards, opt-out path
        # 一个套件红了仍要跑完其余，一轮就能看到全部失败
        if: always()
        shell: bash
        run: node tests/cards.mjs

      - name: menu — menu model, ARIA, build-time render, popover fit
        # 一个套件红了仍要跑完其余，一轮就能看到全部失败
        if: always()
        shell: bash
        run: node tests/menu.mjs

      - name: architecture — layering and acyclic static imports
        # 一个套件红了仍要跑完其余，一轮就能看到全部失败
        if: always()
        shell: bash
        run: node tests/architecture.mjs

      - name: logging — JSONL schema, redaction, rotation, degrade path
        # 一个套件红了仍要跑完其余，一轮就能看到全部失败
        if: always()
        shell: bash
        run: node tests/logging.mjs

      - name: undo — snapshot/restore, LIFO, cross-view
        # 一个套件红了仍要跑完其余，一轮就能看到全部失败
        if: always()
        shell: bash
        run: node tests/undo.mjs

      - name: coupling — deterministic scoring, thresholds, persistence
        # 一个套件红了仍要跑完其余，一轮就能看到全部失败
        if: always()
        shell: bash
        run: node tests/coupling.mjs

      - name: features — index build, manual section, rebuild stability
        # 一个套件红了仍要跑完其余，一轮就能看到全部失败
        if: always()
        shell: bash
        run: node tests/features.mjs

      - name: workspace — registration chain, longest-prefix resolution
        # 一个套件红了仍要跑完其余，一轮就能看到全部失败
        if: always()
        shell: bash
        run: node tests/workspace.mjs

      - name: browse — read-only directory listing, caps, timeouts
        # 一个套件红了仍要跑完其余，一轮就能看到全部失败
        if: always()
        shell: bash
        run: node tests/browse.mjs

      - name: import-shells — conservative root detection (51 combos)
        # 一个套件红了仍要跑完其余，一轮就能看到全部失败
        if: always()
        shell: bash
        run: node tests/import-shells.mjs

      - name: log-viewer — filter, search, tail-follow, path binding
        # 一个套件红了仍要跑完其余，一轮就能看到全部失败
        if: always()
        shell: bash
        run: node tests/log-viewer.mjs

      - name: drop-import — folder/archive staging, extraction, collisions
        # 一个套件红了仍要跑完其余，一轮就能看到全部失败
        if: always()
        shell: bash
        run: node tests/drop-import.mjs

      - name: e2e — real http server and fetch scenarios
        # 一个套件红了仍要跑完其余，一轮就能看到全部失败
        if: always()
        shell: bash
        run: node tests/e2e.mjs

      - name: buttons — control manifest, bindings, action audit
        # 一个套件红了仍要跑完其余，一轮就能看到全部失败
        if: always()
        shell: bash
        run: node tests/buttons.mjs

      - name: release — package.json must run ahead of the latest tag
        # 一个套件红了仍要跑完其余，一轮就能看到全部失败
        if: always()
        shell: bash
        run: node tests/release.mjs

      - name: bench — measured import cost, determinism and undo fidelity
        # 一个套件红了仍要跑完其余，一轮就能看到全部失败
        if: always()
        shell: bash
        run: node tests/bench.mjs
