<!--
  CodeFlow 画布模板（Gen UI HTML 片段）
  用法：复制全部内容，把唯一的占位符 __CF_GRAPH_JSON__ 替换为工作流图 JSON（见 workflow-schema.md），
  写入会话可视化目录 codeflow-canvas.html，并在最终回复中引用 ::visualize{"path":"...","mode":"wide"}。
  片段内除占位符外不需要任何修改；JSON 中的 </ 一律写作 <\/。
-->
<div id="codeflow-canvas" aria-label="CodeFlow 工作流画布">
  <div class="cf-tb">
    <div class="cf-logo"><span class="cf-logo-mark">⬡</span><b>CodeFlow</b><span class="cf-logo-sub">工作流画布</span></div>
    <button type="button" class="cf-tbtn" id="cf-tb-new" data-tooltip="agent 根据需求生成项目初版"><i data-lucide="file-plus-2"></i>新建项目</button>
    <button type="button" class="cf-tbtn" id="cf-tb-import" data-tooltip="扫描已有代码，识别语言与注释生成工作流"><i data-lucide="folder-open"></i>导入项目</button>
    <button type="button" class="cf-tbtn" id="cf-tb-add" data-tooltip="添加一个节点（也可双击空白处）"><i data-lucide="shapes"></i>添加节点</button>
    <span class="cf-tsep"></span>
    <button type="button" class="cf-tbtn cf-accent" id="cf-tb-runall" data-tooltip="按拓扑顺序执行所有待运行节点"><i data-lucide="play"></i>运行全部</button>
    <button type="button" class="cf-tbtn" id="cf-tb-layout" data-tooltip="按依赖关系自动排列节点"><i data-lucide="layout-list"></i>整理布局</button>
    <button type="button" class="cf-tbtn" id="cf-tb-fit" data-tooltip="缩放到全部节点可见"><i data-lucide="maximize"></i>适应视图</button>
    <span class="cf-tgrow"></span>
    <button type="button" class="cf-tbtn" id="cf-tb-save" data-tooltip="把工作流图保存到 flow-projects/ 目录"><i data-lucide="save"></i>保存</button>
    <button type="button" class="cf-tbtn cf-icononly" id="cf-tb-help" data-tooltip="使用帮助" aria-label="帮助"><i data-lucide="info"></i></button>
  </div>
  <div class="cf-stage" id="cf-stage">
    <div class="cf-world" id="cf-world">
      <div id="cf-links" aria-hidden="true"></div>
      <div id="cf-nodes"></div>
    </div>
    <div class="cf-empty" id="cf-empty" hidden>
      <div class="cf-empty-card">
        <div class="cf-empty-logo">⬡</div>
        <div class="cf-empty-title">CodeFlow 工作流画布</div>
        <div class="cf-empty-sub">像 ComfyUI 一样用节点编排编程任务：每个节点由 agent 真实执行</div>
        <div class="cf-empty-btns">
          <button type="button" class="cf-btn cf-primary" id="cf-empty-new">新建项目</button>
          <button type="button" class="cf-btn" id="cf-empty-import">导入项目</button>
        </div>
        <div class="cf-empty-hint">右键空白画布查看全部操作 · 双击空白处添加节点</div>
      </div>
    </div>
    <div class="cf-zoomer" id="cf-zoomer">
      <button type="button" id="cf-z-in" data-tooltip="放大" aria-label="放大"><i data-lucide="zoom-in"></i></button>
      <button type="button" id="cf-z-out" data-tooltip="缩小" aria-label="缩小"><i data-lucide="zoom-out"></i></button>
      <button type="button" id="cf-z-fit" data-tooltip="适应视图" aria-label="适应视图"><i data-lucide="maximize"></i></button>
    </div>
    <div class="cf-nav" id="cf-nav" role="tablist" aria-label="功能模块导航"></div>
    <canvas class="cf-mini" id="cf-mini" width="176" height="118" aria-label="小地图"></canvas>
  </div>
  <div class="cf-status">
    <button type="button" class="cf-projname" id="cf-projname" data-tooltip="点击重命名项目">未命名项目</button>
    <span class="cf-origin" id="cf-origin" hidden></span>
    <span class="cf-sgrow"></span>
    <span id="cf-count"></span>
    <span class="cf-sdot">·</span>
    <span id="cf-zoomlab">100%</span>
    <span class="cf-sdot">·</span>
    <span id="cf-saved">已暂存</span>
    <span id="cf-mode" class="cf-modetag" hidden>独立模式</span>
  </div>
  <div class="cf-banner" id="cf-banner" hidden>
    <span class="cf-spin">◐</span><span id="cf-banner-text"></span>
    <button type="button" class="cf-banner-x" id="cf-banner-x" aria-label="关闭">✕</button>
  </div>
  <div class="cf-toasts" id="cf-toasts" aria-live="polite"></div>
  <div class="cf-modal" id="cf-modal" hidden><div class="cf-dialog" id="cf-dialog" role="dialog" aria-modal="true"></div></div>
</div>

<style>
#codeflow-canvas{
  --cf-bg:#101014; --cf-stage:#141419; --cf-panel:#1c1c23; --cf-panel2:#232330;
  --cf-border:#31313d; --cf-border2:#3d3d4c; --cf-text:#e9e9f0; --cf-dim:#9a9aa8;
  --cf-accent:#7c8cff; --cf-danger:#ef4444;
  position:relative; display:flex; flex-direction:column; height:780px;
  background:var(--cf-bg); color:var(--cf-text); border:1px solid var(--cf-border);
  border-radius:14px; overflow:hidden;
  font-family:-apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif; font-size:13px; line-height:1.45;
}
#codeflow-canvas *{box-sizing:border-box;}
#codeflow-canvas [hidden]{display:none !important;}
#codeflow-canvas button{font-family:inherit;}
#codeflow-canvas.dragging, #codeflow-canvas.dragging *{cursor:grabbing !important; user-select:none;}
#codeflow-canvas.linking, #codeflow-canvas.linking *{cursor:crosshair !important;}

/* ---------- 工具栏 ---------- */
.cf-tb{display:flex; align-items:center; gap:6px; padding:8px 10px; background:var(--cf-panel); border-bottom:1px solid var(--cf-border); flex-wrap:wrap;}
.cf-logo{display:flex; align-items:baseline; gap:6px; margin-right:8px;}
.cf-logo-mark{color:var(--cf-accent); font-size:16px;}
.cf-logo b{font-size:13.5px;}
.cf-logo-sub{color:var(--cf-dim); font-size:11px;}
.cf-tbtn{display:inline-flex; align-items:center; gap:5px; padding:5px 10px; border-radius:8px; border:1px solid var(--cf-border);
  background:var(--cf-panel2); color:var(--cf-text); font-size:12px; cursor:pointer; white-space:nowrap;}
.cf-tbtn:hover{border-color:var(--cf-border2); background:#2a2a38;}
.cf-tbtn.cf-accent{background:rgba(124,140,255,.16); border-color:rgba(124,140,255,.45); color:#b9c2ff;}
.cf-tbtn.cf-accent:hover{background:rgba(124,140,255,.26);}
.cf-tbtn.cf-icononly{padding:5px 7px;}
.cf-tbtn svg{width:14px; height:14px;}
.cf-tsep{width:1px; height:18px; background:var(--cf-border); margin:0 2px;}
.cf-tgrow{flex:1;}

/* ---------- 画布区 ---------- */
.cf-stage{position:relative; flex:1; overflow:hidden; background:var(--cf-stage);
  background-image:radial-gradient(circle, #232330 1px, transparent 1px); background-size:22px 22px; cursor:default;}
.cf-world{position:absolute; left:0; top:0; width:0; height:0; transform-origin:0 0;}
#cf-links{position:absolute; left:0; top:0; width:0; height:0; z-index:1; pointer-events:none;}
.cf-linksvg{position:absolute; overflow:visible; pointer-events:none;}
/* 宿主样式表可能对 svg 施加 max-width:100% 之类的约束；连线 svg 的定位父级宽高为 0，百分比会塌缩为 0 导致连线消失。
   这里用样式表 !important 兜底，创建时还会追加内联 !important（优先级最高）。 */
#cf-links .cf-linksvg{max-width:none !important; max-height:none !important;}
.cf-link{fill:none; stroke:#63636f; stroke-width:2; vector-effect:non-scaling-stroke; pointer-events:none;}
.cf-link.sel{stroke:var(--cf-accent); stroke-width:2.5;}
.cf-link-hit{fill:none; stroke:transparent; stroke-width:16; vector-effect:non-scaling-stroke; pointer-events:stroke; cursor:pointer;}
.cf-templink{fill:none; stroke:var(--cf-accent); stroke-width:2; stroke-dasharray:6 4; vector-effect:non-scaling-stroke; pointer-events:none;}

/* ---------- 节点 ---------- */
.cf-node{position:absolute; z-index:2; background:#1e1e27; border:1px solid #38384a; border-radius:10px;
  box-shadow:0 4px 16px rgba(0,0,0,.45); cursor:grab; min-width:200px;}
.cf-node:hover{border-color:#4a4a60;}
.cf-node.sel{border-color:var(--cf-accent); box-shadow:0 0 0 2px rgba(124,140,255,.28), 0 4px 16px rgba(0,0,0,.45);}
.cf-node-head{display:flex; align-items:center; gap:6px; padding:6px 8px; border-bottom:1px solid rgba(0,0,0,.35);
  border-radius:9px 9px 0 0; cursor:grab;}
.cf-grip{color:rgba(255,255,255,.4); font-size:9px; letter-spacing:-1px;}
.cf-node-title{font-size:12.5px; font-weight:600; color:#fff; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.cf-badge{font-size:10.5px; padding:1px 7px; border-radius:20px; border:1px solid; white-space:nowrap;}
.cf-node-body{padding:7px 10px 4px;}
.cf-widget{margin-bottom:6px;}
.cf-wlabel{display:block; font-size:10.5px; color:var(--cf-dim); margin-bottom:2px;}
.cf-in{width:100%; background:#16161d; color:var(--cf-text); border:1px solid var(--cf-border); border-radius:6px;
  padding:4px 7px; font-size:12px; font-family:inherit; outline:none;}
.cf-in:focus{border-color:var(--cf-accent);}
textarea.cf-in{resize:vertical; min-height:44px;}
select.cf-in{cursor:pointer;}
.cf-chk{display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--cf-dim); cursor:pointer; padding:2px 0;}
.cf-chk input{accent-color:var(--cf-accent);}
.cf-slots{display:flex; gap:14px; padding:2px 8px 7px;}
.cf-scol{flex:1; display:flex; flex-direction:column; gap:1px; min-width:0;}
.cf-scol.cf-right{align-items:flex-end;}
.cf-srow{display:flex; align-items:center; gap:5px; height:20px; font-size:11px; color:var(--cf-dim); min-width:0;}
.cf-srow span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.cf-port{width:14px; height:14px; flex:0 0 14px; display:flex; align-items:center; justify-content:center; cursor:crosshair;}
.cf-port .cf-dot{width:9px; height:9px; border-radius:50%; border:2px solid var(--pc,#94a3b8); background:#141419; transition:transform .1s, box-shadow .1s;}
.cf-port.on .cf-dot{background:var(--pc,#94a3b8);}
.cf-port.want .cf-dot{transform:scale(1.45);}
.cf-port.hot .cf-dot{box-shadow:0 0 0 4px rgba(124,140,255,.4); transform:scale(1.3);}
.cf-node-res{margin:0 8px 7px; padding:4px 8px; font-size:11px; border-radius:6px; background:#16161d;
  border-left:3px solid var(--rc,#8a8a98); color:var(--cf-dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

/* ---------- 空状态 ---------- */
.cf-empty{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; z-index:5;}
.cf-empty-card{pointer-events:auto; text-align:center; padding:30px 44px; border:1px dashed var(--cf-border2); border-radius:16px;
  background:rgba(22,22,30,.72); backdrop-filter:blur(4px);}
.cf-empty-logo{font-size:34px; color:var(--cf-accent);}
.cf-empty-title{font-size:16px; font-weight:600; margin:6px 0 2px;}
.cf-empty-sub{font-size:12px; color:var(--cf-dim); margin-bottom:16px;}
.cf-empty-btns{display:flex; gap:10px; justify-content:center;}
.cf-empty-hint{margin-top:14px; font-size:11px; color:#6d6d7c;}

/* ---------- 缩放控件 / 小地图 ---------- */
.cf-zoomer{position:absolute; left:10px; bottom:10px; display:flex; flex-direction:column; gap:4px; z-index:6;}
.cf-zoomer button{width:26px; height:26px; border-radius:7px; border:1px solid var(--cf-border); background:rgba(28,28,35,.92);
  color:var(--cf-text); cursor:pointer; display:flex; align-items:center; justify-content:center;}
.cf-zoomer button:hover{border-color:var(--cf-border2);}
.cf-zoomer svg{width:14px; height:14px;}
.cf-nav{position:absolute; left:10px; top:50%; transform:translateY(-50%); z-index:7; display:flex; flex-direction:column; gap:3px;
  padding:5px; border-radius:10px; background:rgba(24,24,31,.92); border:1px solid var(--cf-border); box-shadow:0 6px 20px rgba(0,0,0,.4);}
.cf-navbtn{display:flex; align-items:center; gap:6px; padding:5px 9px; border-radius:7px; border:1px solid transparent;
  background:none; color:var(--cf-text); font-size:11.5px; cursor:pointer; min-width:94px;}
.cf-navbtn:hover:not(:disabled){background:var(--cf-panel2);}
.cf-navbtn.active{background:rgba(124,140,255,.16); border-color:rgba(124,140,255,.45); color:#b9c2ff;}
.cf-navbtn:disabled{opacity:.35; cursor:default;}
.cf-navdot{width:8px; height:8px; border-radius:3px; flex:0 0 8px;}
.cf-navlabel{flex:1; text-align:left;}
.cf-navcount{font-size:10px; color:var(--cf-dim); min-width:14px; text-align:right;}
.cf-navbtn.active .cf-navcount{color:#b9c2ff;}
.cf-node{transition:opacity .25s;}
.cf-node.cf-hit{border-color:var(--cf-accent) !important; box-shadow:0 0 0 3px rgba(124,140,255,.35), 0 4px 16px rgba(0,0,0,.45);}
#codeflow-canvas.cf-focusing .cf-node:not(.cf-hit){opacity:.3;}
#codeflow-canvas.cf-focusing .cf-link{opacity:.12;}
.cf-mini{position:absolute; right:10px; bottom:10px; z-index:6; border:1px solid var(--cf-border); border-radius:8px; cursor:pointer; opacity:.94;}

/* ---------- 状态栏 ---------- */
.cf-status{display:flex; align-items:center; gap:8px; padding:5px 12px; background:var(--cf-panel); border-top:1px solid var(--cf-border);
  font-size:11.5px; color:var(--cf-dim);}
.cf-projname{background:none; border:none; color:var(--cf-text); font-size:12px; font-weight:600; cursor:pointer; padding:2px 4px; border-radius:5px;}
.cf-projname:hover{background:var(--cf-panel2);}
.cf-origin{font-size:10.5px; padding:1px 7px; border-radius:20px; border:1px solid var(--cf-border2); color:var(--cf-dim);}
.cf-sgrow{flex:1;}
.cf-sdot{color:#4a4a58;}
.cf-modetag{color:#d29922; font-size:10.5px; border:1px solid rgba(210,153,34,.4); padding:0 6px; border-radius:10px;}

/* ---------- 菜单 ---------- */
.cf-menu{position:absolute; z-index:60; min-width:190px; background:#20202a; border:1px solid var(--cf-border2); border-radius:10px;
  box-shadow:0 10px 30px rgba(0,0,0,.55); padding:5px; cursor:default;}
.cf-mitem{display:flex; align-items:center; gap:9px; width:100%; padding:6px 9px; border:none; background:none; color:var(--cf-text);
  font-size:12.5px; border-radius:7px; cursor:pointer; text-align:left;}
.cf-mitem:hover{background:rgba(124,140,255,.14);}
.cf-mitem.danger{color:#f87171;}
.cf-mitem svg{width:14px; height:14px; color:var(--cf-dim); flex:0 0 14px;}
.cf-mitem.danger svg{color:#f87171;}
.cf-mitem .cf-grow{flex:1;}
.cf-sub-arrow{color:var(--cf-dim); font-size:10px;}
.cf-msep{height:1px; background:var(--cf-border); margin:4px 6px;}

/* ---------- 对话框 ---------- */
.cf-modal{position:absolute; inset:0; z-index:80; background:rgba(8,8,12,.6); display:flex; align-items:center; justify-content:center; padding:16px;}
.cf-dialog{background:#1e1e27; border:1px solid var(--cf-border2); border-radius:14px; width:min(560px,100%); max-height:92%;
  display:flex; flex-direction:column; box-shadow:0 24px 60px rgba(0,0,0,.6);}
.cf-dhead{display:flex; align-items:center; gap:8px; padding:13px 16px 10px; font-size:14px; font-weight:600;}
.cf-dhead .cf-dicon{color:var(--cf-accent);}
.cf-dclose{margin-left:auto; background:none; border:none; color:var(--cf-dim); font-size:14px; cursor:pointer; padding:2px 6px; border-radius:6px;}
.cf-dclose:hover{background:var(--cf-panel2); color:var(--cf-text);}
.cf-dbody{padding:2px 16px 14px; overflow:auto;}
.cf-dfoot{display:flex; justify-content:flex-end; gap:8px; padding:10px 16px 14px; border-top:1px solid var(--cf-border);}
.cf-field{margin-bottom:11px;}
.cf-flabel{display:block; font-size:11.5px; color:var(--cf-dim); margin-bottom:4px;}
.cf-btn{padding:7px 14px; border-radius:8px; border:1px solid var(--cf-border); background:var(--cf-panel2); color:var(--cf-text);
  font-size:12.5px; cursor:pointer;}
.cf-btn:hover{border-color:var(--cf-border2); background:#2a2a38;}
.cf-btn.cf-primary{background:var(--cf-accent); border-color:var(--cf-accent); color:#0e0e14; font-weight:600;}
.cf-btn.cf-primary:hover{background:#8f9dff;}
.cf-btn.cf-danger{background:rgba(239,68,68,.15); border-color:rgba(239,68,68,.5); color:#f87171;}
.cf-hintbox{font-size:11.5px; color:var(--cf-dim); background:#16161d; border:1px solid var(--cf-border); border-radius:8px; padding:8px 10px; margin-bottom:11px;}
.cf-row2{display:flex; gap:10px;}
.cf-row2 .cf-field{flex:1;}
.cf-tlist{display:flex; flex-direction:column; gap:4px;}
.cf-trow{display:flex; align-items:center; gap:8px; padding:6px 8px; border:1px solid var(--cf-border); border-radius:8px; cursor:pointer; background:var(--cf-panel);}
.cf-trow:hover{border-color:var(--cf-accent);}
.cf-trow .cf-tdot{width:9px; height:9px; border-radius:3px; flex:0 0 9px;}
.cf-trow .cf-tname{font-size:12.5px;}
.cf-trow .cf-tdesc{font-size:11px; color:var(--cf-dim); margin-left:auto; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.cf-cathead{font-size:10.5px; color:var(--cf-dim); margin:8px 2px 3px; text-transform:uppercase; letter-spacing:.4px;}
.cf-kv{display:flex; gap:8px; font-size:12px; padding:3px 0; border-bottom:1px dashed var(--cf-border);}
.cf-kv:last-child{border-bottom:none;}
.cf-kv b{flex:0 0 76px; color:var(--cf-dim); font-weight:400; font-size:11.5px;}
.cf-kv span{flex:1; min-width:0; word-break:break-all;}
.cf-search{width:100%; margin-bottom:6px;}

/* ---------- 提示条 / 横幅 ---------- */
.cf-toasts{position:absolute; left:0; right:0; bottom:40px; z-index:90; display:flex; flex-direction:column; align-items:center; gap:6px; pointer-events:none;}
.cf-toast{background:#26262f; border:1px solid var(--cf-border2); color:var(--cf-text); font-size:12px; padding:7px 14px; border-radius:20px;
  box-shadow:0 6px 20px rgba(0,0,0,.4); max-width:80%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.cf-toast.err{border-color:rgba(239,68,68,.55); color:#fca5a5;}
.cf-toast.ok{border-color:rgba(34,197,94,.5); color:#86efac;}
.cf-banner{position:absolute; top:52px; left:50%; transform:translateX(-50%); z-index:70; display:flex; align-items:center; gap:9px;
  background:rgba(124,140,255,.14); border:1px solid rgba(124,140,255,.45); color:#c3cbff; font-size:12px; padding:7px 12px; border-radius:20px;
  backdrop-filter:blur(4px); max-width:86%;}
.cf-banner span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.cf-spin{display:inline-block; animation:cf-rot 1.1s linear infinite;}
@keyframes cf-rot{to{transform:rotate(360deg);}}
.cf-banner-x{background:none; border:none; color:#c3cbff; cursor:pointer; font-size:12px; padding:0 2px;}
</style>

<script>
(function(){
'use strict';
var ROOT=document.getElementById('codeflow-canvas');
if(!ROOT)return;
var EMBED=__CF_GRAPH_JSON__;
var ZC=(typeof window.zcode==='object'&&window.zcode)?window.zcode:null;

/* ================= 节点类型库（与 references/node-types.md 保持一致） ================= */
var LANGS=['python','javascript','typescript','java','go','rust','c/cpp','csharp','ruby','php','其他'];
var TYPES={
  requirement:{label:'需求输入',cat:'input',color:'#3b82f6',w:250,desc:'定义目标与约束，工作流起点',
    ins:[],outs:[['需求','text']],
    widgets:[['brief','textarea','需求描述',''],['language','select','语言','python',LANGS]]},
  scan:{label:'项目扫描',cat:'input',color:'#3b82f6',w:250,desc:'扫描目录，统计语言与文件',
    ins:[],outs:[['结构报告','json'],['文件清单','file']],
    widgets:[['path','text','项目路径',''],['recursive','bool','递归子目录',true],['maxFiles','number','最大文件数',200]]},
  readfile:{label:'文件读取',cat:'input',color:'#3b82f6',w:240,desc:'读取单个文件内容',
    ins:[],outs:[['内容','text']],
    widgets:[['path','text','文件路径','']]},
  design:{label:'技术方案',cat:'think',color:'#8b5cf6',w:250,desc:'把需求变成实现方案',
    ins:[['需求','text']],outs:[['方案','json']],
    widgets:[['depth','select','详略','标准',['简洁','标准','详尽']],['notes','textarea','补充约束','']]},

/* ================= 工具函数 ================= */

function rgba(hex,a){var h=String(hex).replace('#','');return 'rgba('+parseInt(h.substr(0,2),16)+','+parseInt(h.substr(2,2),16)+','+parseInt(h.substr(4,2),16)+','+a+')';}

/* ================= 启动 ================= */
function boot(){
  var src=EMBED,restored=false;
  try{
    var st=ZC&&ZC.widgetState&&ZC.widgetState.privateContent;
    if(st&&valid(st.graph)&&st.graph.rev>=(EMBED&&EMBED.rev||0)){
      src=st.graph;restored=true;
      var v=st.view;
      if(Array.isArray(v)&&v.length===3){view={x:v[0],y:v[1],k:v[2]};}
    }
  }catch(e){}
  if(!restored&&!ZC){
    try{
      var ls=JSON.parse(localStorage.getItem('cf-canvas-standalone')||'null');
      if(ls&&valid(ls.graph)&&ls.graph.rev>=(EMBED&&EMBED.rev||0)){
        src=ls.graph;restored=true;
        var v2=ls.view;
        if(Array.isArray(v2)&&v2.length===3){view={x:v2[0],y:v2[1],k:v2[2]};}
      }
    }catch(e){}
  }
  if(!valid(src)){src={format:'codeflow/1',rev:0,project:null,nodes:[],links:[],meta:{}};}
  G=clone(src);
  if(!G.meta)G.meta={};
  /* 清洗连线：丢弃引用缺失节点/越界端口的连线；输入端口只保留最后一条入线 */
  G.links=G.links.filter(function(l){
    if(!Array.isArray(l)||l.length<4)return false;
    var f=byId(l[0]),t=byId(l[2]);
    if(!f||!t)return false;
    return (typeOf(f).outs||[])[l[1]]&&(typeOf(t).ins||[])[l[3]];
  });
  (function(){var seen={},out=[];for(var i=G.links.length-1;i>=0;i--){var k=G.links[i][2]+'_'+G.links[i][3];if(seen[k])continue;seen[k]=1;out.push(G.links[i]);}out.reverse();G.links=out;})();
  renderAll();
  applyView();
  if(G.nodes.length&&!restored){requestAnimationFrame(function(){fitView();});}
  if(!ZC){$('cf-mode').hidden=false;}
  saveState();
}

function buildNode(n){

/* ================= 视图变换 ================= */
function stageRect(){return $('cf-stage').getBoundingClientRect();}
function applyView(){
  $('cf-world').style.transform='translate('+view.x+'px,'+view.y+'px) scale('+view.k+')';
  var st=$('cf-stage');
  st.style.backgroundSize=(22*view.k)+'px '+(22*view.k)+'px';
  st.style.backgroundPosition=view.x+'px '+view.y+'px';
  $('cf-zoomlab').textContent=Math.round(view.k*100)+'%';
  drawMini();
}
function toWorld(cx,cy){var r=stageRect();return[(cx-r.left-view.x)/view.k,(cy-r.top-view.y)/view.k];}
function zoomAt(cx,cy,f){
  var nk=Math.max(0.2,Math.min(2.5,view.k*f));
  f=nk/view.k;
  view.x=cx-(cx-view.x)*f;view.y=cy-(cy-view.y)*f;view.k=nk;
  applyView();
}
function fitView(){
  clearNavActive();
  if(!G.nodes.length)return;
  var minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;
  G.nodes.forEach(function(n){
    var el=nodeEls[n.id],w=el?el.offsetWidth:(typeOf(n).w||240),h=el?el.offsetHeight:130;
    minx=Math.min(minx,n.pos[0]);miny=Math.min(miny,n.pos[1]);
    maxx=Math.max(maxx,n.pos[0]+w);maxy=Math.max(maxy,n.pos[1]+h);
  });
  var r=stageRect(),cw=Math.max(60,r.width-140),ch=Math.max(60,r.height-140);
  var k=Math.min(cw/Math.max(60,maxx-minx),ch/Math.max(60,maxy-miny));
  k=Math.max(0.2,Math.min(1.35,k));
  view.k=k;
  view.x=(r.width-(maxx-minx)*k)/2-minx*k;
  view.y=(r.height-(maxy-miny)*k)/2-miny*k;
  applyView();
}

/* ================= 模块导航（左侧选项卡） ================= */
var REDUCED=false;
try{REDUCED=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){}
function cancelAnim(){if(anim){cancelAnimationFrame(anim.raf);anim=null;}}
function animateView(tx,ty,tk,ms){
  cancelAnim();
  if(REDUCED){view.x=tx;view.y=ty;view.k=tk;applyView();return;}
  var sx=view.x,sy=view.y,sk=view.k,t0=null;
  var a={raf:0};anim=a;
  function step(t){
    if(anim!==a)return;
    if(!t0)t0=t;
    var p=Math.min(1,(t-t0)/ms);p=1-Math.pow(1-p,3);
    view.x=sx+(tx-sx)*p;view.y=sy+(ty-sy)*p;view.k=sk+(tk-sk)*p;
    applyView();
    if(p<1){a.raf=requestAnimationFrame(step);}else{anim=null;}
  }
  a.raf=requestAnimationFrame(step);
}
function typeColor(cat){for(var k in TYPES){if(TYPES[k].cat===cat)return TYPES[k].color;}return '#64748b';}
function renderNav(){
  var nav=$('cf-nav');
  nav.innerHTML='';
  CATS.forEach(function(c){
    var cnt=0;
    G.nodes.forEach(function(n){if(typeOf(n).cat===c[0])cnt++;});
    var b=document.createElement('button');
    b.type='button';
    b.className='cf-navbtn'+(navActive===c[0]?' active':'');
    b.setAttribute('role','tab');
    b.setAttribute('aria-selected',navActive===c[0]?'true':'false');
    b.disabled=cnt===0;
    b.title=cnt?('定位并高亮'+c[1]+'类节点（'+cnt+'）'):('画布上暂无'+c[1]+'类节点');
    b.innerHTML='<span class="cf-navdot" style="background:'+typeColor(c[0])+'"></span>'
      +'<span class="cf-navlabel">'+esc(c[1])+'</span><span class="cf-navcount">'+cnt+'</span>';
    if(cnt)b.addEventListener('click',function(){focusCategory(c[0]);});
    nav.appendChild(b);
  });
}
function focusCategory(cat){
  var ns=G.nodes.filter(function(n){return typeOf(n).cat===cat;});
  if(!ns.length)return;
  navActive=cat;renderNav();
  var minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;
  ns.forEach(function(n){
    var el=nodeEls[n.id],w=el?el.offsetWidth:(typeOf(n).w||240),h=el?el.offsetHeight:130;
    minx=Math.min(minx,n.pos[0]);miny=Math.min(miny,n.pos[1]);
    maxx=Math.max(maxx,n.pos[0]+w);maxy=Math.max(maxy,n.pos[1]+h);
  });
  var cx=(minx+maxx)/2,cy=(miny+maxy)/2;
  var r=stageRect();
  var fitK=Math.min((r.width-160)/Math.max(60,maxx-minx),(r.height-160)/Math.max(60,maxy-miny));
  fitK=Math.max(0.35,Math.min(fitK,Math.max(view.k,1.1)));
  animateView(r.width/2-cx*fitK,r.height/2-cy*fitK,fitK,340);
  ROOT.classList.add('cf-focusing');
  G.nodes.forEach(function(n){var el=nodeEls[n.id];if(el)el.classList.toggle('cf-hit',typeOf(n).cat===cat);});
  if(focusTimer)clearTimeout(focusTimer);
  focusTimer=setTimeout(function(){
    ROOT.classList.remove('cf-focusing');
    G.nodes.forEach(function(n){var el=nodeEls[n.id];if(el)el.classList.remove('cf-hit');});
  },1700);
}
function clearNavActive(){
  if(!navActive)return;
  navActive=null;renderNav();
}

/* ================= 连线渲染 ================= */
var nodeEls={};
function nodeEl(id){return nodeEls[id]||null;}
function setPortOn(id,kind,slot,on){
  var el=document.querySelector('#cf-nodes .cf-port[data-node="'+id+'"][data-kind="'+kind+'"][data-slot="'+slot+'"]');
  if(el)el.classList.toggle('on',!!on);
}
function portAnchor(id,kind,slot){
  var el=document.querySelector('#cf-nodes .cf-port[data-node="'+id+'"][data-kind="'+kind+'"][data-slot="'+slot+'"]');
  var n=byId(id);
  if(!el||!n)return null;
  /* 用 offset 布局值推导世界坐标，避免依赖测量时刻的视图变换 */
  return [n.pos[0]+el.offsetLeft+el.offsetWidth/2, n.pos[1]+el.offsetTop+el.offsetHeight/2];
}
/* 每条连线一个独立小 SVG：避免巨型合成图层（GPU 纹理上限会导致整组连线消失） */
var LPAD=48;
function linkPath(a,b,ox,oy){
  var dx=Math.max(40,Math.min(190,Math.abs(b[0]-a[0])*0.55));
  return 'M '+(a[0]-ox)+' '+(a[1]-oy)
    +' C '+(a[0]+dx-ox)+' '+(a[1]-oy)+', '+(b[0]-dx-ox)+' '+(b[1]-oy)
    +', '+(b[0]-ox)+' '+(b[1]-oy);
}
function redrawLinks(){
  var box=$('cf-links');
  box.innerHTML='';
  tempSvg=null;tempPath=null;
  G.nodes.forEach(function(n){var t=typeOf(n);
    (t.ins||[]).forEach(function(_,i){setPortOn(n.id,'in',i,false);});
    (t.outs||[]).forEach(function(_,i){setPortOn(n.id,'out',i,false);});
  });
  var NS='http://www.w3.org/2000/svg';
  G.links.forEach(function(l,idx){
    var a=portAnchor(l[0],'out',l[1]),b=portAnchor(l[2],'in',l[3]);
    if(!a||!b)return;
    setPortOn(l[0],'out',l[1],true);setPortOn(l[2],'in',l[3],true);
    var x=Math.min(a[0],b[0])-LPAD,y=Math.min(a[1],b[1])-LPAD;
    var w=Math.abs(a[0]-b[0])+2*LPAD,h=Math.abs(a[1]-b[1])+2*LPAD;
    var svg=document.createElementNS(NS,'svg');
    svg.setAttribute('class','cf-linksvg');
    svg.setAttribute('width',Math.max(1,Math.round(w)));
    svg.setAttribute('height',Math.max(1,Math.round(h)));
    svg.style.left=x+'px';svg.style.top=y+'px';
    svg.style.width=Math.round(w)+'px';svg.style.height=Math.round(h)+'px';
    svg.style.setProperty('max-width','none','important');
    svg.style.setProperty('max-height','none','important');
    var d=linkPath(a,b,x,y);
    var hit=document.createElementNS(NS,'path');
    hit.setAttribute('d',d);hit.setAttribute('class','cf-link-hit');hit.setAttribute('data-link',idx);
    var vis=document.createElementNS(NS,'path');
    vis.setAttribute('d',d);vis.setAttribute('class','cf-link'+(sel.type==='link'&&sel.id===idx?' sel':''));
    svg.appendChild(hit);svg.appendChild(vis);
    box.appendChild(svg);
  });
  drawMini();
}
/* 拖拽中的临时连线：同样使用独立小 SVG */
var tempSvg=null,tempPath=null;
function ensureTempLink(){
  if(tempSvg&&tempSvg.isConnected)return;
  var NS='http://www.w3.org/2000/svg';
  tempSvg=document.createElementNS(NS,'svg');
  tempSvg.setAttribute('class','cf-linksvg');
  tempPath=document.createElementNS(NS,'path');
  tempPath.setAttribute('class','cf-templink');
  tempSvg.appendChild(tempPath);
  $('cf-links').appendChild(tempSvg);
}
function updateTempLink(a,b){
  ensureTempLink();
  var x=Math.min(a[0],b[0])-LPAD,y=Math.min(a[1],b[1])-LPAD;
  var w=Math.abs(a[0]-b[0])+2*LPAD,h=Math.abs(a[1]-b[1])+2*LPAD;
  tempSvg.style.display='';
  tempSvg.style.left=x+'px';tempSvg.style.top=y+'px';
  tempSvg.setAttribute('width',Math.max(1,Math.round(w)));
  tempSvg.setAttribute('height',Math.max(1,Math.round(h)));
  tempSvg.style.width=Math.round(w)+'px';tempSvg.style.height=Math.round(h)+'px';
  tempSvg.style.setProperty('max-width','none','important');
  tempSvg.style.setProperty('max-height','none','important');
  tempPath.setAttribute('d',linkPath(a,b,x,y));
}
function hideTempLink(){
  if(tempSvg)tempSvg.style.display='none';
  if(tempPath)tempPath.setAttribute('d','');
}

/* ================= 小地图 ================= */
function drawMini(){
  var c=$('cf-mini');if(!c)return;
  var ctx=c.getContext('2d'),W=c.width,H=c.height;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='rgba(18,18,24,.92)';ctx.fillRect(0,0,W,H);
  if(!G.nodes.length)return;
  var minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;
  G.nodes.forEach(function(n){
    var el=nodeEls[n.id],w=el?el.offsetWidth:(typeOf(n).w||240),h=el?el.offsetHeight:130;
    minx=Math.min(minx,n.pos[0]);miny=Math.min(miny,n.pos[1]);
    maxx=Math.max(maxx,n.pos[0]+w);maxy=Math.max(maxy,n.pos[1]+h);
  });
  var bw=Math.max(1,maxx-minx),bh=Math.max(1,maxy-miny);
  var s=Math.min((W-14)/bw,(H-14)/bh,0.6);
  var ox=(W-bw*s)/2,oy=(H-bh*s)/2;
  var stroke=ctx.strokeStyle;ctx.strokeStyle='rgba(99,99,111,.7)';ctx.lineWidth=1;
  function miniCenter(n){
    var el=nodeEls[n.id];
    var w=el?el.offsetWidth:(typeOf(n).w||240),h=el?el.offsetHeight:130;
    return [ox+(n.pos[0]+w/2-minx)*s,oy+(n.pos[1]+h/2-miny)*s];
  }
  G.links.forEach(function(l){
    var a=byId(l[0]),b=byId(l[2]);if(!a||!b)return;
    var ca=miniCenter(a),cb=miniCenter(b);
    ctx.beginPath();
    ctx.moveTo(ca[0],ca[1]);
    ctx.lineTo(cb[0],cb[1]);
    ctx.stroke();
  });
  G.nodes.forEach(function(n){
    var el=nodeEls[n.id],w=Math.max(4,(el?el.offsetWidth:240)*s),h=Math.max(3,(el?el.offsetHeight:130)*s);
    var stc=(STC[n.status]||STC.pending)[1];
    ctx.fillStyle=stc;
    ctx.globalAlpha=n.status==='pending'?0.55:0.9;
    ctx.fillRect(ox+(n.pos[0]-minx)*s,oy+(n.pos[1]-miny)*s,w,h);
    ctx.globalAlpha=1;
  });
  ctx.strokeStyle=stroke;
  var r=stageRect();
  var vx0=(0-view.x)/view.k,vy0=(0-view.y)/view.k;
  var vx1=(r.width-view.x)/view.k,vy1=(r.height-view.y)/view.k;
  ctx.strokeStyle='rgba(124,140,255,.8)';
  ctx.strokeRect(ox+(vx0-minx)*s,oy+(vy0-miny)*s,(vx1-vx0)*s,(vy1-vy0)*s);
  c._map={minx:minx,miny:miny,s:s,ox:ox,oy:oy};
}
function miniJump(e){
  var c=$('cf-mini'),m=c._map;if(!m)return;
  var r=c.getBoundingClientRect();
  var wx=(e.clientX-r.left-m.ox)/m.s+m.minx;
  var wy=(e.clientY-r.top-m.oy)/m.s+m.miny;
  var sr=stageRect();
  view.x=sr.width/2-wx*view.k;view.y=sr.height/2-wy*view.k;
  applyView();
}
$('cf-mini').addEventListener('pointerdown',function(e){e.stopPropagation();miniJump(e);
  var mv=function(ev){miniJump(ev);};
  var up=function(){window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);};
  window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up);
});

/* ================= 指针交互 ================= */
var stage=$('cf-stage');
stage.addEventListener('pointerdown',onDown);
window.addEventListener('pointermove',onMove);
window.addEventListener('pointerup',onUp);
stage.addEventListener('wheel',onWheel,{passive:false});
stage.addEventListener('dblclick',onDbl);
ROOT.addEventListener('contextmenu',onCtx);
window.addEventListener('keydown',onKey);
window.addEventListener('keyup',function(e){if(e.key===' '){spaceDown=false;ROOT.classList.remove('dragging');}});
window.addEventListener('resize',drawMini);

function isBg(t){return !t.closest('.cf-node')&&!t.closest('.cf-link-hit')&&!t.closest('.cf-mini')&&!t.closest('.cf-zoomer')&&!t.closest('.cf-menu')&&!t.closest('.cf-modal')&&!t.closest('.cf-banner');}

function onDown(e){
  if(e.button===2)return;
  cancelAnim();
  closeMenus();
  var tgt=e.target;
  if(tgt.closest('.cf-nav'))return;
  if(tgt.closest('.cf-mini')||tgt.closest('.cf-zoomer')||tgt.closest('.cf-banner'))return;
  var port=tgt.closest('.cf-port');
  if(e.button===0&&port){startPortDrag(e,port);return;}
  if(e.button===1||spaceDown||(e.button===0&&isBg(tgt))){
    clearNavActive();
    mode='pan';
    drag={sx:e.clientX,sy:e.clientY,vx:view.x,vy:view.y};
    ROOT.classList.add('dragging');
    if(e.button===0&&isBg(tgt)){sel={type:null,id:null};markSel();redrawLinks();}
    e.preventDefault();
    return;
  }
  var node=tgt.closest('.cf-node');
  if(e.button===0&&node){
    var id=node.dataset.id;
    if(tgt.closest('.cf-widget')||tgt.closest('input')||tgt.closest('select')||tgt.closest('textarea')){
      sel={type:'node',id:id};markSel();redrawLinks();return;
    }
    sel={type:'node',id:id};markSel();redrawLinks();
    var n=byId(id);
    mode='node';
    var w=toWorld(e.clientX,e.clientY);
    drag={id:id,ox:w[0]-n.pos[0],oy:w[1]-n.pos[1],moved:false,sx:e.clientX,sy:e.clientY};
    e.preventDefault();
    return;
  }
  var link=tgt.closest('.cf-link-hit');
  if(e.button===0&&link){
    sel={type:'link',id:Number(link.dataset.link)};markSel();redrawLinks();
  }
}
function markSel(){
  var wrap=$('cf-nodes');
  Array.prototype.forEach.call(wrap.children,function(el){
    el.classList.toggle('sel',sel.type==='node'&&sel.id===el.dataset.id);
  });
}
function onMove(e){
  if(mode==='pan'&&drag){
    view.x=drag.vx+(e.clientX-drag.sx);view.y=drag.vy+(e.clientY-drag.sy);
    applyView();return;
  }
  if(mode==='node'&&drag){
    if(!drag.moved&&Math.abs(e.clientX-drag.sx)+Math.abs(e.clientY-drag.sy)<4)return;
    drag.moved=true;
    var n=byId(drag.id);if(!n)return;
    var w=toWorld(e.clientX,e.clientY);
    n.pos=[Math.round(w[0]-drag.ox),Math.round(w[1]-drag.oy)];
    var el=nodeEls[drag.id];
    if(el){el.style.left=n.pos[0]+'px';el.style.top=n.pos[1]+'px';}
    redrawLinks();
    return;
  }
  if(mode==='port'&&drag){
    var w2=toWorld(e.clientX,e.clientY);
    updateTempLink(drag.anchor,w2);
    var under=document.elementFromPoint(e.clientX,e.clientY);
    var p=under&&under.closest?under.closest('.cf-port'):null;
    document.querySelectorAll('#cf-nodes .cf-port.hot').forEach(function(el){el.classList.remove('hot');});
    if(p&&isCompatTarget(drag.from,p)){p.classList.add('hot');}
  }
}
function onUp(e){
  if(mode==='pan'){mode='idle';drag=null;ROOT.classList.remove('dragging');return;}
  if(mode==='node'){
    var wasDrag=drag&&drag.moved;
    mode='idle';drag=null;ROOT.classList.remove('dragging');
    if(wasDrag)saveState(true);
    return;
  }
  if(mode==='port'){
    hideTempLink();
    document.querySelectorAll('#cf-nodes .cf-port.hot').forEach(function(el){el.classList.remove('hot');});
    document.querySelectorAll('#cf-nodes .cf-port.want').forEach(function(el){el.classList.remove('want');});
    ROOT.classList.remove('linking');
    var from=drag.from;
    mode='idle';drag=null;
    var under=document.elementFromPoint(e.clientX,e.clientY);
    var pe=under&&under.closest?under.closest('.cf-port'):null;
    if(pe&&isCompatTarget(from,pe)){
      finishConnect(from,pe.dataset);
      return;
    }
    var ne=under&&under.closest?under.closest('.cf-node'):null;
    if(ne&&ne.dataset.id!==from.node){
      var n=byId(ne.dataset.id),t=typeOf(n);
      var kind=from.kind==='out'?'in':'out';
      var list=kind==='in'?(t.ins||[]):(t.outs||[]);
      for(var i=0;i<list.length;i++){
        if(compat(from.type,list[i][1])){finishConnect(from,{node:n.id,kind:kind,slot:String(i),ptype:list[i][1]});return;}
      }
      toast('该节点没有兼容的端口','err');return;
    }
  }
}
function onWheel(e){
  if(e.target.closest('.cf-modal'))return;
  if(mode!=='idle')return;
  e.preventDefault();
  cancelAnim();clearNavActive();
  var r=stageRect();
  zoomAt(e.clientX-r.left,e.clientY-r.top,e.deltaY<0?1.12:1/1.12);
}
function onDbl(e){
  if(e.target.closest('.cf-node')){
    var id=e.target.closest('.cf-node').dataset.id;
    openDetails(id);return;
  }
  if(e.target.closest('.cf-modal')||e.target.closest('.cf-mini')||e.target.closest('.cf-zoomer'))return;
  var w=toWorld(e.clientX,e.clientY);
  openAddDialog(w);
}
function onCtx(e){
  if(e.target.closest('input')||e.target.closest('textarea'))return;
  e.preventDefault();
  closeMenus();
  var rr=ROOT.getBoundingClientRect();
  var x=e.clientX-rr.left,y=e.clientY-rr.top;
  var node=e.target.closest('.cf-node');
  if(node){openNodeMenu(node.dataset.id,x,y);return;}
  var link=e.target.closest('.cf-link-hit');
  if(link){openLinkMenu(Number(link.dataset.link),x,y);return;}
  openCanvasMenu(x,y);
}
function onKey(e){
  if(e.key==='Escape'){closeMenus();closeModal();return;}
  var tag=(e.target.tagName||'').toLowerCase();
  if(tag==='input'||tag==='textarea'||tag==='select')return;
  if(e.key===' '&&!spaceDown){spaceDown=true;ROOT.classList.add('dragging');e.preventDefault();return;}
  if((e.key==='Delete'||e.key==='Backspace')&&sel.type){
    e.preventDefault();deleteSel();
  }
}

/* ================= 连线逻辑 ================= */
function compat(a,b){return a===b||a==='any'||b==='any';}
function isCompatTarget(from,portEl){
  var d=portEl.dataset;
  if(d.node===from.node)return false;
  if(d.kind===from.kind)return false;
  return compat(from.type,d.ptype);
}
function createsCycle(fromId,toId){
  var adj={};
  G.links.forEach(function(l){(adj[l[0]]=adj[l[0]]||[]).push(l[2]);});
  var stack=[toId],seen={};
  while(stack.length){
    var x=stack.pop();
    if(x===fromId)return true;
    if(seen[x])continue;seen[x]=1;
    (adj[x]||[]).forEach(function(y){stack.push(y);});
  }
  return false;
}
function startPortDrag(e,port){
  var d=port.dataset;
  var from={node:d.node,kind:d.kind,slot:Number(d.slot),type:d.ptype};
  var anchor=portAnchor(from.node,from.kind,from.slot);
  if(!anchor)return;
  mode='port';drag={from:from,anchor:anchor};
  sel={type:null,id:null};markSel();redrawLinks();
  ROOT.classList.add('linking');
  document.querySelectorAll('#cf-nodes .cf-port').forEach(function(el){
    var dd=el.dataset;
    if(dd.node===from.node||dd.kind===from.kind)return;
    if(compat(from.type,dd.ptype))el.classList.add('want');
  });
  e.preventDefault();
}
function finishConnect(from,to){
  if(from.kind==='in'){
    var fi=from;
    from={node:to.node,kind:'out',slot:Number(to.slot),type:to.ptype};
    to=fi;
  }
  var fs=Number(from.slot),ts=Number(to.slot);
  if(createsCycle(from.node,to.node)){toast('不允许成环','err');return;}
  var tt=typeOf(byId(to.node));
  var inDef=(tt.ins||[])[ts];
  if(!inDef){toast('目标端口不存在','err');return;}
  if(!compat(from.type,inDef[1])){toast('端口类型不匹配：'+from.type+' → '+inDef[1],'err');return;}
  for(var i=G.links.length-1;i>=0;i--){
    var l=G.links[i];
    if(l[2]===to.node&&l[3]===ts)G.links.splice(i,1);
  }
  G.links.push([from.node,fs,to.node,ts]);
  resetFrom(to.node,true);
  redrawLinks();saveState(true);
  toast('已连接','ok');
}
function resetFrom(nodeId,quiet){
  var adj={};
  G.links.forEach(function(l){(adj[l[0]]=adj[l[0]]||[]).push(l[2]);});
  var stack=[nodeId],seen={},touched=0;
  while(stack.length){
    var x=stack.pop();
    if(seen[x])continue;seen[x]=1;
    var n=byId(x);
    if(n&&(n.status==='done'||n.status==='failed'||n.status==='skipped')){n.status='pending';n.result='';n.detail='';touched++;}
    (adj[x]||[]).forEach(function(y){stack.push(y);});
  }
  if(touched){renderNodes();redrawLinks();markSel();if(!quiet)toast('已重置 '+touched+' 个受影响节点');}
}
function deleteSel(){
  if(sel.type==='node'){
    var id=sel.id,n=byId(id);
    if(!n)return;
    G.nodes=G.nodes.filter(function(x){return x.id!==id;});
    G.links=G.links.filter(function(l){return l[0]!==id&&l[2]!==id;});
    sel={type:null,id:null};
    renderAll();saveState(true);
    toast('已删除节点「'+(n.title||typeOf(n).label)+'」');
  }else if(sel.type==='link'){
    G.links.splice(sel.id,1);
    sel={type:null,id:null};
    redrawLinks();saveState(true);
    toast('已删除连线');
  }
}

/* ================= 节点操作 ================= */
function nextId(){
  var seq=G.seq||0,max=seq;
  G.nodes.forEach(function(n){var m=/^n(\d+)$/.exec(n.id);if(m)max=Math.max(max,Number(m[1]));});
  max++;G.seq=max;return 'n'+max;
}
function addNode(type,pos){
  var t=TYPES[type];if(!t){toast('未知节点类型','err');return null;}
  var params={};
  (t.widgets||[]).forEach(function(w){params[w[0]]=w[3];});
  var n={id:nextId(),type:type,title:t.label,pos:pos||[0,0],params:params,status:'pending',result:'',detail:''};
  G.nodes.push(n);
  renderNodes();redrawLinks();renderChrome();updateEmpty();renderNav();saveState(true);
  return n;
}
function autoLayout(){
  if(!G.nodes.length)return;
  var depth={};
  G.nodes.forEach(function(n){depth[n.id]=0;});
  var changed=true,guard=0;
  while(changed&&guard++<300){
    changed=false;
    G.links.forEach(function(l){
      if(depth[l[2]]<depth[l[0]]+1){depth[l[2]]=depth[l[0]]+1;changed=true;}
    });
  }
  var layers={};
  G.nodes.forEach(function(n){(layers[depth[n.id]]=layers[depth[n.id]]||[]).push(n);});
  var x=60;
  Object.keys(layers).map(Number).sort(function(a,b){return a-b;}).forEach(function(d){
    var y=60;
    layers[d].forEach(function(n){n.pos=[x,y];var el=nodeEls[n.id];y+=(el?el.offsetHeight:130)+36;});
    x+=330;
  });
  renderNodes();redrawLinks();fitView();saveState(true);
}

/* ================= 菜单 ================= */
var MENUS=[];
function closeMenus(){MENUS.forEach(function(m){if(m.parentNode)m.parentNode.removeChild(m);});MENUS=[];}
function openMenu(items,x,y,level){
  level=level||0;
  MENUS=menusUpTo(level);
  var m=document.createElement('div');
  m.className='cf-menu';
  items.forEach(function(it){
    if(it.sep){var s=document.createElement('div');s.className='cf-msep';m.appendChild(s);return;}
    var b=document.createElement('button');
    b.type='button';b.className='cf-mitem'+(it.danger?' danger':'');
    b.innerHTML='<i data-lucide="'+it.icon+'"></i><span class="cf-grow">'+esc(it.label)+'</span>'+(it.sub?'<span class="cf-sub-arrow">▶</span>':'');
    if(it.sub){
      b.addEventListener('pointerenter',function(){
        var r=b.getBoundingClientRect(),rr=ROOT.getBoundingClientRect();
        openMenu(it.sub,r.right-rr.left+2,r.top-rr.top,level+1);
      });
    }else{
      b.addEventListener('pointerenter',function(){MENUS=menusUpTo(level+1);});
      b.addEventListener('click',function(){closeMenus();it.act();});
    }
    m.appendChild(b);
  });
  ROOT.appendChild(m);MENUS.push(m);
  var mw=m.offsetWidth,mh=m.offsetHeight,rr2=ROOT.getBoundingClientRect();
  m.style.left=Math.max(4,Math.min(x,rr2.width-mw-6))+'px';
  m.style.top=Math.max(4,Math.min(y,rr2.height-mh-6))+'px';
  refreshIcons();
  return m;
}
function menusUpTo(level){var keep=MENUS.slice(0,level);MENUS.slice(level).forEach(function(m){if(m.parentNode)m.parentNode.removeChild(m);});return keep;}
document.addEventListener('pointerdown',function(e){
  if(MENUS.length&&!e.target.closest('.cf-menu'))closeMenus();
},true);

function openCanvasMenu(x,y){
  var addSub=CATS.map(function(c){
    return {label:c[1]+'节点',icon:'shapes',sub:Object.keys(TYPES).filter(function(k){return TYPES[k].cat===c[0];}).map(function(k){
      return {label:TYPES[k].label,icon:'plus',act:function(){var n=addNode(k,[xToWorld(x),yToWorld(y)]);if(n){sel={type:'node',id:n.id};markSel();}}};
    })};
  });
  openMenu([
    {label:'新建项目…',icon:'file-plus-2',act:function(){openNewDialog();}},
    {label:'导入项目…',icon:'folder-open',act:function(){openImportDialog();}},
    {sep:true},
    {label:'添加节点',icon:'shapes',sub:addSub},
    {label:'整理布局',icon:'layout-list',act:autoLayout},
    {label:'适应视图',icon:'maximize',act:fitView},
    {sep:true},
    {label:'运行全部',icon:'play',act:runAll},
    {label:'保存项目',icon:'save',act:saveProject},
    {sep:true},
    {label:'清空画布',icon:'trash-2',danger:true,act:function(){
      if(!G.nodes.length)return;
      openConfirm('清空画布','将移除全部节点与连线（不影响磁盘文件）。确定继续？',function(){
        G.nodes=[];G.links=[];G.project=null;sel={type:null,id:null};renderAll();saveState(true);
      });
    }},
    {label:'使用帮助',icon:'info',act:openHelp}
  ],x,y);
}
function openNodeMenu(id,x,y){
  var n=byId(id);if(!n)return;
  var t=typeOf(n);
  var items=[
    {label:'运行此节点（含上游）',icon:'play',act:function(){runNode(id,false);}},
    {label:'重跑此节点',icon:'rotate-cw',act:function(){runNode(id,true);}},
    {sep:true},
    {label:'查看详情',icon:'info',act:function(){openDetails(id);}},
    {label:'重命名',icon:'pencil',act:function(){openPrompt('重命名节点','节点名称',n.title||t.label,function(v){n.title=v;renderNodes();redrawLinks();saveState(true);});}},
    {label:'复制节点',icon:'copy',act:function(){
      var c=clone(n);c.id=nextId();c.title=(n.title||t.label)+' 副本';c.status='pending';c.result='';c.detail='';
      c.pos=[n.pos[0]+30,n.pos[1]+30];
      G.nodes.push(c);renderNodes();redrawLinks();saveState(true);
    }},

function openLinkMenu(idx,x,y){
  openMenu([{label:'删除连线',icon:'unlink',danger:true,act:function(){sel={type:'link',id:idx};deleteSel();}}],x,y);
}
function xToWorld(mx){return (mx-stageRect().left-view.x)/view.k;}
function yToWorld(my){return (my-stageRect().top-view.y)/view.k;}

/* ================= 对话框 ================= */
function openModal(html){

$('cf-modal').addEventListener('pointerdown',function(e){if(e.target===$('cf-modal'))closeModal();});
$('cf-modal').addEventListener('keydown',function(e){
  if($('cf-modal').hidden)return;

    var name=d.querySelector('[data-f="name"]').value.trim();
    var brief=d.querySelector('[data-f="brief"]').value.trim();
    if(!name){toast('请填写项目名称','err');return;}
    if(!brief){toast('请填写需求描述','err');return;}
    var lang=d.querySelector('[data-f="language"]').value;
    var auto=d.querySelector('[data-f="autoRun"]').checked;
    closeModal();
    sendMessage('NEW',{project:{name:name,language:lang},brief:brief,autoRun:auto},'CodeFlow · 新建项目');
  });
}

    +'<div class="cf-field"><label class="cf-chk"><input type="checkbox" data-f="addTests" checked> <span>未发现测试文件时，自动添加「测试生成」节点</span></label></div>'

function openAddDialog(worldPos){
  function listHtml(q){
    var html='';
    CATS.forEach(function(c){
      var ks=Object.keys(TYPES).filter(function(k){return TYPES[k].cat===c[0];});
      var vis=ks.filter(function(k){
        var t=TYPES[k];
        return !q||t.label.indexOf(q)>=0||k.indexOf(q.toLowerCase())>=0||t.desc.indexOf(q)>=0;
      });
      if(!vis.length)return;
      html+='<div class="cf-cathead">'+esc(c[1])+'</div><div class="cf-tlist">';
      vis.forEach(function(k){var t=TYPES[k];
        html+='<div class="cf-trow" data-type="'+k+'" role="button" tabindex="0"><span class="cf-tdot" style="background:'+t.color+'"></span>'
          +'<span class="cf-tname">'+esc(t.label)+'</span><span class="cf-tdesc">'+esc(t.desc)+'</span></div>';
      });
      html+='</div>';
    });
    return html||'<div class="cf-hintbox">没有匹配的节点类型</div>';
  }
  openModal(dHead('shapes','添加节点')
    +'<div class="cf-dbody"><input class="cf-in cf-search" data-f="q" placeholder="搜索节点类型…" aria-label="搜索节点类型">'
    +'<div id="cf-addlist">'+listHtml('')+'</div></div>'
    +'<div class="cf-dfoot"><button type="button" class="cf-btn" data-act="close">取消</button></div>');
  var d=$('cf-dialog');
  d.querySelector('[data-act="close"]').addEventListener('click',closeModal);
  function pick(t){
    var pos=worldPos||(function(){var r=stageRect();return toWorld(r.left+r.width/2,r.top+r.height/2);})();
    pos=[Math.round(pos[0]-100+(G.nodes.length%5)*26),Math.round(pos[1]-60+(G.nodes.length%5)*22)];
    var n=addNode(t,pos);
    closeModal();
    if(n){sel={type:'node',id:n.id};markSel();toast('已添加「'+TYPES[t].label+'」，拖动端口连接到工作流');}
  }
  function wireRows(){
    d.querySelectorAll('.cf-trow').forEach(function(row){
      row.addEventListener('click',function(){pick(row.dataset.type);});
      row.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();pick(row.dataset.type);}});
    });
  }
  d.querySelector('[data-f="q"]').addEventListener('input',function(e){
    $('cf-addlist').innerHTML=listHtml(e.target.value.trim());
    wireRows();
  });
  wireRows();
}
function openDetails(id){
  var n=byId(id);if(!n)return;
  var t=typeOf(n),st=STC[n.status]||STC.pending;
  var ups=[],downs=[];
  G.links.forEach(function(l){
    if(l[2]===id){var u=byId(l[0]);if(u)ups.push(u.title||typeOf(u).label);}
    if(l[0]===id){var dn=byId(l[2]);if(dn)downs.push(dn.title||typeOf(dn).label);}
  });
  var h=dHead('info',(n.title||t.label)+' · 详情')
    +'<div class="cf-dbody">'
    +'<div class="cf-kv"><b>类型</b><span>'+esc(t.label)+'（'+esc(n.type)+'）</span></div>'
    +'<div class="cf-kv"><b>状态</b><span style="color:'+st[1]+'">'+SGLYPH[n.status]+' '+st[0]+'</span></div>'
    +'<div class="cf-kv"><b>说明</b><span>'+esc(t.desc)+'</span></div>';
  Object.keys(n.params||{}).forEach(function(k){
    var v=String(n.params[k]);if(v.length>160)v=v.slice(0,160)+'…';
    if(v)h+='<div class="cf-kv"><b>'+esc(k)+'</b><span>'+esc(v)+'</span></div>';
  });
  if(n.result)h+='<div class="cf-kv"><b>结果</b><span>'+esc(n.result)+'</span></div>';
  if(n.detail)h+='<div class="cf-kv"><b>详情</b><span>'+esc(n.detail)+'</span></div>';
  h+='<div class="cf-kv"><b>上游</b><span>'+(ups.length?esc(ups.join('、')):'—')+'</span></div>';
  h+='<div class="cf-kv"><b>下游</b><span>'+(downs.length?esc(downs.join('、')):'—')+'</span></div>';
  h+='</div><div class="cf-dfoot"><button type="button" class="cf-btn cf-primary" data-act="close">关闭</button></div>';
  openModal(h);
  $('cf-dialog').querySelector('[data-act="close"]').addEventListener('click',closeModal);
}
function openConfirm(title,msg,ok){
  openModal(dHead('alert-triangle',title)
    +'<div class="cf-dbody"><div style="font-size:12.5px;color:var(--cf-dim)">'+esc(msg)+'</div></div>'
    +'<div class="cf-dfoot"><button type="button" class="cf-btn" data-act="close">取消</button><button type="button" class="cf-btn cf-danger" data-act="submit">确定</button></div>');
  var d=$('cf-dialog');
  d.querySelector('[data-act="close"]').addEventListener('click',closeModal);
  d.querySelector('[data-act="submit"]').addEventListener('click',function(){closeModal();ok();});
}
function openPrompt(title,label,val,ok){
  openModal(dHead('pencil',title)
    +'<div class="cf-dbody">'+fld(label,'<input class="cf-in" data-f="v" value="'+esc(val)+'">')+'</div>'
    +'<div class="cf-dfoot"><button type="button" class="cf-btn" data-act="close">取消</button><button type="button" class="cf-btn cf-primary" data-act="submit">确定</button></div>');
  var d=$('cf-dialog');
  d.querySelector('[data-act="close"]').addEventListener('click',closeModal);
  var inp=d.querySelector('[data-f="v"]');
  inp.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();var v=inp.value.trim();if(v){closeModal();ok(v);}}});
  d.querySelector('[data-act="submit"]').addEventListener('click',function(){var v=inp.value.trim();if(!v){toast('内容不能为空','err');return;}closeModal();ok(v);});
}
function openHelp(){
  openModal(dHead('info','CodeFlow 使用帮助')
    +'<div class="cf-dbody" style="font-size:12.5px;color:var(--cf-dim);line-height:1.7">'
    +'<p><b style="color:var(--cf-text)">开始</b>：右键空白画布 → 「新建项目」（agent 根据需求生成初版与流水线）或「导入项目」（扫描代码、识别语言与注释、生成任务工作流）。</p>'
    +'<p><b style="color:var(--cf-text)">画布操作</b>：拖动空白处平移 · 滚轮缩放 · 拖动节点头部移动 · 双击空白添加节点 · 双击节点查看详情 · Delete 删除选中节点/连线 · 右键节点/连线/空白各有菜单。</p>'
    +'<p><b style="color:var(--cf-text)">连线</b>：从一个端口拖到另一个端口。类型相同或任一为 any 才能连接；输入端口只保留一条入线；不允许成环。修改参数或连线会自动把该节点及其下游重置为「待运行」。</p>'
    +'<p><b style="color:var(--cf-text)">执行</b>：右键节点「运行此节点」只执行它和它的上游；「运行全部」按拓扑顺序执行。每次执行都会弹出确认框，agent 在工作区真实生成/修改文件，完成后画布自动回填状态与产出。</p>'
    +'<p><b style="color:var(--cf-text)">持久化</b>：画布编辑自动暂存于本会话；「保存项目」会让 agent 把工作流图写入 <b>flow-projects/&lt;项目&gt;/workflow.json</b>。</p>'
    +'</div>'
    +'<div class="cf-dfoot"><button type="button" class="cf-btn cf-primary" data-act="close">开始使用</button></div>');
  $('cf-dialog').querySelector('[data-act="close"]').addEventListener('click',closeModal);
}
function openCopyDialog(text){
  openModal(dHead('info','独立模式：请把下面的请求粘贴给 agent')
    +'<div class="cf-dbody"><textarea class="cf-in" rows="8" readonly>'+esc(text)+'</textarea>'
    +'<div class="cf-hintbox" style="margin-top:8px">当前页面未连接 ZCode 会话（独立打开）。将文本粘贴到 ZCode 对话框即可获得相同结果。</div></div>'
    +'<div class="cf-dfoot"><button type="button" class="cf-btn cf-primary" data-act="close">关闭</button></div>');
  $('cf-dialog').querySelector('[data-act="close"]').addEventListener('click',closeModal);
}

/* ================= 运行与保存 ================= */
function runAll(){
  if(!G.nodes.length){toast('画布为空，先新建或导入项目','err');return;}
  sendMessage('RUN_ALL',{project:G.project,graph:G},'CodeFlow · 运行全部');
}
function runNode(id,rerun){
  var n=byId(id);if(!n)return;
  var t=typeOf(n);
  sendMessage('RUN_NODE',{nodeId:id,rerun:!!rerun,project:G.project,graph:G},'CodeFlow · 运行节点 '+(n.title||t.label));
}
function saveProject(){
  if(!G.project||!G.project.name){
    openPrompt('保存项目','项目名称','my-project',function(v){
      G.project=G.project||{};
      G.project.name=v;
      renderChrome();saveState(true);
      sendMessage('SAVE',{project:G.project,graph:G},'CodeFlow · 保存项目');
    });
    return;
  }
  sendMessage('SAVE',{project:G.project,graph:G},'CodeFlow · 保存项目');
}

/* ================= 消息发送 ================= */
function sendMessage(action,payload,title){
  var obj={action:action,rev:G.rev||0};
  Object.keys(payload).forEach(function(k){obj[k]=payload[k];});
  var prompt='[CodeFlow:'+action+']'+JSON.stringify(obj);
  if(!(ZC&&typeof ZC.sendFollowUpMessage==='function')){
    openCopyDialog(prompt);
    return;
  }
  ZC.sendFollowUpMessage({prompt:prompt,title:title}).then(function(){
    showBanner('已请求 agent：'+title+' — 执行完成后画布会自动回填');
  }).catch(function(){
    toast('消息已取消或发送失败','err');
  });
}
function showBanner(text){
  $('cf-banner-text').textContent=text;
  $('cf-banner').hidden=false;
}
$('cf-banner-x').addEventListener('click',function(){$('cf-banner').hidden=true;});

/* ================= 提示 ================= */
function toast(msg,kind){
  var wrap=$('cf-toasts');
  var t=document.createElement('div');
  t.className='cf-toast'+(kind?' '+kind:'');
  t.textContent=msg;
  wrap.appendChild(t);
  setTimeout(function(){if(t.parentNode)t.parentNode.removeChild(t);},2600);
}

/* ================= 本地暂存 ================= */
function saveState(sooner){
  try{localStorage.setItem('cf-canvas-standalone',JSON.stringify({graph:G,view:[view.x,view.y,view.k]}));}catch(e){}
  if(!(ZC&&typeof ZC.setWidgetState==='function'))return;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(function(){
    try{
      var done=0;G.nodes.forEach(function(n){if(n.status==='done')done++;});
      var payload={modelContent:{project:G.project,rev:G.rev,nodes:G.nodes.length,done:done},
        privateContent:{graph:G,view:[view.x,view.y,view.k],savedAt:Date.now()}};
      if(JSON.stringify(payload).length>14500){payload.privateContent={view:[view.x,view.y,view.k],savedAt:Date.now()};}
      ZC.setWidgetState(payload).catch(function(){});
      $('cf-saved').textContent='已暂存';
    }catch(e){}
  },sooner?250:700);
}

/* ================= 控件事件 ================= */
$('cf-nodes').addEventListener('change',function(e){
  var el=e.target;
  var pn=el.closest('.cf-node');if(!pn)return;
  var n=byId(pn.dataset.id);if(!n)return;
  var p=el.getAttribute('data-param');if(!p)return;
  n.params=n.params||{};
  n.params[p]=el.type==='checkbox'?el.checked:el.value;
  if(n.status==='done'||n.status==='failed'||n.status==='skipped'){resetFrom(n.id,true);toast('参数已变更，该节点及其下游已重置');}
  saveState(true);
});

$('cf-z-out').addEventListener('click',function(){var r=stageRect();zoomAt(r.width/2,r.height/2,1/1.18);});

$('cf-projname').addEventListener('click',function(){
  var cur=G.project&&G.project.name?G.project.name:'';
  openPrompt('重命名项目','项目名称',cur,function(v){

    G.project.name=v;
    renderChrome();saveState(true);
  });
});

boot();
})();
