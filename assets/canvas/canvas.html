<style>
#codeflow-canvas{
  --cf-bg:#101014; --cf-stage:#141419; --cf-panel:#1c1c23; --cf-panel2:#232330;
  --cf-border:#31313d; --cf-border2:#3d3d4c; --cf-text:#e9e9f0; --cf-dim:#9a9aa8;
  --cf-accent:#7c8cff; --cf-danger:#ef4444;
  position:relative; display:flex; flex-direction:column; height:100%; min-height:0;
  background:var(--cf-bg); color:var(--cf-text); border:1px solid var(--cf-border);
  border-radius:14px; overflow:hidden;
  font-family:-apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif; font-size:13px; line-height:1.45;
}
#codeflow-canvas *{box-sizing:border-box;}
#codeflow-canvas [hidden]{display:none !important;}
#codeflow-canvas button{font-family:inherit;}
#codeflow-canvas.dragging, #codeflow-canvas.dragging *{cursor:grabbing !important; user-select:none;}
#codeflow-canvas.linking, #codeflow-canvas.linking *{cursor:crosshair !important;}

/* ---------- 工具栏 ---------- */
.cf-tb{display:flex; align-items:center; gap:6px; padding:8px 10px; background:var(--cf-panel); border-bottom:1px solid var(--cf-border); flex-wrap:wrap;}
.cf-logo{display:flex; align-items:baseline; gap:6px; margin-right:8px;}
.cf-logo-mark{color:var(--cf-accent); font-size:16px;}
.cf-logo b{font-size:13.5px;}
.cf-logo-sub{color:var(--cf-dim); font-size:11px;}
.cf-tbtn{display:inline-flex; align-items:center; gap:5px; padding:5px 10px; border-radius:8px; border:1px solid var(--cf-border);
  background:var(--cf-panel2); color:var(--cf-text); font-size:12px; cursor:pointer; white-space:nowrap;}
.cf-tbtn:hover{border-color:var(--cf-border2); background:#2a2a38;}
.cf-tbtn.cf-accent{background:rgba(124,140,255,.16); border-color:rgba(124,140,255,.45); color:#b9c2ff;}
.cf-tbtn.cf-accent:hover{background:rgba(124,140,255,.26);}
.cf-tbtn.cf-icononly{padding:5px 7px;}
.cf-tbtn svg{width:14px; height:14px;}
.cf-tsep{width:1px; height:18px; background:var(--cf-border); margin:0 2px;}
.cf-tgrow{flex:1;}

/* ---------- 画布区 ---------- */
.cf-stage{position:relative; flex:1; overflow:hidden; background:var(--cf-stage);
  background-image:radial-gradient(circle, #232330 1px, transparent 1px); background-size:22px 22px; cursor:default;}
.cf-world{position:absolute; left:0; top:0; width:0; height:0; transform-origin:0 0;}
#cf-links{position:absolute; left:0; top:0; width:0; height:0; z-index:1; pointer-events:none;}
.cf-linksvg{position:absolute; overflow:visible; pointer-events:none;}
/* 宿主样式表可能对 svg 施加 max-width:100% 之类的约束；连线 svg 的定位父级宽高为 0，百分比会塌缩为 0 导致连线消失。
   这里用样式表 !important 兜底，创建时还会追加内联 !important（优先级最高）。 */
#cf-links .cf-linksvg{max-width:none !important; max-height:none !important;}
.cf-link{fill:none; stroke:#63636f; stroke-width:2; vector-effect:non-scaling-stroke; pointer-events:none;}
.cf-link.sel{stroke:var(--cf-accent); stroke-width:2.5;}
.cf-link-hit{fill:none; stroke:transparent; stroke-width:16; vector-effect:non-scaling-stroke; pointer-events:stroke; cursor:pointer;}
.cf-templink{fill:none; stroke:var(--cf-accent); stroke-width:2; stroke-dasharray:6 4; vector-effect:non-scaling-stroke; pointer-events:none;}

/* ---------- 节点 ---------- */
.cf-node{position:absolute; z-index:2; background:#1e1e27; border:1px solid #38384a; border-radius:10px;
  box-shadow:0 4px 16px rgba(0,0,0,.45); cursor:grab; min-width:200px;}
.cf-node:hover{border-color:#4a4a60;}
.cf-node.sel{border-color:var(--cf-accent); box-shadow:0 0 0 2px rgba(124,140,255,.28), 0 4px 16px rgba(0,0,0,.45);}
.cf-node-head{display:flex; align-items:center; gap:6px; padding:6px 8px; border-bottom:1px solid rgba(0,0,0,.35);
  border-radius:9px 9px 0 0; cursor:grab;}
.cf-grip{color:rgba(255,255,255,.4); font-size:9px; letter-spacing:-1px;}
.cf-node-title{font-size:12.5px; font-weight:600; color:#fff; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.cf-badge{font-size:10.5px; padding:1px 7px; border-radius:20px; border:1px solid; white-space:nowrap;}
.cf-node-body{padding:7px 10px 4px;}
.cf-widget{margin-bottom:6px;}
.cf-wlabel{display:block; font-size:10.5px; color:var(--cf-dim); margin-bottom:2px;}
.cf-in{width:100%; background:#16161d; color:var(--cf-text); border:1px solid var(--cf-border); border-radius:6px;
  padding:4px 7px; font-size:12px; font-family:inherit; outline:none;}
.cf-in:focus{border-color:var(--cf-accent);}
textarea.cf-in{resize:vertical; min-height:44px;}
select.cf-in{cursor:pointer;}
.cf-chk{display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--cf-dim); cursor:pointer; padding:2px 0;}
.cf-chk input{accent-color:var(--cf-accent);}
.cf-slots{display:flex; gap:14px; padding:2px 8px 7px;}
.cf-scol{flex:1; display:flex; flex-direction:column; gap:1px; min-width:0;}
.cf-scol.cf-right{align-items:flex-end;}
.cf-srow{display:flex; align-items:center; gap:5px; height:20px; font-size:11px; color:var(--cf-dim); min-width:0;}
.cf-srow span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.cf-port{width:14px; height:14px; flex:0 0 14px; display:flex; align-items:center; justify-content:center; cursor:crosshair;}
.cf-port .cf-dot{width:9px; height:9px; border-radius:50%; border:2px solid var(--pc,#94a3b8); background:#141419; transition:transform .1s, box-shadow .1s;}
.cf-port.on .cf-dot{background:var(--pc,#94a3b8);}
.cf-port.want .cf-dot{transform:scale(1.45);}
.cf-port.hot .cf-dot{box-shadow:0 0 0 4px rgba(124,140,255,.4); transform:scale(1.3);}
.cf-node-res{margin:0 8px 7px; padding:4px 8px; font-size:11px; border-radius:6px; background:#16161d;
  border-left:3px solid var(--rc,#8a8a98); color:var(--cf-dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

/* ---------- 空状态 ---------- */
.cf-empty{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; z-index:5;}
.cf-empty-card{pointer-events:auto; text-align:center; padding:30px 44px; border:1px dashed var(--cf-border2); border-radius:16px;
  background:rgba(22,22,30,.72); backdrop-filter:blur(4px);}
.cf-empty-logo{font-size:34px; color:var(--cf-accent);}
.cf-empty-title{font-size:16px; font-weight:600; margin:6px 0 2px;}
.cf-empty-sub{font-size:12px; color:var(--cf-dim); margin-bottom:16px;}
.cf-empty-btns{display:flex; gap:10px; justify-content:center;}
.cf-empty-hint{margin-top:14px; font-size:11px; color:#6d6d7c;}

/* ---------- 缩放控件 / 小地图 ---------- */
.cf-zoomer{position:absolute; left:10px; bottom:10px; display:flex; flex-direction:column; gap:4px; z-index:6;}
.cf-zoomer button{width:26px; height:26px; border-radius:7px; border:1px solid var(--cf-border); background:rgba(28,28,35,.92);
  color:var(--cf-text); cursor:pointer; display:flex; align-items:center; justify-content:center;}
.cf-zoomer button:hover{border-color:var(--cf-border2);}
.cf-zoomer svg{width:14px; height:14px;}
.cf-nav{position:absolute; left:10px; top:50%; transform:translateY(-50%); z-index:7; display:flex; flex-direction:column; gap:3px;
  padding:5px; border-radius:10px; background:rgba(24,24,31,.92); border:1px solid var(--cf-border); box-shadow:0 6px 20px rgba(0,0,0,.4);}
.cf-navbtn{display:flex; align-items:center; gap:6px; padding:5px 9px; border-radius:7px; border:1px solid transparent;
  background:none; color:var(--cf-text); font-size:11.5px; cursor:pointer; min-width:94px;}
.cf-navbtn:hover:not(:disabled){background:var(--cf-panel2);}
.cf-navbtn.active{background:rgba(124,140,255,.16); border-color:rgba(124,140,255,.45); color:#b9c2ff;}
.cf-navbtn:disabled{opacity:.35; cursor:default;}
.cf-navdot{width:8px; height:8px; border-radius:3px; flex:0 0 8px;}
.cf-navlabel{flex:1; text-align:left;}
.cf-navcount{font-size:10px; color:var(--cf-dim); min-width:14px; text-align:right;}
.cf-navbtn.active .cf-navcount{color:#b9c2ff;}
.cf-node{transition:opacity .25s;}
.cf-node.cf-hit{border-color:var(--cf-accent) !important; box-shadow:0 0 0 3px rgba(124,140,255,.35), 0 4px 16px rgba(0,0,0,.45);}
#codeflow-canvas.cf-focusing .cf-node:not(.cf-hit){opacity:.3;}
#codeflow-canvas.cf-focusing .cf-link{opacity:.12;}
.cf-mini{position:absolute; right:10px; bottom:10px; z-index:6; border:1px solid var(--cf-border); border-radius:8px; cursor:pointer; opacity:.94;}

/* ---------- 状态栏 ---------- */
.cf-status{display:flex; align-items:center; gap:8px; padding:5px 12px; background:var(--cf-panel); border-top:1px solid var(--cf-border);
  font-size:11.5px; color:var(--cf-dim);}
.cf-projname{background:none; border:none; color:var(--cf-text); font-size:12px; font-weight:600; cursor:pointer; padding:2px 4px; border-radius:5px;}
.cf-projname:hover{background:var(--cf-panel2);}
.cf-origin{font-size:10.5px; padding:1px 7px; border-radius:20px; border:1px solid var(--cf-border2); color:var(--cf-dim);}
.cf-sgrow{flex:1;}
.cf-sdot{color:#4a4a58;}
.cf-modetag{color:#d29922; font-size:10.5px; border:1px solid rgba(210,153,34,.4); padding:0 6px; border-radius:10px;}

/* ---------- 菜单 ---------- */
.cf-menu{position:absolute; z-index:60; min-width:190px; background:#20202a; border:1px solid var(--cf-border2); border-radius:10px;
  box-shadow:0 10px 30px rgba(0,0,0,.55); padding:5px; cursor:default;}
.cf-mitem{display:flex; align-items:center; gap:9px; width:100%; padding:6px 9px; border:none; background:none; color:var(--cf-text);
  font-size:12.5px; border-radius:7px; cursor:pointer; text-align:left;}
.cf-mitem:hover{background:rgba(124,140,255,.14);}
.cf-mitem.danger{color:#f87171;}
.cf-mitem svg{width:14px; height:14px; color:var(--cf-dim); flex:0 0 14px;}
.cf-mitem.danger svg{color:#f87171;}
.cf-mitem .cf-grow{flex:1;}
.cf-sub-arrow{color:var(--cf-dim); font-size:10px;}
.cf-msep{height:1px; background:var(--cf-border); margin:4px 6px;}

/* ---------- 对话框 ---------- */
.cf-modal{position:absolute; inset:0; z-index:80; background:rgba(8,8,12,.6); display:flex; align-items:center; justify-content:center; padding:16px;}
.cf-dialog{background:#1e1e27; border:1px solid var(--cf-border2); border-radius:14px; width:min(560px,100%); max-height:92%;
  display:flex; flex-direction:column; box-shadow:0 24px 60px rgba(0,0,0,.6);}
.cf-dhead{display:flex; align-items:center; gap:8px; padding:13px 16px 10px; font-size:14px; font-weight:600;}
.cf-dhead .cf-dicon{color:var(--cf-accent);}
.cf-dclose{margin-left:auto; background:none; border:none; color:var(--cf-dim); font-size:14px; cursor:pointer; padding:2px 6px; border-radius:6px;}
.cf-dclose:hover{background:var(--cf-panel2); color:var(--cf-text);}
.cf-dbody{padding:2px 16px 14px; overflow:auto;}
.cf-dfoot{display:flex; justify-content:flex-end; gap:8px; padding:10px 16px 14px; border-top:1px solid var(--cf-border);}
.cf-field{margin-bottom:11px;}
.cf-flabel{display:block; font-size:11.5px; color:var(--cf-dim); margin-bottom:4px;}
.cf-btn{padding:7px 14px; border-radius:8px; border:1px solid var(--cf-border); background:var(--cf-panel2); color:var(--cf-text);
  font-size:12.5px; cursor:pointer;}
.cf-btn:hover{border-color:var(--cf-border2); background:#2a2a38;}
.cf-btn.cf-primary{background:var(--cf-accent); border-color:var(--cf-accent); color:#0e0e14; font-weight:600;}
.cf-btn.cf-primary:hover{background:#8f9dff;}
.cf-btn.cf-danger{background:rgba(239,68,68,.15); border-color:rgba(239,68,68,.5); color:#f87171;}
.cf-hintbox{font-size:11.5px; color:var(--cf-dim); background:#16161d; border:1px solid var(--cf-border); border-radius:8px; padding:8px 10px; margin-bottom:11px;}
.cf-row2{display:flex; gap:10px;}
.cf-row2 .cf-field{flex:1;}
.cf-tlist{display:flex; flex-direction:column; gap:4px;}
.cf-trow{display:flex; align-items:center; gap:8px; padding:6px 8px; border:1px solid var(--cf-border); border-radius:8px; cursor:pointer; background:var(--cf-panel);}
.cf-trow:hover{border-color:var(--cf-accent);}
.cf-trow .cf-tdot{width:9px; height:9px; border-radius:3px; flex:0 0 9px;}
.cf-trow .cf-tname{font-size:12.5px;}
.cf-trow .cf-tdesc{font-size:11px; color:var(--cf-dim); margin-left:auto; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.cf-cathead{font-size:10.5px; color:var(--cf-dim); margin:8px 2px 3px; text-transform:uppercase; letter-spacing:.4px;}
.cf-kv{display:flex; gap:8px; font-size:12px; padding:3px 0; border-bottom:1px dashed var(--cf-border);}
.cf-kv:last-child{border-bottom:none;}
.cf-kv b{flex:0 0 76px; color:var(--cf-dim); font-weight:400; font-size:11.5px;}
.cf-kv span{flex:1; min-width:0; word-break:break-all;}
.cf-search{width:100%; margin-bottom:6px;}

/* ---------- 提示条 / 横幅 ---------- */
.cf-toasts{position:absolute; left:0; right:0; bottom:40px; z-index:90; display:flex; flex-direction:column; align-items:center; gap:6px; pointer-events:none;}
.cf-toast{background:#26262f; border:1px solid var(--cf-border2); color:var(--cf-text); font-size:12px; padding:7px 14px; border-radius:20px;
  box-shadow:0 6px 20px rgba(0,0,0,.4); max-width:80%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.cf-toast.err{border-color:rgba(239,68,68,.55); color:#fca5a5;}
.cf-toast.ok{border-color:rgba(34,197,94,.5); color:#86efac;}
.cf-banner{position:absolute; top:52px; left:50%; transform:translateX(-50%); z-index:70; display:flex; align-items:center; gap:9px;
  background:rgba(124,140,255,.14); border:1px solid rgba(124,140,255,.45); color:#c3cbff; font-size:12px; padding:7px 12px; border-radius:20px;
  backdrop-filter:blur(4px); max-width:86%;}
.cf-banner span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.cf-spin{display:inline-block; animation:cf-rot 1.1s linear infinite;}
@keyframes cf-rot{to{transform:rotate(360deg);}}
.cf-banner-x{background:none; border:none; color:#c3cbff; cursor:pointer; font-size:12px; padding:0 2px;}

/* ============================================================================
 * v1.1：功能分组（features.json）/ 整组高亮 / 功能归属 chips
 * ----------------------------------------------------------------------------
 * 由 tools/port-canvas.mjs 注入到样式表（EXTRA_CSS 之前、LIGHT_CSS 之前）。
 * 浅色覆盖统一带 html[data-cf-theme="light"] 前缀（见文件末尾），保证浅色
 * 对比度不低于现有阈值（tests/contrast.mjs 审计）。
 * ========================================================================= */

/* ---- 二级浮层：分组行 / 成员行功能标签 / 未识别横幅 ---- */
.cf-fgroup{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:7px;cursor:pointer;border:1px solid transparent;}
.cf-fgroup:hover,.cf-fgroup.active{background:rgba(124,140,255,.14);border-color:rgba(124,140,255,.35);}
.cf-fgroup:focus-visible{outline:1px solid var(--cf-accent);outline-offset:1px;}
.cf-farrow{flex:0 0 12px;width:12px;font-size:9px;color:var(--cf-dim);text-align:center;cursor:pointer;}
.cf-farrow:hover{color:var(--cf-text);}
.cf-fgroup-name{font-size:12px;font-weight:600;color:var(--cf-text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cf-fgroup-count{font-size:10.5px;color:var(--cf-dim);flex:0 0 auto;white-space:nowrap;}
.cf-fgroup-low{font-size:9.5px;padding:0 5px;border-radius:8px;border:1px solid rgba(245,158,11,.5);color:#fbbf24;flex:0 0 auto;white-space:nowrap;}
.cf-fgroup-hint{font-size:10px;color:var(--cf-accent);flex:0 0 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cf-ftag{font-size:9.5px;padding:0 6px;border-radius:10px;border:1px solid var(--cf-border2);color:var(--cf-dim);flex:0 0 auto;white-space:nowrap;max-width:92px;overflow:hidden;text-overflow:ellipsis;}
.cf-fempty{display:flex;align-items:center;gap:8px;padding:7px 9px;margin:1px 0 3px;border:1px dashed var(--cf-border2);border-radius:8px;font-size:11.5px;color:var(--cf-dim);}
.cf-fempty>span{flex:1;min-width:0;}
.cf-fempty-btn{flex:0 0 auto;}

/* ---- 整组高亮（spotlight）：组外变暗 / 组内节点描边 / 组内连线提亮 / 虚线框 ---- */
#codeflow-canvas.cf-spotlight .cf-node:not(.cf-spot){opacity:.3;}
.cf-node.cf-spot{border-color:var(--cf-accent) !important;box-shadow:0 0 0 3px rgba(124,140,255,.35),0 4px 16px rgba(0,0,0,.45);}
.cf-link.cf-spot-link{stroke:var(--cf-accent);stroke-width:3;}
.cf-spotbox{position:absolute;z-index:3;border:1.5px dashed var(--cf-accent);border-radius:12px;pointer-events:none;background:rgba(124,140,255,.05);}
.cf-spotbox-label{position:absolute;left:-1px;top:-21px;background:var(--cf-accent);color:#0e0e14;font-size:10.5px;font-weight:600;line-height:1.6;padding:0 8px;border-radius:8px;white-space:nowrap;max-width:280px;overflow:hidden;text-overflow:ellipsis;}

/* ---- 详情弹窗：功能归属 chips ---- */
.cf-fchips{display:flex;flex-wrap:wrap;gap:5px;align-items:center;min-width:0;}
.cf-fchip{display:inline-flex;align-items:center;gap:2px;font-size:10.5px;padding:1px 3px 1px 8px;border-radius:10px;border:1px solid var(--cf-border2);background:var(--cf-panel2);color:var(--cf-text);max-width:180px;}
.cf-fchip>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cf-fchip-x{background:none;border:none;color:var(--cf-dim);cursor:pointer;font-size:11px;padding:0 3px;line-height:1.2;}
.cf-fchip-x:hover{color:var(--cf-danger);}
.cf-fchip-add{background:none;border:1px dashed var(--cf-border2);color:var(--cf-dim);cursor:pointer;font-size:11px;border-radius:10px;padding:0 7px;line-height:1.6;}
.cf-fchip-add:hover{border-color:var(--cf-accent);color:var(--cf-accent);}

/* ---- 浅色主题覆盖（与深色规则一一对应；颜色取现有浅色调色板） ---- */
html[data-cf-theme="light"] .cf-fgroup:hover,html[data-cf-theme="light"] .cf-fgroup.active{background:rgba(79,91,213,.09);border-color:rgba(79,91,213,.30);}
html[data-cf-theme="light"] .cf-fgroup-low{color:#b45309;border-color:rgba(180,83,9,.45);}
html[data-cf-theme="light"] .cf-ftag{border-color:#c6cedb;color:#5d6673;}
html[data-cf-theme="light"] .cf-node.cf-spot{box-shadow:0 0 0 3px rgba(79,91,213,.30),0 6px 18px rgba(16,24,40,.14);}
html[data-cf-theme="light"] .cf-spotbox{background:rgba(79,91,213,.04);}
html[data-cf-theme="light"] .cf-spotbox-label{color:#ffffff;}
html[data-cf-theme="light"] .cf-fchip{background:#ffffff;}
html[data-cf-theme="light"] .cf-fchip-x:hover{color:#b42318;}

/* ============================================================================
 * v1.2：模块耦合分析（屎山程度卡片 / 节点耦合徽章 / 过期灰化 / 详情表）
 * ----------------------------------------------------------------------------
 * 由 tools/port-canvas.mjs 注入到样式表（FEATURES_CSS 之后、LIGHT_CSS 之前）。
 * 颜色契约（任务书附录 E，深浅两套都过 WCAG AA）：
 *   低 #22c55e（绿） · 中 #eab308（黄） · 高 #ef4444（红）
 *   浅色主题文字加深一档：#15803d / #a16207 / #b91c1c，背景统一 12% 透明度
 *   （tests/contrast.mjs 按同一组 token 审计）。
 * ========================================================================= */

/* ---- 左上角「屎山程度」卡片（绝对定位，z-index 低于菜单/弹窗/监视器） ---- */
.cf-coupling-card{position:absolute; top:10px; left:10px; z-index:6; max-width:300px;
  background:rgba(24,24,31,.94); border:1px solid var(--cf-border); border-radius:10px;
  box-shadow:0 6px 20px rgba(0,0,0,.4); font-size:11.5px; color:var(--cf-dim);
  padding:7px 11px; cursor:pointer; user-select:none; line-height:1.5;}
.cf-coupling-card:hover{border-color:var(--cf-border2); color:var(--cf-text);}
.cf-coupling-line1{display:flex; align-items:center; gap:7px; font-size:13px; font-weight:600; color:var(--cf-text);}
.cf-coupling-dot{width:9px; height:9px; border-radius:50%; flex:0 0 9px;}
.cf-coupling-extra{font-size:10.5px; font-weight:400; color:var(--cf-dim); white-space:nowrap;}
.cf-coupling-line2{font-size:11px; font-variant-numeric:tabular-nums; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.cf-coupling-card.stale{filter:saturate(.45); opacity:.88;}
.cf-coupling-card.stale .cf-coupling-line1{color:var(--cf-dim);}

/* ---- 节点徽章：状态徽章左侧的小胶囊（data-level 控色） ---- */
.cf-coupling-badge{font-size:9.5px; padding:0 6px; border-radius:9px; border:1px solid;
  flex:0 0 auto; white-space:nowrap; line-height:1.5;}
.cf-coupling-badge[data-level="low"]{color:#22c55e; border-color:rgba(34,197,94,.45); background:rgba(34,197,94,.12);}
.cf-coupling-badge[data-level="medium"]{color:#eab308; border-color:rgba(234,179,8,.45); background:rgba(234,179,8,.12);}
.cf-coupling-badge[data-level="high"]{color:#ef4444; border-color:rgba(239,68,68,.5); background:rgba(239,68,68,.14);}
.cf-coupling-badge.stale{border-style:dashed; filter:grayscale(.7); opacity:.8;}

/* ---- 节点卡片右缘 3px 内阴影色条（子元素，不改节点尺寸/端口位置） ---- */
.cf-coupling-edge{position:absolute; top:0; right:0; bottom:0; width:3px; pointer-events:none;
  border-radius:0 10px 10px 0;}
.cf-coupling-edge[data-level="low"]{background:#22c55e;}
.cf-coupling-edge[data-level="medium"]{background:#eab308;}
.cf-coupling-edge[data-level="high"]{background:#ef4444;}
.cf-coupling-edge.stale{opacity:.35;}

/* ---- 详情弹窗：模块表格 ---- */
.cf-coupling-table{width:100%; border-collapse:collapse; font-size:11.5px; margin-top:2px;}
.cf-coupling-table th{text-align:left; font-weight:500; color:var(--cf-dim); padding:3px 8px;
  border-bottom:1px solid var(--cf-border); white-space:nowrap;}
.cf-coupling-table td{padding:3px 8px; border-bottom:1px solid var(--cf-border);
  font-variant-numeric:tabular-nums; color:var(--cf-text); white-space:nowrap;}
.cf-coupling-table td.dim{color:var(--cf-dim);}
.cf-coupling-level{font-size:10px; padding:0 7px; border-radius:9px; border:1px solid; white-space:nowrap;}
.cf-coupling-level[data-level="low"]{color:#22c55e; border-color:rgba(34,197,94,.45); background:rgba(34,197,94,.12);}
.cf-coupling-level[data-level="medium"]{color:#eab308; border-color:rgba(234,179,8,.45); background:rgba(234,179,8,.12);}
.cf-coupling-level[data-level="high"]{color:#ef4444; border-color:rgba(239,68,68,.5); background:rgba(239,68,68,.14);}

/* ---- 浅色主题覆盖（与 features-ui.css 同一模式：一律带属性前缀） ---- */
html[data-cf-theme="light"] .cf-coupling-card{background:rgba(255,255,255,.97); box-shadow:0 6px 18px rgba(16,24,40,.10);}
html[data-cf-theme="light"] .cf-coupling-badge[data-level="low"],
html[data-cf-theme="light"] .cf-coupling-level[data-level="low"]{color:#15803d; border-color:rgba(21,128,61,.4); background:rgba(34,197,94,.12);}
html[data-cf-theme="light"] .cf-coupling-badge[data-level="medium"],
html[data-cf-theme="light"] .cf-coupling-level[data-level="medium"]{color:#a16207; border-color:rgba(161,98,7,.4); background:rgba(234,179,8,.12);}
html[data-cf-theme="light"] .cf-coupling-badge[data-level="high"],
html[data-cf-theme="light"] .cf-coupling-level[data-level="high"]{color:#b91c1c; border-color:rgba(185,28,28,.4); background:rgba(239,68,68,.12);}
html[data-cf-theme="light"] .cf-coupling-edge[data-level="low"]{background:#15803d;}
html[data-cf-theme="light"] .cf-coupling-edge[data-level="medium"]{background:#a16207;}
html[data-cf-theme="light"] .cf-coupling-edge[data-level="high"]{background:#b91c1c;}
html[data-cf-theme="light"] .cf-coupling-table td{border-bottom-color:#dee3ea;}

/* ---- 拖拽导入：全屏遮罩 / 确认框行 / 进度条 ---- */
.cf-drop-overlay{position:absolute; inset:0; z-index:40; display:flex; align-items:center; justify-content:center;
  background:rgba(124,140,255,.10); border:2px dashed rgba(124,140,255,.55); border-radius:10px;
  pointer-events:none; font-size:14px; font-weight:600; color:#b9c2ff; letter-spacing:.5px;}
.cf-drop-row{display:flex; align-items:baseline; gap:8px; font-size:12px; margin-top:6px;}
.cf-drop-row b{flex:0 0 auto; color:var(--cf-dim); font-weight:500; font-size:11.5px;}
.cf-drop-row span{color:var(--cf-text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0;}
.cf-drop-progress{height:5px; border-radius:3px; background:#2a2a38; overflow:hidden; margin-top:8px;}
.cf-drop-progress>i{display:block; height:100%; width:0; background:var(--cf-accent); border-radius:3px;
  transition:width .2s ease;}
html[data-cf-theme="light"] .cf-drop-overlay{background:rgba(79,91,213,.06); border-color:rgba(79,91,213,.5); color:#3b46b8;}
html[data-cf-theme="light"] .cf-drop-progress{background:#e2e8f0;}


/* ---- v0.5.0：会话入口 / 节点活动行 / 执行监视器 / 执行过程 / 撤销 ---- */
.cf-sbtn{background:none;border:1px solid var(--cf-border);color:var(--cf-dim);font-size:11px;padding:2px 8px;border-radius:12px;cursor:pointer;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cf-sbtn:hover{border-color:var(--cf-border2);color:var(--cf-text);}
.cf-sbtn.has{color:var(--cf-text);border-color:var(--cf-border2);}
.cf-node-act{display:flex;align-items:center;gap:6px;margin:0 8px 7px;padding:3px 8px;font-size:10.5px;color:var(--cf-dim);background:#16161d;border-radius:6px;height:21px;overflow:hidden;}
.cf-act-text{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
.cf-act-meta{flex:0 0 auto;color:#6d6d7c;font-size:10px;}
.cf-node-act.err{color:#f87171;}
.cf-act-spin{display:inline-block;animation:cf-rot 1.1s linear infinite;font-size:10px;flex:0 0 auto;}
.cf-monitor{position:absolute;top:10px;right:10px;z-index:8;width:284px;background:rgba(24,24,31,.94);border:1px solid var(--cf-border);border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.4);font-size:11.5px;color:var(--cf-dim);overflow:hidden;}
.cf-monitor-head{display:flex;align-items:center;gap:6px;padding:6px 10px;color:var(--cf-text);cursor:pointer;user-select:none;}
.cf-monitor-head .cf-mtitle{flex:1;font-weight:600;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cf-monitor-head .cf-fold{color:var(--cf-dim);font-size:10px;flex:0 0 auto;}
.cf-monitor-body{padding:0 10px 8px;display:flex;flex-direction:column;gap:4px;}
.cf-monitor.collapsed .cf-monitor-body{display:none;}
.cf-mrow{display:flex;gap:6px;min-width:0;align-items:baseline;}
.cf-mrow b{flex:0 0 auto;color:var(--cf-text);font-weight:500;}
.cf-mline{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
.cf-mbar{height:4px;border-radius:2px;background:#2a2a38;position:relative;overflow:hidden;flex:1;}
.cf-mbar>i{position:absolute;left:0;top:0;bottom:0;background:var(--cf-accent);border-radius:2px;width:0;}
.cf-mbar.indeterminate>i{width:30%;animation:cf-slide 1.4s ease-in-out infinite;}
@keyframes cf-slide{0%{left:-30%}100%{left:100%}}
.cf-sec{margin-top:10px;}
.cf-sec-title{font-size:11.5px;color:var(--cf-dim);margin:0 0 5px;font-weight:600;}
.cf-sechint{font-size:10.5px;color:#6d6d7c;margin:0 0 6px;}
.cf-think{max-height:210px;overflow:auto;background:#16161d;border:1px solid var(--cf-border);border-radius:8px;padding:7px 9px;font-size:11.5px;line-height:1.55;white-space:pre-wrap;word-break:break-word;color:var(--cf-text);position:relative;}
.cf-think.degraded{color:var(--cf-dim);font-style:italic;}
.cf-think-bottom{position:absolute;right:8px;bottom:8px;}
.cf-steps{display:flex;flex-direction:column;gap:3px;max-height:150px;overflow:auto;}
.cf-step{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--cf-dim);padding:3px 8px;background:#16161d;border-radius:6px;}
.cf-step .cf-stname{color:var(--cf-text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
.cf-step .cf-stst{margin-left:auto;flex:0 0 auto;font-size:10px;}
.cf-step.ok .cf-stst{color:#4ade80;}
.cf-step.error .cf-stst{color:#f87171;}
.cf-step.running .cf-stst{color:#60a5fa;}
.cf-artlist{display:flex;flex-direction:column;gap:3px;}
.cf-art{display:flex;align-items:baseline;gap:7px;font-size:11.5px;padding:4px 8px;background:#16161d;border-radius:6px;}
.cf-art .cf-artpath{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10.5px;word-break:break-all;color:var(--cf-text);}
.cf-art .cf-artlabel{color:var(--cf-dim);font-size:10.5px;flex:0 0 auto;}
.cf-art .cf-artkind{margin-left:auto;flex:0 0 auto;font-size:10px;color:#6d6d7c;}
.cf-undolist{display:flex;flex-direction:column;gap:6px;}
.cf-undorow{display:flex;align-items:center;gap:9px;padding:8px 10px;border:1px solid var(--cf-border);border-radius:8px;background:var(--cf-panel);}
.cf-undorow .cf-uinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
.cf-undorow .cf-uline1{font-size:12px;color:var(--cf-text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cf-undorow .cf-uline2{font-size:10.5px;color:var(--cf-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cf-ustate{font-size:10.5px;padding:1px 7px;border-radius:20px;border:1px solid var(--cf-border2);color:var(--cf-dim);flex:0 0 auto;white-space:nowrap;}
.cf-ustate.ok{color:#4ade80;border-color:rgba(34,197,94,.5);}
.cf-ustate.warn{color:#d29922;border-color:rgba(210,153,34,.4);}
.cf-ustate.dim{opacity:.75;}
.cf-btn.mini{padding:4px 10px;font-size:11.5px;}
.cf-progress-num{font-variant-numeric:tabular-nums;}
/* ---- v0.6.0：视图切换 / 二级导航浮层 / 编辑高亮 ---- */
.cf-viewtabs{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--cf-border);border-radius:9px;padding:2px;background:var(--cf-panel2);}
.cf-viewtab{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:7px;border:1px solid transparent;background:none;color:var(--cf-dim);font-size:12px;cursor:pointer;white-space:nowrap;}
.cf-viewtab:hover{color:var(--cf-text);}
.cf-viewtab.active{background:rgba(124,140,255,.18);border-color:rgba(124,140,255,.45);color:#b9c2ff;}
.cf-viewtab .cf-vtab-count{font-size:10px;font-variant-numeric:tabular-nums;color:var(--cf-dim);}
.cf-viewtab.active .cf-vtab-count{color:#b9c2ff;}
.cf-vtab-dot{width:6px;height:6px;border-radius:50%;background:#f59e0b;flex:0 0 6px;}
.cf-navpop{position:absolute;z-index:12;width:300px;max-width:calc(100% - 20px);background:#20202a;border:1px solid var(--cf-border2);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.55);padding:7px;display:flex;flex-direction:column;gap:6px;}
.cf-navsearch{flex:0 0 auto;}
/* v1.3.0：列表在弹层内弹性滚动（弹层高度由 fitPopover 按 stage 反推并内联
   maxHeight），不再用 60vh（vh 是 iframe 视口高度，不是 stage 可用高度）；
   overscroll-behavior:contain 防止滚到边界后滚动整个 iframe。 */
.cf-navlist{display:flex;flex-direction:column;gap:2px;flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;position:relative;}
/* 左侧分类栏本身在分类很多时也要能滚，不顶出画布。 */
.cf-nav{max-height:calc(100% - 80px);overflow-y:auto;}
.cf-navrow{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:7px;cursor:pointer;border:1px solid transparent;}
.cf-navrow:hover,.cf-navrow.active{background:rgba(124,140,255,.14);border-color:rgba(124,140,255,.35);}
.cf-navrow .cf-navrow-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;}
.cf-navrow .cf-navrow-title{font-size:12px;color:var(--cf-text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cf-navrow .cf-navrow-sub{font-size:10.5px;color:var(--cf-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cf-navempty{font-size:11.5px;color:var(--cf-dim);padding:8px;text-align:center;}
.cf-edittag{font-size:10px;padding:0 6px;border-radius:10px;border:1px solid rgba(245,158,11,.5);color:#fbbf24;flex:0 0 auto;white-space:nowrap;}
.cf-edittag.err{border-color:rgba(239,68,68,.5);color:#f87171;}
.cf-editbadge{font-size:9.5px;padding:0 6px;border-radius:8px;background:rgba(245,158,11,.18);border:1px solid rgba(245,158,11,.55);color:#fbbf24;flex:0 0 auto;white-space:nowrap;}
.cf-editbadge.err{background:rgba(239,68,68,.16);border-color:rgba(239,68,68,.55);color:#f87171;}
.cf-node.cf-editing{border-color:#f59e0b !important;animation:cf-editpulse 1.6s ease-in-out infinite;}
@keyframes cf-editpulse{0%,100%{box-shadow:0 0 0 3px rgba(245,158,11,.35),0 4px 16px rgba(0,0,0,.45);}50%{box-shadow:0 0 0 7px rgba(245,158,11,.10),0 4px 16px rgba(0,0,0,.45);}}
.cf-node.cf-edited{border-color:rgba(245,158,11,.7);}
.cf-node.cf-edited .cf-node-head::after{content:'';width:7px;height:7px;border-radius:50%;background:#f59e0b;flex:0 0 7px;margin-left:2px;}
.cf-node.cf-edit-err{border-color:rgba(239,68,68,.8);}
.cf-node.cf-edit-related{border-style:dashed;border-color:rgba(245,158,11,.6);}
.cf-naveditdot{width:6px;height:6px;border-radius:50%;background:#f59e0b;flex:0 0 6px;}
@media (prefers-reduced-motion: reduce){.cf-node.cf-editing{animation:none;box-shadow:0 0 0 3px rgba(245,158,11,.35),0 4px 16px rgba(0,0,0,.45);}}
/* ---- v1.0：设置弹窗 / 横幅重试按钮 ---- */
.cf-setrow{margin-top:9px;display:flex;flex-direction:column;gap:4px;}
.cf-setrow label{font-size:11.5px;color:var(--cf-dim);}
.cf-setline{display:flex;gap:6px;align-items:center;}
.cf-setline .cf-in{flex:1;min-width:0;}
.cf-banner-retry{background:none;border:1px solid #c3cbff;color:#c3cbff;border-radius:10px;font-size:11px;padding:1px 10px;cursor:pointer;flex:0 0 auto;white-space:nowrap;}
.cf-banner-retry:hover{background:rgba(124,140,255,.18);}

/* ---- v1.2.1：导入目录树选择器（browse-ui.js 的样式） ----
 * 深色基线；浅色覆盖在文件尾部，带 html[data-cf-theme="light"] 前缀。 */
.cf-browse{position:absolute;inset:0;z-index:90;background:rgba(8,8,12,.6);display:flex;align-items:center;justify-content:center;padding:16px;}
.cf-browse[hidden]{display:none;}
.cf-browse-card{display:flex;flex-direction:column;gap:8px;width:520px;max-width:100%;max-height:100%;background:#20202a;border:1px solid var(--cf-border2);border-radius:14px;box-shadow:0 12px 36px rgba(0,0,0,.55);padding:14px;}
.cf-browse-head{display:flex;align-items:center;gap:6px;}
.cf-browse-title{display:inline-flex;align-items:center;gap:6px;flex:1;font-weight:600;font-size:13px;color:var(--cf-text);}
.cf-browse-crumbs{display:flex;align-items:center;flex-wrap:wrap;gap:2px;min-height:22px;font-size:11.5px;overflow:hidden;}
.cf-browse-crumb{background:none;border:1px solid transparent;border-radius:6px;color:var(--cf-dim);font-size:11.5px;padding:2px 6px;cursor:pointer;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cf-browse-crumb:hover{border-color:var(--cf-border2);color:var(--cf-text);}
.cf-browse-crumb.current{color:var(--cf-text);cursor:default;}
.cf-browse-crumb:disabled{cursor:default;}
.cf-browse-sep{color:#6d6d7c;flex:0 0 auto;}
.cf-browse-crumb-dim{color:#6d6d7c;font-size:11.5px;}
.cf-browse-filter{flex:0 0 auto;}
.cf-browse-list{display:flex;flex-direction:column;gap:2px;min-height:180px;max-height:46vh;overflow:auto;border:1px solid var(--cf-border);border-radius:8px;padding:4px;background:rgba(0,0,0,.16);}
.cf-browse-row{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:7px;border:1px solid transparent;cursor:pointer;color:var(--cf-text);}
.cf-browse-row:hover,.cf-browse-row.active{background:rgba(124,140,255,.14);border-color:rgba(124,140,255,.35);}
.cf-browse-row:focus-visible{outline:2px solid rgba(124,140,255,.7);outline-offset:-1px;}
.cf-browse-glyph{flex:0 0 auto;color:var(--cf-dim);display:inline-flex;}
.cf-browse-row.active .cf-browse-glyph{color:#b9c2ff;}
.cf-browse-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;}
.cf-browse-kind{flex:0 0 auto;font-size:10px;color:var(--cf-dim);border:1px solid var(--cf-border2);border-radius:10px;padding:0 6px;}
.cf-browse-empty{padding:22px 8px;text-align:center;color:var(--cf-dim);font-size:11.5px;}
.cf-browse-truncated{padding:6px 8px;font-size:10.5px;color:#fbbf24;text-align:center;}
.cf-browse-status{display:flex;align-items:center;gap:8px;min-height:16px;font-size:11px;color:var(--cf-dim);flex-wrap:wrap;}
.cf-browse-hint{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
.cf-browse-note{color:#d29922;}
.cf-browse-error{color:#f87171;}
.cf-browse .cf-btn.mini{flex:0 0 auto;}
html[data-cf-theme="light"] .cf-browse{background:rgba(15,23,42,.45);}
html[data-cf-theme="light"] .cf-browse-card{background:#ffffff;border-color:#d5dbe6;box-shadow:0 12px 36px rgba(15,23,42,.25);}
html[data-cf-theme="light"] .cf-browse-list{background:#f5f7fa;border-color:#d5dbe6;}
html[data-cf-theme="light"] .cf-browse-row:hover,html[data-cf-theme="light"] .cf-browse-row.active{background:rgba(79,91,213,.10);border-color:rgba(79,91,213,.35);}
html[data-cf-theme="light"] .cf-browse-row.active .cf-browse-glyph{color:#3b46b8;}
html[data-cf-theme="light"] .cf-browse-row{color:#1b1f27;}
html[data-cf-theme="light"] .cf-browse-crumb.current{color:#1b1f27;}
html[data-cf-theme="light"] .cf-browse-sep{color:#5d6673;}
html[data-cf-theme="light"] .cf-browse-crumb-dim{color:#5d6673;}
html[data-cf-theme="light"] .cf-browse-kind{color:#5d6673;border-color:#c3cbda;}
html[data-cf-theme="light"] .cf-browse-truncated{color:#925206;}
html[data-cf-theme="light"] .cf-browse-note{color:#925206;}
html[data-cf-theme="light"] .cf-browse-error{color:#b42318;}
/* ================= v1.3.0：命名菜单栏样式（深色基线） =================
 * 顶栏 flex-wrap:nowrap（任何宽度不换行）+ 命名菜单面板 + 响应式折叠。
 * 浅色覆盖在文件尾，带 html[data-cf-theme="light"] 前缀（与 features/coupling
 * 补丁同一约定，tests/contrast.mjs 审计从浅色注释切片）。 */

/* ---- 顶栏：不换行 + 可收缩 ---- */
.cf-tb{flex-wrap:nowrap; min-width:0;}
.cf-logo{flex:0 0 auto; min-width:0;}
.cf-logo b{white-space:nowrap;}
.cf-menubar{display:flex; align-items:center; gap:1px; position:relative; min-width:0; flex:0 1 auto;}

/* ---- 触发按钮 ---- */
.cf-mbtn{display:inline-flex; align-items:center; gap:4px; padding:5px 9px; border-radius:8px; border:1px solid transparent;
  background:none; color:var(--cf-dim); font-size:12.5px; cursor:pointer; white-space:nowrap;}
.cf-mbtn:hover{border-color:var(--cf-border2); background:#2a2a38; color:var(--cf-text);}
.cf-mbtn[aria-expanded="true"]{border-color:rgba(124,140,255,.45); background:rgba(124,140,255,.16); color:#b9c2ff;}
.cf-mbtn svg{opacity:.7;}
.cf-menu-compact{display:none;}

/* ---- 面板：挂在触发按钮下方，z 高于画布、低于 modal ---- */
.cf-menu-group{position:relative; min-width:0;}
.cf-menupop{position:absolute; top:calc(100% + 4px); left:0; z-index:34; min-width:216px;
  background:rgba(24,24,31,.98); border:1px solid var(--cf-border2); border-radius:10px;
  box-shadow:0 10px 30px rgba(0,0,0,.55); padding:5px; display:flex; flex-direction:column;}
.cf-menupop[hidden]{display:none;}
.cf-menuitem{display:flex; align-items:center; gap:8px; padding:6px 10px; border-radius:7px;
  background:none; border:none; color:var(--cf-text); font-size:12.5px; cursor:pointer; white-space:nowrap; text-align:left;}
.cf-menuitem svg{opacity:.75; flex:0 0 auto;}
.cf-menuitem:hover{background:rgba(124,140,255,.16);}
.cf-menuitem:focus-visible{outline:2px solid rgba(124,140,255,.7); outline-offset:-1px;}
.cf-menuitem[aria-disabled="true"]{opacity:.45; cursor:default;}
.cf-menuitem[aria-disabled="true"]:hover{background:none;}
.cf-menusep{height:1px; background:var(--cf-border); margin:4px 6px;}
.cf-menugroup-title{font-size:10.5px; color:var(--cf-dim); padding:5px 8px 2px; white-space:nowrap;}

/* ---- 折叠面板（<720px 才出现）：fixed 全宽，不依赖触发按钮定位 ---- */
.cf-menupop-compact{position:fixed; top:50px; left:8px; right:8px; min-width:0; max-height:calc(100vh - 60px); overflow-y:auto; z-index:36;}

/* ---- 主按钮文字 / 视图 tab 的响应式收缩（同一布局，只藏展示层） ---- */
.cf-tbtn .cf-tbtn-text{white-space:nowrap;}
.cf-vtab-name{white-space:nowrap;}

@media (max-width:1099px){
  .cf-vtab-name{display:none;}
  .cf-logo-sub{display:none;}
}
@media (max-width:719px){
  .cf-menu-group{display:none;}
  .cf-menu-compact{display:inline-flex;}
  .cf-tbtn .cf-tbtn-text{display:none;}
  .cf-tbtn{padding:5px 7px;}
}
@media (max-width:479px){
  #cf-tb-new,#cf-tb-import,#cf-tb-undo,#cf-tb-save{display:none;}
}

/* ================= 浅色覆盖（html[data-cf-theme="light"] 前缀） ================= */
html[data-cf-theme="light"] .cf-mbtn:hover{background:#eceefc; color:#1f2430;}
html[data-cf-theme="light"] .cf-mbtn[aria-expanded="true"]{background:rgba(79,91,213,.14); border-color:rgba(79,91,213,.4); color:#3742c8;}
html[data-cf-theme="light"] .cf-menupop{background:#ffffff; border-color:#d5d9e6; box-shadow:0 10px 30px rgba(30,35,60,.18);}
html[data-cf-theme="light"] .cf-menuitem{color:#1f2430;}
html[data-cf-theme="light"] .cf-menuitem:hover{background:rgba(79,91,213,.12);}
html[data-cf-theme="light"] .cf-menuitem:focus-visible{outline-color:rgba(79,91,213,.65);}
html[data-cf-theme="light"] .cf-menusep{background:#e3e6f0;}
/* ================= v1.3.0：失效卡片标记（深色基线） =================
 * 不刺眼的小徽章 + 轻量降透明，不用大块红色（任务书 §6.7）。 */
.cf-stale-badge{font-size:9.5px;padding:0 6px;border-radius:8px;border:1px dashed rgba(148,163,184,.55);color:var(--cf-dim);flex:0 0 auto;white-space:nowrap;}
.cf-node.cf-stale-card{opacity:.62;}
.cf-node.cf-stale-card .cf-node-head{border-style:dashed;}

/* 浅色覆盖 */
html[data-cf-theme="light"] .cf-stale-badge{border-color:rgba(100,116,139,.5);color:#64748b;}
/* ================= v1.3.0：工作日志查看器样式（深色基线） ================= */
.cf-lv-body{display:flex;flex-direction:column;gap:6px;min-height:0;}
.cf-lv-fileline{font-size:10.5px;color:var(--cf-dim);word-break:break-all;max-height:32px;overflow:hidden;}
.cf-lv-bar{display:flex;align-items:center;gap:6px;flex-wrap:nowrap;min-width:0;}
.cf-lv-levels{display:inline-flex;gap:2px;}
.cf-lv-search{flex:1 1 auto;min-width:80px;}
.cf-lv-count{font-size:10.5px;color:var(--cf-dim);flex:0 0 auto;font-variant-numeric:tabular-nums;}
.cf-lv-list{flex:1 1 auto;min-height:260px;max-height:52vh;overflow:auto;background:#12121a;border:1px solid var(--cf-border);border-radius:8px;padding:6px 8px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;line-height:1.6;position:relative;overscroll-behavior:contain;}
.cf-lv-line{display:flex;gap:8px;align-items:baseline;white-space:nowrap;}
.cf-lv-time{color:var(--cf-dim);flex:0 0 auto;font-variant-numeric:tabular-nums;}
.cf-lv-level{flex:0 0 auto;font-weight:600;}
.cf-lv-level.lv-debug{color:#8a8a98;}
.cf-lv-level.lv-info{color:#4ade80;}
.cf-lv-level.lv-warn{color:#fbbf24;}
.cf-lv-level.lv-error{color:#f87171;}
/* 级别双编码：颜色 + 文本（INFO/WARN/ERROR 字样常显）——不单靠颜色。 */
.cf-lv-event{color:#b9c2ff;flex:0 0 auto;}
.cf-lv-msg{color:var(--cf-text);overflow:hidden;text-overflow:ellipsis;}
.cf-lv-data{color:var(--cf-dim);overflow:hidden;text-overflow:ellipsis;}
.cf-lv-empty{color:var(--cf-dim);font-size:11.5px;padding:16px;text-align:center;}

/* 浅色覆盖 */
html[data-cf-theme="light"] .cf-lv-list{background:#f6f7fb;border-color:#d5d9e6;}
html[data-cf-theme="light"] .cf-lv-msg{color:#1f2430;}
/* ============================================================================
 * CodeFlow 画布的浅色主题
 * ============================================================================
 * 由 tools/port-canvas.mjs 追加到样式表末尾，因此这些规则永远排在深色规则
 * 之后；选择器统一加 html[data-cf-theme="light"] 前缀，特异性高于原规则，不需要
 * !important，深色外观完全不受影响。
 *
 * 分工：
 *   - 表面 / 边框 / 文字 / 强调色 → 覆盖 #codeflow-canvas 上的 --cf-* 变量，
 *     凡是用 var() 写的规则自动跟随；
 *   - 写死深色字面量的规则（节点卡、对话框、菜单、toast…）→ 逐条覆盖；
 *   - 内联写进 style 的颜色（状态徽章、小地图）由 JS 调色板负责，见 port-canvas.mjs。
 *
 * 取色原则：中性偏冷的浅灰做画布底，白卡承载节点，靛蓝（#4f5bd5）替代深色态
 * 的亮紫强调色，保证白底上的对比度；状态色单独调深以保证文字可读。
 * ========================================================================= */

/* ---- 变量层：全局表面与文字 ---- */
html[data-cf-theme="light"] #codeflow-canvas{
  --cf-bg:#eef1f6; --cf-stage:#f5f7fa; --cf-panel:#ffffff; --cf-panel2:#eef1f6;
  --cf-border:#dee3ea; --cf-border2:#c6cedb; --cf-text:#1b1f27; --cf-dim:#5d6673;
  --cf-accent:#4f5bd5; --cf-danger:#d92d20;
}

/* ---- 节点卡 ---- */
html[data-cf-theme="light"] .cf-node{background:#ffffff; border-color:#d8dee8; box-shadow:0 1px 3px rgba(16,24,40,.07);}
html[data-cf-theme="light"] .cf-node.sel{border-color:var(--cf-accent); box-shadow:0 0 0 2px rgba(79,91,213,.22), 0 6px 18px rgba(16,24,40,.14);}
html[data-cf-theme="light"] .cf-node-head{border-bottom-color:rgba(16,24,40,.10);}
/* 徽章文字是内联状态色，压在按类型着色的头部上只有 ~3.8:1。给一层不透明白底后，
   实际背景回到白色，最差也 >=4.6:1，同时看起来是一枚药丸而不是浮字。 */

  /* 清洗连线：丢弃引用缺失节点/越界端口的连线；输入端口只保留最后一条入线 */
  G.links=G.links.filter(function(l){

  });
  (function(){var seen={},out=[];for(var i=G.links.length-1;i>=0;i--){var k=G.links[i][2]+'_'+G.links[i][3];if(seen[k])continue;seen[k]=1;out.push(G.links[i]);}out.reverse();G.links=out;})();

function buildNode(n){

    h+='</div><div class="cf-scol cf-right">';

/* ================= 视图变换 ================= */
function stageRect(){return $('cf-stage').getBoundingClientRect();}
function applyView(){
  $('cf-world').style.transform='translate('+view.x+'px,'+view.y+'px) scale('+view.k+')';
  var st=$('cf-stage');
  st.style.backgroundSize=(22*view.k)+'px '+(22*view.k)+'px';
  st.style.backgroundPosition=view.x+'px '+view.y+'px';
  $('cf-zoomlab').textContent=Math.round(view.k*100)+'%';
  drawMini();
}
function toWorld(cx,cy){var r=stageRect();return[(cx-r.left-view.x)/view.k,(cy-r.top-view.y)/view.k];}
function zoomAt(cx,cy,f){
  var nk=Math.max(0.2,Math.min(2.5,view.k*f));
  f=nk/view.k;
  view.x=cx-(cx-view.x)*f;view.y=cy-(cy-view.y)*f;view.k=nk;
  applyView();
}
function fitView(){
  clearNavActive();
  if(!G.nodes.length)return;
  var minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;
  G.nodes.forEach(function(n){
    var el=nodeEls[n.id],w=el?el.offsetWidth:(typeOf(n).w||240),h=el?el.offsetHeight:130;
    minx=Math.min(minx,n.pos[0]);miny=Math.min(miny,n.pos[1]);
    maxx=Math.max(maxx,n.pos[0]+w);maxy=Math.max(maxy,n.pos[1]+h);
  });
  var r=stageRect(),cw=Math.max(60,r.width-140),ch=Math.max(60,r.height-140);
  var k=Math.min(cw/Math.max(60,maxx-minx),ch/Math.max(60,maxy-miny));
  k=Math.max(0.2,Math.min(1.35,k));
  view.k=k;
  view.x=(r.width-(maxx-minx)*k)/2-minx*k;
  view.y=(r.height-(maxy-miny)*k)/2-miny*k;
  applyView();
}

/* ================= 模块导航（左侧选项卡） ================= */
var REDUCED=false;
try{REDUCED=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){}
function cancelAnim(){if(anim){cancelAnimationFrame(anim.raf);anim=null;}}
function animateView(tx,ty,tk,ms){
  cancelAnim();
  if(REDUCED){view.x=tx;view.y=ty;view.k=tk;applyView();return;}
  var sx=view.x,sy=view.y,sk=view.k,t0=null;
  var a={raf:0};anim=a;
  function step(t){
    if(anim!==a)return;
    if(!t0)t0=t;
    var p=Math.min(1,(t-t0)/ms);p=1-Math.pow(1-p,3);
    view.x=sx+(tx-sx)*p;view.y=sy+(ty-sy)*p;view.k=sk+(tk-sk)*p;
    applyView();
    if(p<1){a.raf=requestAnimationFrame(step);}else{anim=null;}
  }
  a.raf=requestAnimationFrame(step);
}
function typeColor(cat){for(var k in TYPES){if(TYPES[k].cat===cat)return TYPES[k].color;}return '#64748b';}
function renderNav(){

/* 分类点击：0 个不响应（按钮已禁用）；1 个直接定位（少一次点击）；≥2 弹浮层 */
function onCategoryClick(cat,btn){
  var ns=G.nodes.filter(function(n){return typeOf(n).cat===cat;});
  if(!ns.length)return;

/* 定位单个节点：缩放/平移到它（≈1.0–1.2 倍、居中、带动画），高亮约 1.8s，
   其余节点变暗；同时设为选中态，焦点交还触发按钮 */
function focusNode(id,anchorBtn){
  var n=byId(id);if(!n)return;
  sel={type:'node',id:id};markSel();redrawLinks();
  var el=nodeEls[id];
  var w=el?el.offsetWidth:(typeOf(n).w||240),h=el?el.offsetHeight:130;
  var cx=n.pos[0]+w/2,cy=n.pos[1]+h/2;
  var r=stageRect();
  var k=Math.max(0.5,Math.min(1.2,Math.max(view.k,1.05)));
  animateView(r.width/2-cx*k,r.height/2-cy*k,k,340);
  ROOT.classList.add('cf-focusing');
  G.nodes.forEach(function(nn){var e2=nodeEls[nn.id];if(e2)e2.classList.toggle('cf-hit',nn.id===id);});
  if(focusTimer)clearTimeout(focusTimer);
  focusTimer=setTimeout(function(){
    ROOT.classList.remove('cf-focusing');
    G.nodes.forEach(function(nn){var e2=nodeEls[nn.id];if(e2)e2.classList.remove('cf-hit');});
  },1800);
  if(anchorBtn&&anchorBtn.isConnected){try{anchorBtn.focus({preventScroll:true});}catch(e){}}
}
function clearNavActive(){

/* ---- 二级浮层：可搜索的节点列表 ---- */
var navPop={open:false,cat:null,query:'',items:[],active:-1,anchor:null};
function openNavPop(cat,anchorBtn){

/* v1.3.0：位置与高度由 fitPopover 用 stage 可用空间反推（唯一实现，构建期
   内联）——弹层四边恒落在 stage 内；不再用 60vh（vh 是 iframe 视口，不是
   stage），也不再出现「top 夹到 4 但底部仍溢出」。 */
function positionNavPop(){
  var pop=$('cf-navpop');
  if(!pop)return;
  var rr=stageRect();
  var ref=(navPop.anchor&&navPop.anchor.isConnected)?navPop.anchor:$('cf-nav');
  var br=ref.getBoundingClientRect();
  var anchor={left:br.left-rr.left,top:br.top-rr.top,right:br.right-rr.left,bottom:br.bottom-rr.top};
  var fit=fitPopover({stageW:rr.width,stageH:rr.height,anchorRect:anchor,
    popW:pop.offsetWidth,popH:pop.offsetHeight,pad:8,gap:4,minListHeight:96});
  pop.style.left=fit.left+'px';
  pop.style.top=fit.top+'px';
  pop.style.maxHeight=fit.maxHeight+'px';
}
/* 列表行：类型色点 + 标题 + 次级说明（模块相对路径 / 任务状态摘要）+ 编辑标签。
   默认按标题 zh-CN 排序；搜索命中标题的排在命中路径的前面 */
function navPopSource(){
  return G.nodes.filter(function(n){return typeOf(n).cat===navPop.cat;});
}
function navPopItems(){
  var q=navPop.query.trim().toLowerCase();
  var items=navPopSource().map(function(n){
    var t=typeOf(n);
    var sub='';
    if(n.type==='module'&&n.params&&n.params.path){
      var segs=String(n.params.path).split('\\').join('/').split('/');
      sub=segs.slice(Math.max(0,segs.length-3)).join('/');
    }else{
      var st=STC[n.status]||STC.pending;
      sub=st[0]+(n.result?(' · '+n.result):'');
    }
    var title=String(n.title||t.label);
    var hitTitle=!q||title.toLowerCase().indexOf(q)>=0;
    var hitPath=!q||!sub?hitTitle:(sub.toLowerCase().indexOf(q)>=0);
    return {n:n,title:title,sub:sub,hitTitle:hitTitle,hitPath:hitPath};
  }).filter(function(it){return it.hitTitle||it.hitPath;});
  items.sort(function(a,b){
    if(a.hitTitle!==b.hitTitle)return a.hitTitle?-1:1;
    return a.title.localeCompare(b.title,'zh-CN')||String(a.sub).localeCompare(String(b.sub),'zh-CN');
  });
  return items;
}
function renderNavPop(){
  var list=$('cf-navlist');
  var items=navPopItems();
  navPop.items=items;
  /* v1.3.0：每次重渲染（搜索/图刷新/过滤）后都重算位置与高度。 */
  positionNavPop();
  if(!items.length){list.innerHTML='<div class="cf-navempty">没有匹配的节点</div>';return;}
  list.innerHTML=items.map(function(it,i){return navRowHtml(it,i===navPop.active);}).join('');
  bindNavRowEvents(list);
  scrollNavPopActive();
}
/* 单行结构（v1.1 抽取：features 分组渲染复用同一行结构与事件绑定） */
function navRowHtml(it,active){
  var st=(EDIT_BY_VIEW[CURVIEW]||{})[it.n.id];
  var tag=st?(st.state==='editing'?'<span class="cf-edittag">修改中</span>':st.state==='error'?'<span class="cf-edittag err">修改失败</span>':'<span class="cf-edittag">已修改</span>'):'';
  return '<div class="cf-navrow'+(active?' active':'')+'" role="option" data-id="'+esc(it.n.id)+'" aria-selected="'+(active?'true':'false')+'">'
    +'<span class="cf-navdot" style="background:'+typeColor(typeOf(it.n).cat)+'"></span>'
    +'<span class="cf-navrow-main"><span class="cf-navrow-title">'+esc(it.title)+'</span>'
    +(it.sub?'<span class="cf-navrow-sub" title="'+esc(it.sub)+'">'+esc(it.sub)+'</span>':'')+'</span>'

function bindNavRowEvents(list){
  Array.prototype.forEach.call(list.querySelectorAll('.cf-navrow'),function(row){

function scrollNavPopActive(){

     offsetParent 是 .cf-navlist（CSS 已 position:relative）。 */

  var active=list?list.querySelector('.cf-navrow.active'):null;
  if(!active)return;
  var top=active.offsetTop,bottom=top+active.offsetHeight;
  if(top<list.scrollTop+6)list.scrollTop=Math.max(0,top-6);
  else if(bottom>list.scrollTop+list.clientHeight-6)list.scrollTop=bottom-list.clientHeight+6;
}
function setNavActiveId(id){
  var list=$('cf-navlist');
  navPop.active=-1;
  navPop.items.forEach(function(it,i){if(it.n.id===id)navPop.active=i;});
  Array.prototype.forEach.call(list.querySelectorAll('.cf-navrow'),function(row){

}
function pickNavRow(id){

function closeNavPop(){

  /* 焦点交还触发按钮（可访问性）：renderNav 已重建按钮，按分类序号找回 */
  var btn=(anchor&&anchor.isConnected)?anchor:(function(){
    if(!hadActive||!cat)return null;

    return idx>=0?$('cf-nav').children[idx]:null;
  })();

}
/* 画布开始拖拽/缩放时收起浮层（由 onDown/onWheel 调用；指向浮层内部时不关） */
function closeNavPopOnCanvas(e){
  if(!navPop.open)return;

$('cf-navsearch').addEventListener('input',function(e){

/* 浮层内键盘：↑/↓ 移动、Enter 选中、Esc 关闭、PageUp/PageDown/Home/End 翻页；
   按键不进入画布快捷键 */
$('cf-navsearch').addEventListener('keydown',function(e){
  if(!navPop.open)return;
  var count=navPop.items.length;
  if(e.key==='ArrowDown'){
    e.preventDefault();
    if(count){var nx=Math.min(count-1,navPop.active+1);setNavActiveId(navPop.items[nx].n.id);}
  }else if(e.key==='ArrowUp'){
    e.preventDefault();
    if(count){var pv=Math.max(0,navPop.active-1);setNavActiveId(navPop.items[pv].n.id);}
  }else if(e.key==='PageDown'){
    e.preventDefault();
    if(count){var pd=Math.min(count-1,Math.max(0,navPop.active)+8);setNavActiveId(navPop.items[pd].n.id);}
  }else if(e.key==='PageUp'){
    e.preventDefault();
    if(count){var pu=Math.max(0,Math.max(0,navPop.active)-8);setNavActiveId(navPop.items[pu].n.id);}
  }else if(e.key==='Home'){
    e.preventDefault();
    if(count)setNavActiveId(navPop.items[0].n.id);
  }else if(e.key==='End'){
    e.preventDefault();
    if(count)setNavActiveId(navPop.items[count-1].n.id);
  }else if(e.key==='Enter'){
    e.preventDefault();
    if(count)pickNavRow(navPop.items[Math.max(0,navPop.active)].n.id);
  }else if(e.key==='Escape'){
    e.preventDefault();
    closeNavPop();
  }
  e.stopPropagation();
});
/* 图刷新后浮层仍在打开：列表重算但保留 query；节点失效/分类消失时关闭 */
var renderAllNavBase=renderAll;

/* v1.3.0：面板拖宽/拖窄、DSH 侧边栏宽度变化时重定位（stage 尺寸变了，

/* ================= 连线渲染 ================= *//* ================= 连线渲染 ================= */
var nodeEls={};

/* 每条连线一个独立小 SVG：避免巨型合成图层（GPU 纹理上限会导致整组连线消失） */
var LPAD=48;
function linkPath(a,b,ox,oy){
  var dx=Math.max(40,Math.min(190,Math.abs(b[0]-a[0])*0.55));
  return 'M '+(a[0]-ox)+' '+(a[1]-oy)
    +' C '+(a[0]+dx-ox)+' '+(a[1]-oy)+', '+(b[0]-dx-ox)+' '+(b[1]-oy)
    +', '+(b[0]-ox)+' '+(b[1]-oy);
}
function redrawLinks(){
  var box=$('cf-links');
  box.innerHTML='';
  tempSvg=null;tempPath=null;
  G.nodes.forEach(function(n){var t=typeOf(n);
    (t.ins||[]).forEach(function(_,i){setPortOn(n.id,'in',i,false);});
    (t.outs||[]).forEach(function(_,i){setPortOn(n.id,'out',i,false);});
  });
  var NS='http://www.w3.org/2000/svg';
  G.links.forEach(function(l,idx){
    var a=portAnchor(l[0],'out',l[1]),b=portAnchor(l[2],'in',l[3]);
    if(!a||!b)return;
    setPortOn(l[0],'out',l[1],true);setPortOn(l[2],'in',l[3],true);
    var x=Math.min(a[0],b[0])-LPAD,y=Math.min(a[1],b[1])-LPAD;
    var w=Math.abs(a[0]-b[0])+2*LPAD,h=Math.abs(a[1]-b[1])+2*LPAD;
    var svg=document.createElementNS(NS,'svg');
    svg.setAttribute('class','cf-linksvg');
    svg.setAttribute('data-from',l[0]);
    svg.setAttribute('data-to',l[2]);
    svg.setAttribute('width',Math.max(1,Math.round(w)));
    svg.setAttribute('height',Math.max(1,Math.round(h)));
    svg.style.left=x+'px';svg.style.top=y+'px';
    svg.style.width=Math.round(w)+'px';svg.style.height=Math.round(h)+'px';
    svg.style.setProperty('max-width','none','important');
    svg.style.setProperty('max-height','none','important');
    var d=linkPath(a,b,x,y);
    var hit=document.createElementNS(NS,'path');
    hit.setAttribute('d',d);hit.setAttribute('class','cf-link-hit');hit.setAttribute('data-link',idx);
    var vis=document.createElementNS(NS,'path');
    vis.setAttribute('d',d);vis.setAttribute('class','cf-link'+(sel.type==='link'&&sel.id===idx?' sel':''));
    svg.appendChild(hit);svg.appendChild(vis);
    box.appendChild(svg);
  });
  drawMini();
}
/* 拖拽中的临时连线：同样使用独立小 SVG */
var tempSvg=null,tempPath=null;
function ensureTempLink(){
  if(tempSvg&&tempSvg.isConnected)return;
  var NS='http://www.w3.org/2000/svg';
  tempSvg=document.createElementNS(NS,'svg');
  tempSvg.setAttribute('class','cf-linksvg');
  tempPath=document.createElementNS(NS,'path');
  tempPath.setAttribute('class','cf-templink');
  tempSvg.appendChild(tempPath);
  $('cf-links').appendChild(tempSvg);
}
function updateTempLink(a,b){
  ensureTempLink();
  var x=Math.min(a[0],b[0])-LPAD,y=Math.min(a[1],b[1])-LPAD;
  var w=Math.abs(a[0]-b[0])+2*LPAD,h=Math.abs(a[1]-b[1])+2*LPAD;
  tempSvg.style.display='';
  tempSvg.style.left=x+'px';tempSvg.style.top=y+'px';
  tempSvg.setAttribute('width',Math.max(1,Math.round(w)));
  tempSvg.setAttribute('height',Math.max(1,Math.round(h)));
  tempSvg.style.width=Math.round(w)+'px';tempSvg.style.height=Math.round(h)+'px';
  tempSvg.style.setProperty('max-width','none','important');
  tempSvg.style.setProperty('max-height','none','important');
  tempPath.setAttribute('d',linkPath(a,b,x,y));
}
function hideTempLink(){
  if(tempSvg)tempSvg.style.display='none';
  if(tempPath)tempPath.setAttribute('d','');
}

/* ================= 小地图 ================= */
function drawMini(){
  var c=$('cf-mini');if(!c)return;
  var ctx=c.getContext('2d'),W=c.width,H=c.height;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle=MINI.miniBg;ctx.fillRect(0,0,W,H);
  if(!G.nodes.length)return;
  var minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;
  G.nodes.forEach(function(n){
    var el=nodeEls[n.id],w=el?el.offsetWidth:(typeOf(n).w||240),h=el?el.offsetHeight:130;
    minx=Math.min(minx,n.pos[0]);miny=Math.min(miny,n.pos[1]);
    maxx=Math.max(maxx,n.pos[0]+w);maxy=Math.max(maxy,n.pos[1]+h);
  });
  var bw=Math.max(1,maxx-minx),bh=Math.max(1,maxy-miny);
  var s=Math.min((W-14)/bw,(H-14)/bh,0.6);
  var ox=(W-bw*s)/2,oy=(H-bh*s)/2;
  var stroke=ctx.strokeStyle;ctx.strokeStyle=MINI.miniLink;ctx.lineWidth=1;
  function miniCenter(n){
    var el=nodeEls[n.id];
    var w=el?el.offsetWidth:(typeOf(n).w||240),h=el?el.offsetHeight:130;
    return [ox+(n.pos[0]+w/2-minx)*s,oy+(n.pos[1]+h/2-miny)*s];
  }
  G.links.forEach(function(l){
    var a=byId(l[0]),b=byId(l[2]);if(!a||!b)return;
    var ca=miniCenter(a),cb=miniCenter(b);
    ctx.beginPath();
    ctx.moveTo(ca[0],ca[1]);
    ctx.lineTo(cb[0],cb[1]);
    ctx.stroke();
  });
  G.nodes.forEach(function(n){
    var el=nodeEls[n.id],w=Math.max(4,(el?el.offsetWidth:240)*s),h=Math.max(3,(el?el.offsetHeight:130)*s);
    var stc=(STC[n.status]||STC.pending)[1];
    ctx.fillStyle=stc;
    ctx.globalAlpha=n.status==='pending'?0.55:0.9;
    ctx.fillRect(ox+(n.pos[0]-minx)*s,oy+(n.pos[1]-miny)*s,w,h);
    ctx.globalAlpha=1;
  });
  ctx.strokeStyle=stroke;
  var r=stageRect();
  var vx0=(0-view.x)/view.k,vy0=(0-view.y)/view.k;
  var vx1=(r.width-view.x)/view.k,vy1=(r.height-view.y)/view.k;
  ctx.strokeStyle=MINI.miniView;
  ctx.strokeRect(ox+(vx0-minx)*s,oy+(vy0-miny)*s,(vx1-vx0)*s,(vy1-vy0)*s);
  c._map={minx:minx,miny:miny,s:s,ox:ox,oy:oy};
}
function miniJump(e){
  var c=$('cf-mini'),m=c._map;if(!m)return;
  var r=c.getBoundingClientRect();
  var wx=(e.clientX-r.left-m.ox)/m.s+m.minx;
  var wy=(e.clientY-r.top-m.oy)/m.s+m.miny;
  var sr=stageRect();
  view.x=sr.width/2-wx*view.k;view.y=sr.height/2-wy*view.k;
  applyView();
}
$('cf-mini').addEventListener('pointerdown',function(e){e.stopPropagation();miniJump(e);
  var mv=function(ev){miniJump(ev);};
  var up=function(){window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);};
  window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up);
});

/* ================= 指针交互 ================= */
var stage=$('cf-stage');
stage.addEventListener('pointerdown',onDown);
window.addEventListener('pointermove',onMove);
window.addEventListener('pointerup',onUp);
stage.addEventListener('wheel',onWheel,{passive:false});
stage.addEventListener('dblclick',onDbl);
ROOT.addEventListener('contextmenu',onCtx);
window.addEventListener('keydown',onKey);
window.addEventListener('keyup',function(e){if(e.key===' '){spaceDown=false;ROOT.classList.remove('dragging');}});
window.addEventListener('resize',drawMini);

function isBg(t){return !t.closest('.cf-node')&&!t.closest('.cf-link-hit')&&!t.closest('.cf-mini')&&!t.closest('.cf-zoomer')&&!t.closest('.cf-menu')&&!t.closest('.cf-modal')&&!t.closest('.cf-banner')&&!t.closest('.cf-navpop')&&!t.closest('.cf-browse');}

function onDown(e){
  if(e.button===2)return;
  cancelAnim();
  closeMenus();
  closeNavPopOnCanvas(e);
  var tgt=e.target;
  if(tgt.closest('.cf-nav')||tgt.closest('.cf-navpop')||tgt.closest('.cf-browse'))return;
  if(tgt.closest('.cf-mini')||tgt.closest('.cf-zoomer')||tgt.closest('.cf-banner'))return;
  var port=tgt.closest('.cf-port');
  if(e.button===0&&port){startPortDrag(e,port);return;}
  if(e.button===1||spaceDown||(e.button===0&&isBg(tgt))){
    clearNavActive();
    mode='pan';
    drag={sx:e.clientX,sy:e.clientY,vx:view.x,vy:view.y};
    ROOT.classList.add('dragging');
    if(e.button===0&&isBg(tgt)){sel={type:null,id:null};markSel();redrawLinks();}
    e.preventDefault();
    return;
  }
  var node=tgt.closest('.cf-node');
  if(e.button===0&&node){
    var id=node.dataset.id;
    if(tgt.closest('.cf-widget')||tgt.closest('input')||tgt.closest('select')||tgt.closest('textarea')){
      sel={type:'node',id:id};markSel();redrawLinks();return;
    }
    sel={type:'node',id:id};markSel();redrawLinks();
    var n=byId(id);
    mode='node';
    var w=toWorld(e.clientX,e.clientY);
    drag={id:id,ox:w[0]-n.pos[0],oy:w[1]-n.pos[1],moved:false,sx:e.clientX,sy:e.clientY};
    e.preventDefault();
    return;
  }
  var link=tgt.closest('.cf-link-hit');
  if(e.button===0&&link){
    sel={type:'link',id:Number(link.dataset.link)};markSel();redrawLinks();
  }
}
function markSel(){
  var wrap=$('cf-nodes');
  Array.prototype.forEach.call(wrap.children,function(el){
    el.classList.toggle('sel',sel.type==='node'&&sel.id===el.dataset.id);
  });
}
function onMove(e){
  if(mode==='pan'&&drag){
    view.x=drag.vx+(e.clientX-drag.sx);view.y=drag.vy+(e.clientY-drag.sy);
    applyView();return;
  }
  if(mode==='node'&&drag){
    if(!drag.moved&&Math.abs(e.clientX-drag.sx)+Math.abs(e.clientY-drag.sy)<4)return;
    drag.moved=true;
    var n=byId(drag.id);if(!n)return;
    var w=toWorld(e.clientX,e.clientY);
    n.pos=[Math.round(w[0]-drag.ox),Math.round(w[1]-drag.oy)];
    var el=nodeEls[drag.id];
    if(el){el.style.left=n.pos[0]+'px';el.style.top=n.pos[1]+'px';}
    redrawLinks();
    return;
  }
  if(mode==='port'&&drag){
    var w2=toWorld(e.clientX,e.clientY);
    updateTempLink(drag.anchor,w2);
    var under=document.elementFromPoint(e.clientX,e.clientY);
    var p=under&&under.closest?under.closest('.cf-port'):null;
    document.querySelectorAll('#cf-nodes .cf-port.hot').forEach(function(el){el.classList.remove('hot');});
    if(p&&isCompatTarget(drag.from,p)){p.classList.add('hot');}
  }
}
function onUp(e){
  if(mode==='pan'){mode='idle';drag=null;ROOT.classList.remove('dragging');return;}
  if(mode==='node'){
    var wasDrag=drag&&drag.moved;
    mode='idle';drag=null;ROOT.classList.remove('dragging');
    if(wasDrag)saveState(true);
    return;
  }
  if(mode==='port'){
    hideTempLink();
    document.querySelectorAll('#cf-nodes .cf-port.hot').forEach(function(el){el.classList.remove('hot');});
    document.querySelectorAll('#cf-nodes .cf-port.want').forEach(function(el){el.classList.remove('want');});
    ROOT.classList.remove('linking');
    var from=drag.from;
    mode='idle';drag=null;
    var under=document.elementFromPoint(e.clientX,e.clientY);
    var pe=under&&under.closest?under.closest('.cf-port'):null;
    if(pe&&isCompatTarget(from,pe)){
      finishConnect(from,pe.dataset);
      return;
    }
    var ne=under&&under.closest?under.closest('.cf-node'):null;
    if(ne&&ne.dataset.id!==from.node){
      var n=byId(ne.dataset.id),t=typeOf(n);
      var kind=from.kind==='out'?'in':'out';
      var list=kind==='in'?(t.ins||[]):(t.outs||[]);
      for(var i=0;i<list.length;i++){
        if(compat(from.type,list[i][1])){finishConnect(from,{node:n.id,kind:kind,slot:String(i),ptype:list[i][1]});return;}
      }
      toast('该节点没有兼容的端口','err');return;
    }
  }
}
function onWheel(e){
  if(e.target.closest('.cf-modal')||e.target.closest('.cf-navpop')||e.target.closest('.cf-browse'))return;
  if(mode!=='idle')return;
  e.preventDefault();
  cancelAnim();clearNavActive();
  closeMenuBar(false);
  closeNavPopOnCanvas(e);
  var r=stageRect();
  zoomAt(e.clientX-r.left,e.clientY-r.top,e.deltaY<0?1.12:1/1.12);
}
function onDbl(e){
  if(e.target.closest('.cf-node')){
    var id=e.target.closest('.cf-node').dataset.id;
    openDetails(id);return;
  }
  if(e.target.closest('.cf-modal')||e.target.closest('.cf-mini')||e.target.closest('.cf-zoomer'))return;
  var w=toWorld(e.clientX,e.clientY);
  openAddDialog(w);
}
function onCtx(e){
  if(e.target.closest('input')||e.target.closest('textarea'))return;
  e.preventDefault();
  closeMenus();
  var rr=ROOT.getBoundingClientRect();
  var x=e.clientX-rr.left,y=e.clientY-rr.top;
  var node=e.target.closest('.cf-node');
  if(node){openNodeMenu(node.dataset.id,x,y);return;}
  var link=e.target.closest('.cf-link-hit');
  if(link){openLinkMenu(Number(link.dataset.link),x,y);return;}
  openCanvasMenu(x,y);
}
function onKey(e){
  if(e.key==='Escape'){if(closeMenuBarOnEscape())return;if(closeBrowseOnEscape())return;closeNavPop();closeMenus();closeModal();return;}
  var tag=(e.target.tagName||'').toLowerCase();
  if(tag==='input'||tag==='textarea'||tag==='select')return;
  if(e.key===' '&&!spaceDown){spaceDown=true;ROOT.classList.add('dragging');e.preventDefault();return;}
  if((e.key==='Delete'||e.key==='Backspace')&&sel.type){
    e.preventDefault();deleteSel();
  }
}

/* ================= 连线逻辑 ================= */
function compat(a,b){return a===b||a==='any'||b==='any';}
function isCompatTarget(from,portEl){
  var d=portEl.dataset;
  if(d.node===from.node)return false;
  if(d.kind===from.kind)return false;
  return compat(from.type,d.ptype);
}
function createsCycle(fromId,toId){
  var adj={};
  G.links.forEach(function(l){(adj[l[0]]=adj[l[0]]||[]).push(l[2]);});
  var stack=[toId],seen={};
  while(stack.length){
    var x=stack.pop();
    if(x===fromId)return true;
    if(seen[x])continue;seen[x]=1;
    (adj[x]||[]).forEach(function(y){stack.push(y);});
  }
  return false;
}
function startPortDrag(e,port){
  var d=port.dataset;
  var from={node:d.node,kind:d.kind,slot:Number(d.slot),type:d.ptype};
  var anchor=portAnchor(from.node,from.kind,from.slot);
  if(!anchor)return;
  mode='port';drag={from:from,anchor:anchor};
  sel={type:null,id:null};markSel();redrawLinks();
  ROOT.classList.add('linking');
  document.querySelectorAll('#cf-nodes .cf-port').forEach(function(el){
    var dd=el.dataset;
    if(dd.node===from.node||dd.kind===from.kind)return;
    if(compat(from.type,dd.ptype))el.classList.add('want');
  });
  e.preventDefault();
}
function finishConnect(from,to){
  if(from.kind==='in'){
    var fi=from;
    from={node:to.node,kind:'out',slot:Number(to.slot),type:to.ptype};
    to=fi;
  }
  var fs=Number(from.slot),ts=Number(to.slot);
  if(createsCycle(from.node,to.node)){toast('不允许成环','err');return;}
  var tt=typeOf(byId(to.node));
  var inDef=(tt.ins||[])[ts];
  if(!inDef){toast('目标端口不存在','err');return;}
  if(!compat(from.type,inDef[1])){toast('端口类型不匹配：'+from.type+' → '+inDef[1],'err');return;}
  for(var i=G.links.length-1;i>=0;i--){
    var l=G.links[i];
    if(l[2]===to.node&&l[3]===ts)G.links.splice(i,1);
  }
  G.links.push([from.node,fs,to.node,ts]);
  resetFrom(to.node,true);
  redrawLinks();saveState(true);
  toast('已连接','ok');
}
function resetFrom(nodeId,quiet){
  var adj={};
  G.links.forEach(function(l){(adj[l[0]]=adj[l[0]]||[]).push(l[2]);});
  var stack=[nodeId],seen={},touched=0;
  while(stack.length){
    var x=stack.pop();
    if(seen[x])continue;seen[x]=1;
    var n=byId(x);
    if(n&&(n.status==='done'||n.status==='failed'||n.status==='skipped')){n.status='pending';n.result='';n.detail='';touched++;}
    (adj[x]||[]).forEach(function(y){stack.push(y);});
  }
  if(touched){renderNodes();redrawLinks();markSel();if(!quiet)toast('已重置 '+touched+' 个受影响节点');}
}
function deleteSel(){
  if(sel.type==='node'){
    var id=sel.id,n=byId(id);
    if(!n)return;
    G.nodes=G.nodes.filter(function(x){return x.id!==id;});
    G.links=G.links.filter(function(l){return l[0]!==id&&l[2]!==id;});
    sel={type:null,id:null};
    renderAll();saveState(true);
    toast('已删除节点「'+(n.title||typeOf(n).label)+'」');
  }else if(sel.type==='link'){
    G.links.splice(sel.id,1);
    sel={type:null,id:null};
    redrawLinks();saveState(true);
    toast('已删除连线');
  }
}

/* ================= 节点操作 ================= */
function nextId(){
  var prefix=(CURVIEW==='modules')?'m':'t';
  var re=new RegExp('^'+prefix+'(\\d+)$');
  var max=0;
  G.nodes.forEach(function(n){var m=re.exec(n.id);if(m)max=Math.max(max,Number(m[1]));});
  return prefix+(max+1);
}
function addNode(type,pos){
  var t=TYPES[type];if(!t){toast('未知节点类型','err');return null;}
  var params={};
  (t.widgets||[]).forEach(function(w){params[w[0]]=w[3];});
  var n={id:nextId(),type:type,title:t.label,pos:pos||[0,0],params:params,status:'pending',result:'',detail:''};
  G.nodes.push(n);
  renderNodes();redrawLinks();renderChrome();updateEmpty();renderNav();saveState(true);
  return n;
}
function autoLayout(){
  if(!G.nodes.length)return;
  var depth={};
  G.nodes.forEach(function(n){depth[n.id]=0;});
  var changed=true,guard=0;
  while(changed&&guard++<300){
    changed=false;
    G.links.forEach(function(l){
      if(depth[l[2]]<depth[l[0]]+1){depth[l[2]]=depth[l[0]]+1;changed=true;}
    });
  }
  var layers={};
  G.nodes.forEach(function(n){(layers[depth[n.id]]=layers[depth[n.id]]||[]).push(n);});
  var x=60;
  Object.keys(layers).map(Number).sort(function(a,b){return a-b;}).forEach(function(d){
    var y=60;
    layers[d].forEach(function(n){n.pos=[x,y];var el=nodeEls[n.id];y+=(el?el.offsetHeight:130)+36;});
    x+=330;
  });
  renderNodes();redrawLinks();fitView();saveState(true);
}

/* ================= 菜单 ================= */
var MENUS=[];
function closeMenus(){MENUS.forEach(function(m){if(m.parentNode)m.parentNode.removeChild(m);});MENUS=[];}
function openMenu(items,x,y,level){
  level=level||0;
  MENUS=menusUpTo(level);
  var m=document.createElement('div');
  m.className='cf-menu';
  items.forEach(function(it){
    if(it.sep){var s=document.createElement('div');s.className='cf-msep';m.appendChild(s);return;}
    var b=document.createElement('button');
    b.type='button';b.className='cf-mitem'+(it.danger?' danger':'');
    b.innerHTML='<i data-lucide="'+it.icon+'"></i><span class="cf-grow">'+esc(it.label)+'</span>'+(it.sub?'<span class="cf-sub-arrow">▶</span>':'');
    if(it.sub){
      b.addEventListener('pointerenter',function(){
        var r=b.getBoundingClientRect(),rr=ROOT.getBoundingClientRect();
        openMenu(it.sub,r.right-rr.left+2,r.top-rr.top,level+1);
      });
    }else{
      b.addEventListener('pointerenter',function(){MENUS=menusUpTo(level+1);});
      b.addEventListener('click',function(){closeMenus();it.act();});
    }
    m.appendChild(b);
  });
  ROOT.appendChild(m);MENUS.push(m);
  var mw=m.offsetWidth,mh=m.offsetHeight,rr2=ROOT.getBoundingClientRect();
  m.style.left=Math.max(4,Math.min(x,rr2.width-mw-6))+'px';
  m.style.top=Math.max(4,Math.min(y,rr2.height-mh-6))+'px';
  refreshIcons();
  return m;
}
function menusUpTo(level){var keep=MENUS.slice(0,level);MENUS.slice(level).forEach(function(m){if(m.parentNode)m.parentNode.removeChild(m);});return keep;}
document.addEventListener('pointerdown',function(e){
  if(MENUS.length&&!e.target.closest('.cf-menu'))closeMenus();
},true);

function openCanvasMenu(x,y){
  var addSub=CATS.map(function(c){
    return {label:c[1]+'节点',icon:'shapes',sub:Object.keys(TYPES).filter(function(k){return TYPES[k].cat===c[0];}).map(function(k){
      return {label:TYPES[k].label,icon:'plus',act:function(){var n=addNode(k,[xToWorld(x),yToWorld(y)]);if(n){sel={type:'node',id:n.id};markSel();}}};
    })};
  });
  openMenu([
    {label:'新建项目…',icon:'file-plus-2',act:function(){openNewDialog();}},
    {label:'导入项目…',icon:'folder-open',act:function(){openImportDialog();}},
    {label:'分析全部耦合',icon:'activity',act:function(){runCouplingAnalysis(null);}},
    {sep:true},
    {label:'添加节点',icon:'shapes',sub:addSub},
    {label:'整理布局',icon:'layout-list',act:autoLayout},
    {label:'适应视图',icon:'maximize',act:fitView},
    {sep:true},

var NEWWS={items:[],current:null,previewTimer:null,previewToken:0};
function newWorkspaceOfSelected(){
  var sel=$('cf-new-workspace');
  if(!sel)return null;
  var value=sel.value;
  for(var i=0;i<NEWWS.items.length;i++){if(NEWWS.items[i].path===value)return NEWWS.items[i];}
  return null;
}
function renderNewWorkspaceSelect(){
  var sel=$('cf-new-workspace');
  var hint=$('cf-new-ws-hint');
  var submit=$('cf-dialog').querySelector('[data-act="submit"]');
  if(!sel)return;
  sel.innerHTML='';
  if(!NEWWS.items.length){
    sel.disabled=true;
    if(hint)hint.textContent=NEWWS.message||'请先在 DSH 左侧栏添加一个工作区，然后重试。';
    if(submit)submit.disabled=true;
    updateNewPreview(null);
    return;
  }
  NEWWS.items.forEach(function(ws){
    var opt=document.createElement('option');
    opt.value=ws.path;
    opt.textContent=ws.name+'（'+ws.path+'）';
    sel.appendChild(opt);
  });
  sel.disabled=false;
  if(NEWWS.current){sel.value=NEWWS.current;}
  if(hint)hint.textContent='';
  if(submit)submit.disabled=false;
  updateNewPreview(newWorkspaceOfSelected());
}
function updateNewPreview(ws){
  var el=$('cf-new-preview');
  if(!el)return;
  el.textContent=(ws&&ws.projectDir)?ws.projectDir:((ws&&ws.root)?(ws.root+'/flow-projects/<项目名>（按服务端返回为准）'):'—');
}
function refreshNewPreview(){
  var sel=$('cf-new-workspace');
  if(!sel||!HOSTED)return;
  var name=String(($('cf-dialog').querySelector('[data-f="name"]')||{}).value||'').trim();
  var token=++NEWWS.previewToken;
  apiGet('/codeflow/api/workspaces'+(name?('?project='+encodeURIComponent(name)):'')).then(function(res){
    if(token!==NEWWS.previewToken)return;
    if(res&&res.ok===true){
      NEWWS.items=res.workspaces||[];
      NEWWS.current=res.current||null;
      NEWWS.message=null;
      renderNewWorkspaceSelect();
    }
  }).catch(function(){/* 下拉保持上一次的结果；错误在提交时由服务端给出 */});
}

    +'<div class="cf-dfoot"><button type="button" class="cf-btn" data-act="close">取消</button><button type="button" class="cf-btn cf-primary" data-act="submit">生成初版</button></div>');

      if(res&&res.ok===true){NEWWS.items=res.workspaces||[];NEWWS.current=res.current||null;NEWWS.message=null;}
      else{NEWWS.items=[];NEWWS.message=(res&&res.error)||'当前 DSH 未提供工作区接口。';}
      renderNewWorkspaceSelect();

      openCopyDialog('[CodeFlow:NEW]'+JSON.stringify(obj0));

    submitBtn.disabled=true;

    queueWrite('action',function(){
      return {action:'NEW',title:'CodeFlow · 新建项目',graph:G,view:CURVIEW,viewport:[view.x,view.y,view.k],
        name:name,language:lang,brief:brief,autoRun:auto,workspace:ws.path,project:name};
    }).then(function(res){

        G=clone(res.graph);

        renderAll();

      }
      if(res&&res.delivered===false){
        showBanner((res.warning||'项目已创建，但 agent 未能接手')+'。画布仍可编辑、导入和保存。');
      }else{
        showBanner('已请求 agent：CodeFlow · 新建项目 — 执行完成后画布会自动回填');
      }
      if(res&&res.projectDir){PROJECT_DIR=res.projectDir;updateProjectDirTip();}
      if(res&&res.warning)toast(res.warning,'err');
      else if(res&&res.file)toast('已创建 '+res.projectDir,'ok');
    }).catch(function(err){
      submitBtn.disabled=false;
      errEl.textContent='';
      var text=(err&&err.data&&err.data.error)||(err&&err.message)||String(err);
      if(err&&(err.status===400||err.status===409||err.status===503)){
        /* 校验错误显示在对话框内（不要只 toast），并给出下一步 */
        errEl.textContent=text;
        if(!NEWWS.items.length)refreshNewPreview();
        return;
      }
      if(err&&err.status===409){syncConflict(err);return;}
      toast('请求失败：'+text,'err');
    });
  });
}
