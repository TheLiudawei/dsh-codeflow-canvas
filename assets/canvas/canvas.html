/* ================= 运行与保存 ================= */
function runAll(){
  if(!G.nodes.length){toast('画布为空，先新建或导入项目','err');return;}
  sendMessage('RUN_ALL',{project:G.project,graph:G},'CodeFlow · 运行全部');
}
function runNode(id,rerun){
  var n=byId(id);if(!n)return;
  var t=typeOf(n);
  sendMessage('RUN_NODE',{nodeId:id,rerun:!!rerun,project:G.project,graph:G},'CodeFlow · 运行节点 '+(n.title||t.label));
}
function saveProject(){
  if(!G.project||!G.project.name){
    openPrompt('保存项目','项目名称','my-project',function(v){
      G.project=G.project||{};
      G.project.name=v;
      renderChrome();
      persistProject();
    });
    return;
  }
  persistProject();
}
/* 保存由宿主直接落盘（无需 agent 参与）：点一下就有文件。
   失败时宿主回 507 + ok:false，这里走 catch 而不是误报成功 */
function persistProject(){
  if(!HOSTED){
    try{localStorage.setItem('cf-canvas-standalone',JSON.stringify({graph:G,view:[view.x,view.y,view.k]}));}catch(e){}
    toast('已保存到本机浏览器');
    return;
  }
  clearTimeout(saveTimer);
  queueWrite('save',function(){
    var body={project:G.project&&G.project.name,graph:G,view:CURVIEW,viewport:[view.x,view.y,view.k]};
    if(syncRev>=0)body.expectedRev=syncRev;
    return body;
  })
    .then(function(res){
      if(res&&res.persisted===false){toast(res.warning||'保存失败：图谱未能写入磁盘','err');return;}
      toast(res&&res.file?('已保存 '+res.file):'已保存项目');
      $('cf-saved').textContent='已暂存';
    })
    .catch(function(err){
      if(err&&err.status===409)syncConflict(err);
      else toast('保存失败：'+((err&&err.message)||err),'err');
    });
}

/* ================= 消息发送 ================= */
/* ================= 与宿主通信 ================= */
/* 面板跑在 iframe 里，与宿主同源，直接走 /codeflow/api/*（详见 lib/routes.js） */
/* 所有请求带超时：宿主卡住时手势不再永远悬挂（也是偶发 status=0 fetch failed 的兜底） */
function fetchT(path,opts,ms){
  var o=opts||{};
  try{
    if(typeof AbortSignal!=='undefined'&&typeof AbortSignal.timeout==='function')o.signal=AbortSignal.timeout(ms||15000);
  }catch(e){}
  return fetch(path,o);
}
function parseResp(r){
  return r.text().then(function(raw){
    var data=null;
    try{data=raw?JSON.parse(raw):null;}catch(e){}
    if(!r.ok){
      var err=new Error((data&&data.error)||('HTTP '+r.status));
      err.status=r.status;err.data=data;
      throw err;
    }
    return data||{};
  });
}
function apiPost(kind,body){
  return fetchT('/codeflow/api/'+kind,{
    method:'POST',
    headers:{'content-type':'application/json'},
    cache:'no-store',
    body:JSON.stringify(body)
  }).then(function(r){return parseResp(r);});
}
/* 写操作（autosave/save/action/import）全部串行 + 携带 expectedRev：
   expectedRev 在真正发送那一刻才读取，前一笔写完更新 syncRev 后才发下一笔，
   否则「保存按钮 + 待触发的 autosave」会用过期 rev 互相顶出 409。
   body 一律带 view=CURVIEW：写操作只作用于当前视图，绝不波及另一张图 */
var writeChain=Promise.resolve();
function queueWrite(kind,buildBody){
  var run=writeChain.then(function(){return apiPost(kind,buildBody());});
  writeChain=run.then(function(res){
    if(res&&typeof res.rev==='number')syncRev=res.rev;
  },function(){});
  return run;
}
/* 冲突（409）：另一窗口先写入了。不覆盖本地，也不悄悄抬高 syncRev——
   那等于绕过冲突检测；提示用户，最新内容由轮询/手动刷新采纳 */
function syncConflict(err){
  var cur=(err&&err.data&&err.data.currentRev)!=null?err.data.currentRev:'?';
  $('cf-saved').textContent='同步冲突';
  toast('画布刚被其他窗口修改（服务端 rev '+cur+'），本次写入被拒绝；请确认最新内容后再编辑','err');
  refreshLatestSoon();
}
function refreshLatestSoon(){
  var q=G.project&&G.project.name?('?project='+encodeURIComponent(G.project.name)+'&view='+CURVIEW):'';
  fetchT('/codeflow/api/state'+q,{headers:{'accept':'application/json'},cache:'no-store'})
    .then(function(r){return r.ok?r.json():null;})
    .then(function(p){if(p)adoptServerState(p);})
    .catch(function(){});
}
var lastPersistToast=0;
function persistFailToast(msg){
  var now=Date.now();
  if(now-lastPersistToast<30000)return;
  lastPersistToast=now;
  toast('自动暂存未能落盘：'+msg,'err');
}
/* 采纳服务端更新的图（agent 回填）。只接受更新 rev 的**本视图**状态：
   payload.view 指明它属于哪个视图，别的视图的回填不进入当前画布；
   且不打断正在进行的手势/输入 */
function adoptServerState(payload){
  if(!payload||!valid(payload.graph))return false;
  if(typeof payload.rev!=='number'||payload.rev<=syncRev)return false;
  if(typeof payload.view==='string'&&payload.view!==CURVIEW)return false;
  if(mode!=='idle')return false;
  var el=document.activeElement;
  if(el&&ROOT.contains(el)&&/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName))return false;
  syncRev=payload.rev;
  if(Array.isArray(payload.viewport)&&payload.viewport.length===3){view={x:payload.viewport[0],y:payload.viewport[1],k:payload.viewport[2]};}
  G=clone(payload.graph);
  if(!G.meta)G.meta={};
  renderAll();
  applyView();
  return true;
}
var syncTimer=null,syncFailures=0,degradedNotified=null;
function startSync(){
  if(syncTimer)return;
  syncTimer=setInterval(function(){
    if(document.hidden)return;
    var q=G.project&&G.project.name?('?project='+encodeURIComponent(G.project.name)+'&view='+CURVIEW):'';
    fetchT('/codeflow/api/state'+q,{headers:{'accept':'application/json'},cache:'no-store'})
      .then(function(r){return r.ok?r.json():null;})
      .then(function(p){
        syncFailures=0;
        if(!p)return;
        /* 损坏文件被隔离后，服务端会一直带 degraded：每个 rev 只提醒一次 */
        if(p.degraded&&degradedNotified!==p.rev){
          degradedNotified=p.rev;
          showBanner('警告：当前视图的图文件已损坏（'+((p.degraded&&p.degraded.reason)||'未知原因')+'）'
            +(p.degraded.quarantinedTo?('，坏文件已隔离为 '+p.degraded.quarantinedTo):'')
            +'；画布已重置，请重新编辑后保存。');
        }
        adoptServerState(p);
      })
      .catch(function(){
        syncFailures++;
        /* 连续失败才提示：单次网络抖动不值得打断用户 */
        if(syncFailures===3)showBanner('与宿主的连接中断，正在自动重试…（编辑仍在本地，恢复后继续同步）');
      });
  },1800);
}
/* 导入项目由宿主直接完成（/api/import → lib/duo.js 同时生成两张图）：
   不经过 agent，返回的任务流水线立即上画布，模块图切换即可见 */
function importProject(payload){
  if(!HOSTED){
    var obj0={action:'IMPORT',rev:G.rev||0};
    Object.keys(payload).forEach(function(k){obj0[k]=payload[k];});
    openCopyDialog('[CodeFlow:IMPORT]'+JSON.stringify(obj0));
    return;
  }
  queueWrite('import',function(){return payload;}).then(function(res){
    if(res&&res.graph&&valid(res.graph)){
      CURVIEW='tasks';
      if(res.views)VIEWMETA=res.views;
      G=clone(res.graph);
      if(!G.meta)G.meta={};
      sel={type:null,id:null};
      renderAll();
      applyView();
      if(G.nodes.length)requestAnimationFrame(function(){fitView();});
      renderViewTabs();
      if(res.warning)toast(res.warning,'err');
      else toast('导入完成：'+(res.summary||res.project||''));
    }else{
      toast('导入失败：'+((res&&(res.error||res.warning))||'未知错误'),'err');
    }
  }).catch(function(err){
    if(err&&err.status===409)syncConflict(err);
    else toast('导入失败：'+((err&&err.message)||err),'err');
  });
}
function sendMessage(action,payload,title){
  if(!HOSTED){
    var obj0={action:action,rev:G.rev||0};
    Object.keys(payload).forEach(function(k){obj0[k]=payload[k];});
    openCopyDialog('[CodeFlow:'+action+']'+JSON.stringify(obj0));
    return;
  }
  queueWrite('action',function(){
    /* body 在真正发送时构建：graph/expectedRev/viewport 都取当下值；
       view 告诉宿主本次运行作用于哪个视图（graphPath 也会指向对应文件） */
    var body={action:action,title:title,graph:G,view:CURVIEW,viewport:[view.x,view.y,view.k]};
    if(action!=='NEW'&&syncRev>=0)body.expectedRev=syncRev;
    if(payload.nodeId!=null)body.nodeId=payload.nodeId;
    if(payload.rerun!=null)body.rerun=payload.rerun;
    if(payload.brief!=null)body.brief=payload.brief;
    if(payload.autoRun!=null)body.autoRun=payload.autoRun;
    if(payload.path!=null)body.path=payload.path;
    if(payload.depth!=null)body.depth=payload.depth;
    if(payload.fromComments!=null)body.fromComments=payload.fromComments;
    if(payload.addTests!=null)body.addTests=payload.addTests;
    if(payload.project){
      if(payload.project.name)body.name=payload.project.name;
      if(payload.project.language)body.language=payload.project.language;
    }
    return body;
  }).then(function(res){
    /* 新建项目时宿主先写一张骨架图再交给 agent；立即采纳，避免界面还停在旧项目 */
    if(res&&res.graph&&valid(res.graph)){
      G=clone(res.graph);
      if(!G.meta)G.meta={};
      renderAll();
      applyView();
      if(G.nodes.length)requestAnimationFrame(function(){fitView();});
    }
    if(res&&res.delivered===false){
      showBanner((res.warning||'项目已创建，但 agent 未能接手')+'。画布仍可编辑、导入和保存。');
    }else{
      showBanner('已请求 agent：'+title+' — 执行完成后画布会自动回填');
    }
    if(res&&res.warning)toast(res.warning,'err');
  }).catch(function(err){
    if(err&&err.status===409)syncConflict(err);
    else toast('请求失败：'+((err&&err.message)||err),'err');
  });
}
function showBanner(text){
  $('cf-banner-text').textContent=text;
  $('cf-banner').hidden=false;
}
$('cf-banner-x').addEventListener('click',function(){$('cf-banner').hidden=true;});

/* ================= 提示 ================= */
function toast(msg,kind){
  var wrap=$('cf-toasts');
  var t=document.createElement('div');
  t.className='cf-toast'+(kind?' '+kind:'');
  t.textContent=msg;
  wrap.appendChild(t);
  setTimeout(function(){if(t.parentNode)t.parentNode.removeChild(t);},2600);
}

/* ================= 本地暂存 ================= */
function saveState(sooner){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(function(){
    if(!HOSTED){
      try{localStorage.setItem('cf-canvas-standalone',JSON.stringify({graph:G,view:[view.x,view.y,view.k]}));}catch(e){}
      $('cf-saved').textContent='已暂存';
      return;
    }
    /* 宿主现在即时落盘并在响应里带 persisted/error：写失败不再被吞 */
    queueWrite('state',function(){
      var body={graph:G,view:CURVIEW,viewport:[view.x,view.y,view.k]};
      if(syncRev>=0)body.expectedRev=syncRev;
      return body;
    })
      .then(function(res){
        $('cf-saved').textContent=(res&&res.persisted===false)?'暂存失败（未落盘）':'已暂存';
        if(res&&res.persisted===false)persistFailToast((res&&res.error)||'图谱未能写入磁盘');
      })
      .catch(function(err){
        if(err&&err.status===409){syncConflict(err);}
        else{$('cf-saved').textContent='暂存失败';persistFailToast((err&&err.message)||'网络错误');}
      });
  },sooner?250:700);
}

/* ================= 控件事件 ================= */
$('cf-nodes').addEventListener('change',function(e){
  var el=e.target;
  var pn=el.closest('.cf-node');if(!pn)return;
  var n=byId(pn.dataset.id);if(!n)return;
  var p=el.getAttribute('data-param');if(!p)return;
  n.params=n.params||{};
  n.params[p]=el.type==='checkbox'?el.checked:el.value;
  if(n.status==='done'||n.status==='failed'||n.status==='skipped'){resetFrom(n.id,true);toast('参数已变更，该节点及其下游已重置');}
  saveState(true);
});

/* ==== v1.3.0：弹层几何（由 tools/port-canvas.mjs 从 lib/ui/fit-popover.js 内联；单一实现） ==== */
var fitPopover=function fitPopover(options = {}) {
  const stageW = Math.max(0, Number(options.stageW) || 0)
  const stageH = Math.max(0, Number(options.stageH) || 0)
  const anchor = options.anchorRect ?? { left: 0, top: 0, right: 0, bottom: 0 }
  const popW = Math.max(0, Number(options.popW) || 0)
  const popH = Math.max(0, Number(options.popH) || 0)
  const pad = Number.isFinite(options.pad) ? options.pad : 8
  const gap = Number.isFinite(options.gap) ? options.gap : 4
  const minListHeight = Number.isFinite(options.minListHeight) ? options.minListHeight : 96
  const innerH = Math.max(0, stageH - 2 * pad)
  /* 极矮 stage（< 320px）：列表至少保留 minListHeight 且可滚，不能被压成 0。 */
  const minH = Math.min(minListHeight, Math.max(minListHeight, innerH))

  /* 垂直：优先锚点下方（高度=下方空间反推）；下方放不下最小高度时翻到上方；
     上下都不够 → 从 pad 起、高度=stage 内高。top + maxHeight 恒 ≤ stageH - pad。 */
  const below = innerH - (anchor.bottom + gap - pad)
  const above = anchor.top - gap - pad
  let top
  let maxHeight
  if (below >= Math.min(popH, minH) || below >= above) {
    top = anchor.bottom + gap
    maxHeight = Math.max(minH, below)
  } else {
    maxHeight = Math.max(minH, above)
    top = Math.max(pad, anchor.top - gap - maxHeight)
  }
  if (top + maxHeight > stageH - pad) top = Math.max(pad, stageH - pad - maxHeight)
  if (top < pad) top = pad

  /* 水平：默认锚点右侧；放不下 → 翻到锚点左侧；再放不下 → 贴右侧内边距。 */
  let left = anchor.right + gap
  let side = 'right'
  if (left + popW > stageW - pad) {
    left = anchor.left - gap - popW
    side = 'left'
  }
  if (left + popW > stageW - pad) left = Math.max(pad, stageW - pad - popW)
  if (left < pad) left = pad

  return { left, top, maxHeight, side }
};

/* ================= v0.6.0：双视图 / 编辑高亮 ================= */
var CURVIEW=(HOSTED&&BOOT.activeView==='modules')?'modules':'tasks';
var VIEWMETA=(HOSTED&&BOOT.views)||null;
var VIEWPORTS={};
if(HOSTED&&Array.isArray(BOOT.viewport)&&BOOT.viewport.length===3)VIEWPORTS[CURVIEW]=BOOT.viewport.slice();
else if(HOSTED&&Array.isArray(BOOT.view)&&BOOT.view.length===3)VIEWPORTS[CURVIEW]=BOOT.view.slice();
var switchingView=false;
var EDIT_MARK_MS=15000;
var EDIT_BY_VIEW={tasks:{},modules:{}};
var editMarkTimer=null;

function viewsAvailable(){
  return !!(HOSTED&&VIEWMETA&&VIEWMETA.tasks&&VIEWMETA.tasks.available&&VIEWMETA.modules&&VIEWMETA.modules.available);
}
function renderViewTabs(){
  var wrap=$('cf-viewtabs');
  if(!wrap)return;
  if(!viewsAvailable()){wrap.hidden=true;return;}
  wrap.hidden=false;
  ['tasks','modules'].forEach(function(v){
    var b=$('cf-vtab-'+v);
    if(!b)return;
    var meta=(VIEWMETA&&VIEWMETA[v])||{};
    var cnt=(v===CURVIEW)?G.nodes.length:(typeof meta.nodes==='number'?meta.nodes:0);
    var cntEl=b.querySelector('.cf-vtab-count');
    if(cntEl)cntEl.textContent=cnt;
    b.classList.toggle('active',CURVIEW===v);
    b.setAttribute('aria-selected',CURVIEW===v?'true':'false');
    b.setAttribute('tabindex',CURVIEW===v?'0':'-1');
    var dot=b.querySelector('.cf-vtab-dot');
    if(dot)dot.hidden=!otherViewHasEdits(v);
  });
}
function otherViewHasEdits(v){
  var now=Date.now();
  var table=EDIT_BY_VIEW[v]||{};
  for(var id in table){
    var st=table[id];
    if(st.state==='editing'||(st.state!=='error'&&now-st.at<EDIT_MARK_MS))return true;
  }
  return false;
}
/* 宿主 /api/activity 的 edits → 本地编辑表（按视图分组，nodeId 已由宿主匹配好） */
function applyEditData(edits){
  var now=Date.now();
  var changed=false;
  (edits||[]).forEach(function(ed){
    if(!ed)return;
    var views=ed.nodeIds||{};
    ['tasks','modules'].forEach(function(v){
      var list=views[v]||[];
      for(var i=0;i<list.length;i++){
        EDIT_BY_VIEW[v][list[i]]={state:ed.state,at:ed.at,rel:ed.rel||''};
        changed=true;
      }
    });
  });
  ['tasks','modules'].forEach(function(v){
    var table=EDIT_BY_VIEW[v];
    for(var id in table){
      var st=table[id];
      if(st.state!=='editing'&&now-st.at>EDIT_MARK_MS*4)delete table[id];
    }
  });
  if(changed)applyEditMarks();
}
/* 只按 nodeId 增删 class/徽章，绝不为了高亮整图重渲染（避免打断拖拽/输入） */
function applyEditMarks(){
  var now=Date.now();
  var nextExpiry=Infinity;
  var table=EDIT_BY_VIEW[CURVIEW]||{};
  for(var id in table){
    var st=table[id];
    var live=st.state==='editing';
    var recent=!live&&(now-st.at)<EDIT_MARK_MS;
    if(!live&&recent)nextExpiry=Math.min(nextExpiry,st.at+EDIT_MARK_MS);
    var el=nodeEl(id);
    if(!el)continue;
    var primary=CURVIEW==='modules';
    el.classList.toggle('cf-edit-related',!primary&&(live||recent)&&st.state!=='error');
    el.classList.toggle('cf-editing',primary&&live);
    el.classList.toggle('cf-edited',primary&&!live&&recent&&st.state!=='error');
    el.classList.toggle('cf-edit-err',primary&&!live&&recent&&st.state==='error');
    var head=el.querySelector('.cf-node-head');
    var badge=head?head.querySelector('.cf-editbadge'):null;
    if(primary&&head&&(live||recent)){
      if(!badge){badge=document.createElement('span');badge.className='cf-editbadge';head.appendChild(badge);}
      badge.textContent=live?'修改中':(st.state==='error'?'修改失败':'已修改');
      badge.classList.toggle('err',!live&&st.state==='error');
    }else if(badge&&badge.parentNode){badge.parentNode.removeChild(badge);}
  }
  if(editMarkTimer){clearTimeout(editMarkTimer);editMarkTimer=null;}
  if(nextExpiry!==Infinity)editMarkTimer=setTimeout(applyEditMarks,Math.max(300,nextExpiry-now+50));
  renderViewTabs();
  decorateNavDots();
}

function decorateNavDots(){

  var now=Date.now();
  var table=EDIT_BY_VIEW[CURVIEW]||{};
  CATS.forEach(function(c,i){

    });

/* 切换视图：flush 写队列 → 拉目标视图 → 换图 + 恢复视口；失败留在原视图 */
function switchView(next){
  if(next===CURVIEW)return;
  void doSwitchView(next);
}
async function doSwitchView(next){
  if(!HOSTED||switchingView)return;
  var name=G.project&&G.project.name;
  if(!name){toast('先打开一个项目','err');return;}
  switchingView=true;
  try{
    closeNavPop();closeMenus();
    /* 1. 等待待发送的写队列，避免丢编辑 */
    try{await writeChain;}catch(e){}
    /* 2. 请求目标视图状态 */
    var res=await apiGet('/codeflow/api/state?project='+encodeURIComponent(name)+'&view='+next);
    if(!res||!valid(res.graph))throw new Error((res&&res.error)||'目标视图不可用');
    /* 3. 记住当前视图视口 → 整图替换 */
    VIEWPORTS[CURVIEW]=[view.x,view.y,view.k];
    CURVIEW=next;
    syncRev=typeof res.rev==='number'?res.rev:syncRev;
    if(res.views)VIEWMETA=res.views;
    if(Array.isArray(res.viewport)&&res.viewport.length===3)VIEWPORTS[next]=res.viewport.slice();
    G=clone(res.graph);
    if(!G.meta)G.meta={};
    sel={type:null,id:null};mode='idle';drag=null;navActive=null;
    renderAll();
    /* 4. 恢复该视图上次的缩放/平移（持久化值优先，其次本会话记住的） */
    var vp=VIEWPORTS[next];
    if(vp&&vp.length===3){view={x:vp[0],y:vp[1],k:vp[2]};applyView();}
    else if(G.nodes.length){requestAnimationFrame(function(){fitView();});}
    else{applyView();}
    /* 5. 持久化激活视图（不 bump rev、不扫描、不唤醒 agent） */
    apiPost('view',{project:name,view:next}).catch(function(){});
    applyEditMarks();
    renderViewTabs();
    toast(next==='modules'?'已切换到模块结构图':'已切换到任务流水线');
  }catch(err){
    toast('切换视图失败：'+((err&&err.message)||err),'err');
  }finally{
    switchingView=false;
  }
}

function fmtMs(ms){
  if(typeof ms!=='number'||!(ms>=0))return '';
  var s=Math.floor(ms/1000);
  if(s<60)return s+'s';
  return Math.floor(s/60)+'m'+String(s%60).padStart(2,'0')+'s';

function fmtWhen(t){

}
/* 与 apiPost 共用超时与错误结构（fetchT/parseResp 定义在与宿主通信一节，函数声明提升可用） */

}

/* ---- 节点活动行 + 交付徽标 ---- */
function nodeStats(id){
  var list=ACT.byNode[id]||[];
  var steps=0,last='',err='',reasoning='';
  for(var i=list.length-1;i>=0;i--){
    var en=list[i];
    if(en.kind==='tool'||en.kind==='step')steps++;
    if(!last&&(en.kind==='step'||en.kind==='tool'||en.kind==='status'))last=en.text;
    if(!err&&(en.kind==='status')&&/失败|错误|无法/.test(en.text))err=en.text;
    if(!reasoning&&en.kind==='reasoning')reasoning=en.text;
  }
  var node=byId(id);
  if(!last&&node&&node.status==='failed'&&node.detail)err=node.detail.split('\n')[0];
  if(!last&&node&&node.status==='running')last='执行中…';
  return {steps:steps,last:last,err:err,reasoning:reasoning};
}
function decorateNodes(){
  if(!G.nodes.length)return;
  for(var i=0;i<G.nodes.length;i++){paintNodeExtras(G.nodes[i].id);}
  refreshIcons();
}
function paintNodeExtras(id){
  var el=nodeEl(id);if(!el)return;
  var n=byId(id);if(!n)return;
  var line=el.querySelector('.cf-node-act');
  var stats=nodeStats(id);
  var artifacts=Array.isArray(n.artifacts)?n.artifacts:[];
  var wantDeliverBadge=n.type==='deliver'&&n.status==='done'&&artifacts.length>0;
  var terminal=n.status==='done'||n.status==='failed';
  var need=!!(stats.last||stats.err||wantDeliverBadge||(stats.steps>0&&terminal));
  if(!need){if(line)line.parentNode.removeChild(line);return;}
  if(!line){
    line=document.createElement('div');
    line.className='cf-node-act';
    el.appendChild(line);
  }
  line.classList.toggle('err',!!stats.err);
  var html='';
  if(n.status==='running')html+='<span class="cf-act-spin">◐</span>';
  var txt=stats.err||stats.last||'';
  /* v0.6.0：节点活动行追加真实编辑摘要（agent 正在改/刚改过哪个文件） */
  var ed=(EDIT_BY_VIEW[CURVIEW]||{})[id];
  if(ed&&ed.rel&&(ed.state==='editing'||Date.now()-ed.at<EDIT_MARK_MS)){
    txt=(txt?txt+' · ':'')+(ed.state==='editing'?'修改中 ':'修改 ')+ed.rel;
  }
  if(wantDeliverBadge)txt=(txt?txt+' · ':'')+(stats.steps>0?stats.steps+' 步 · ':'')+artifacts.length+' 个交付物'+(Array.isArray(n.presented)&&n.presented.length?(' · 已提交 '+n.presented.length+' 个卡片'):'');
  else if(n.status==='done'&&stats.steps>0&&!stats.err)txt=(txt?txt+' · ':'')+stats.steps+' 步'+(ACT.progress&&ACT.progress.elapsedMs?(' · '+fmtMs(ACT.progress.elapsedMs)):'');
  html+='<span class="cf-act-text">'+esc(txt)+'</span>';
  if(n.status==='running'){
    var meta=[];
    if(stats.steps>0)meta.push(stats.steps+' 步');
    if(ACT.progress&&ACT.progress.elapsedMs)meta.push(fmtMs(ACT.progress.elapsedMs));
    if(meta.length)html+='<span class="cf-act-meta">'+esc(meta.join(' · '))+'</span>';
  }
  line.innerHTML=html;
}
/* 活动数据到来时只更新受影响节点的一行 + 监视器，不触发 renderAll */
function updateNodeLine(id){
  paintNodeExtras(id);
  if(detailsNodeId===id)refreshDetailsActivity();
  renderMonitor();
}

/* ---- Activity 轮询 ---- */
function activityResetLocal(){
  ACT.running=false;ACT.seq=0;ACT.entries=[];ACT.byNode={};ACT.progress=null;ACT.action=null;ACT.nodeId=null;ACT.startedAt=null;ACT.deliverToasted=false;ACT.issueAt=0;
  decorateNodes();renderMonitor();stopActivitySync();
}
function startActivitySync(){
  if(!HOSTED||actTimer)return;
  actTimer=setInterval(pollActivity,850);
  pollActivity();
}
function stopActivitySync(){
  if(actTimer){clearInterval(actTimer);actTimer=null;}
}
function pollActivity(){
  if(!HOSTED||actInflight||document.hidden)return;
  var name=G.project&&G.project.name;if(!name)return;
  actInflight=true;
  apiGet('/codeflow/api/activity?project='+encodeURIComponent(name)+'&after='+ACT.seq)
    .then(function(p){actInflight=false;applyActivity(p);})
    .catch(function(){actInflight=false;});
}
function applyActivity(p){
  if(!p||p.ok===false)return;
  if(p.reset){ACT.entries=[];ACT.byNode={};ACT.seq=0;ACT.deliverToasted=false;}
  var seen=ACT.seq;
  (p.entries||[]).forEach(function(en){
    if(typeof en.seq!=='number'||en.seq<=seen)return;
    seen=Math.max(seen,en.seq);
    var e={seq:en.seq,time:en.time,kind:en.kind,text:String(en.text||''),name:en.name,status:en.status,ms:en.ms,truncated:en.truncated};
    var nid=en.nodeId||p.nodeId||ACT.nodeId;
    if(nid){
      e.nodeId=nid;
      (ACT.byNode[nid]=ACT.byNode[nid]||[]).push(e);
      if(ACT.byNode[nid].length>200)ACT.byNode[nid].splice(0,ACT.byNode[nid].length-200);
      updateNodeLine(nid);
    }
    ACT.entries.push(e);
    if(ACT.entries.length>600)ACT.entries.splice(0,ACT.entries.length-600);
    var presented=/已提交 (\d+) 个交付卡片/.exec(e.kind==='status'?e.text:'');
    if(presented&&!ACT.deliverToasted){
      ACT.deliverToasted=true;
      toast('已提交 '+presented[1]+' 个交付卡片到专用会话，点会话卡片可在右侧栏预览','ok');
    }
  });
  ACT.seq=Math.max(ACT.seq,typeof p.seq==='number'?p.seq:seen);
  /* v0.6.0：真实编辑状态（宿主从写文件工具调用中提取）→ 节点高亮/侧边栏圆点 */
  applyEditData(p.edits);
  /* v1.0：项目实际落盘目录（状态栏 tooltip 用）；宿主对账出的 issue → 横幅+重试 */
  if(typeof p.projectDir==='string'&&p.projectDir){PROJECT_DIR=p.projectDir;updateProjectDirTip();}
  if(p.issue&&p.issue.text&&p.issue.at!==ACT.issueAt){
    ACT.issueAt=p.issue.at;
    showIssue(p.issue);
    if(typeof p.issue.nodeId==='string'&&p.issue.nodeId)updateNodeLine(p.issue.nodeId);
  }
  var wasRunning=ACT.running;
  ACT.running=!!p.running;
  ACT.action=p.action||ACT.action;
  ACT.nodeId=p.nodeId||ACT.nodeId;
  ACT.startedAt=p.startedAt||ACT.startedAt;
  ACT.progress=p.progress||null;
  ACT.lastAt=Date.now();
  renderMonitor();
  if(detailsNodeId)refreshDetailsActivity();
  if(wasRunning&&!ACT.running&&!hasRunningNodes()){
    /* 运行结束：显示最终摘要，几秒后收起轮询 */
    stopActivitySync();
    var pr=ACT.progress;
    var summary=pr?('运行结束：'+pr.done+'/'+pr.total+' 完成'+(pr.failed?('，'+pr.failed+' 失败'):'')):'运行结束';
    showBanner(summary);
    updateUndoButton();
    setTimeout(function(){if(!ACT.running&&monitorEl)monitorEl.remove();monitorEl=null;},20000);
  }
}
document.addEventListener('visibilitychange',function(){
  if(!document.hidden&&(ACT.running||hasRunningNodes())){pollActivity();if(!actTimer)startActivitySync();}
});

/* ---- 执行监视器 ---- */
function renderMonitor(){
  if(!HOSTED){return;}

    monitorEl.querySelector('.cf-monitor-head').addEventListener('click',function(){

    });
    $('cf-stage').appendChild(monitorEl);
    try{if(localStorage.getItem('cf-monitor-collapsed')==='1')monitorEl.classList.add('collapsed');}catch(e){}
  }
  var body=monitorEl.querySelector('.cf-monitor-body');
  var pr=ACT.progress||{};
  var done=typeof pr.done==='number'?pr.done:0,total=typeof pr.total==='number'?pr.total:G.nodes.length;
  var current=pr.current?byId(pr.current):null;
  var curTitle=current?(current.title||typeOf(current).label):'—';
  var latestReasoning='';
  for(var i=ACT.entries.length-1;i>=0;i--){if(ACT.entries[i].kind==='reasoning'){latestReasoning=ACT.entries[i].text;}}
  if(latestReasoning.length>110)latestReasoning=latestReasoning.slice(-110);
  var percent=(typeof pr.percent==='number')?pr.percent:null;
  var bar=percent===null
    ?'<div class="cf-mrow"><div class="cf-mbar indeterminate"><i></i></div></div>'
    :'<div class="cf-mrow"><div class="cf-mbar"><i style="width:'+Math.max(0,Math.min(100,percent))+'%"></i></div><span class="cf-progress-num">'+percent+'%</span></div>';
  var head=monitorEl.querySelector('.cf-mtitle');
  head.textContent=ACT.running?('执行中 '+done+'/'+total):('执行结束 '+done+'/'+total);
  body.innerHTML=bar
    +'<div class="cf-mrow"><b>当前</b><span class="cf-mline">'+esc(curTitle)+'</span></div>'
    +'<div class="cf-mrow"><b>耗时</b><span class="cf-mline">'+esc(fmtMs(pr.elapsedMs)||'—')+(pr.steps?(' · '+pr.steps+' 步'):'')+'</span></div>'
    +(latestReasoning?'<div class="cf-mrow"><b>思考</b><span class="cf-mline" title="'+esc(latestReasoning)+'">'+esc(latestReasoning)+'</span></div>':'')
    +'<div class="cf-mrow"><b>会话</b><span class="cf-mline">'+esc(SESSION.title||'未绑定')+'</span></div>';
}

/* ---- 详情弹窗：执行过程 + 交付物 ---- */
var openDetailsBase=openDetails;
function artifactKindIcon(kind){
  return kind==='code'?'{ }':kind==='doc'?'§':kind==='test'?'✓':kind==='config'?'⚙':kind==='asset'?'▣':'·';

/* 重定义详情弹窗：原有键值行 + 交付物区 + 执行过程区（赋值覆盖，不重声明） */
openDetails=function(id){
  var n=byId(id);if(!n)return;
  var t=typeOf(n),st=STC[n.status]||STC.pending;
  var ups=[],downs=[];
  G.links.forEach(function(l){
    if(l[2]===id){var u=byId(l[0]);if(u)ups.push(u.title||typeOf(u).label);}
    if(l[0]===id){var dn=byId(l[2]);if(dn)downs.push(dn.title||typeOf(dn).label);}
  });
  var h=dHead('info',(n.title||t.label)+' · 详情')
    +'<div class="cf-dbody">'
    +'<div class="cf-kv"><b>类型</b><span>'+esc(t.label)+'（'+esc(n.type)+'）</span></div>'
    +'<div class="cf-kv"><b>状态</b><span style="color:'+st[1]+'">'+SGLYPH[n.status]+' '+st[0]+'</span></div>'
    +'<div class="cf-kv"><b>说明</b><span>'+esc(t.desc)+'</span></div>';
  Object.keys(n.params||{}).forEach(function(k){
    var v=String(n.params[k]);if(v.length>160)v=v.slice(0,160)+'…';
    if(v)h+='<div class="cf-kv"><b>'+esc(k)+'</b><span>'+esc(v)+'</span></div>';
  });
  if(n.result)h+='<div class="cf-kv"><b>结果</b><span>'+esc(n.result)+'</span></div>';
  if(n.detail)h+='<div class="cf-kv"><b>详情</b><span>'+esc(n.detail)+'</span></div>';

        h+='<div class="cf-art"><span class="cf-artkind">'+esc(artifactKindIcon(a.kind))+'</span>'
          +'<span class="cf-artpath">'+esc(a.path)+'</span>'

          +(a.kind?'<span class="cf-artkind">'+esc(a.kind)+'</span>':'')
          +'</div>';
      });

      if(n.type==='deliver'&&Array.isArray(n.presented)&&n.presented.length)h+='<div class="cf-sechint" style="margin-top:5px">已提交 '+n.presented.length+' 个交付卡片到专用会话。</div>';

  h+='</div>'
    +'<div class="cf-dfoot" style="flex-wrap:wrap">'
    +(HOSTED?'<button type="button" class="cf-btn mini" data-act="session">在会话中查看完整过程</button>':'')
    +'<span style="flex:1"></span>'
    +'<button type="button" class="cf-btn cf-primary mini" data-act="close">关闭</button></div>';

}
function refreshDetailsActivity(){
  if(detailsNodeId===null||$('cf-modal').hidden)return;
  var box=$('cf-act-detail');if(!box)return;
  var n=byId(detailsNodeId);
  var pr=ACT.progress||{};
  var stats=nodeStats(detailsNodeId);
  var list=ACT.byNode[detailsNodeId]||[];
  var h='';
  h+='<div class="cf-mrow" style="margin-bottom:6px"><b class="cf-progress-num">'+(typeof pr.done==='number'?(pr.done+'/'+pr.total):'—')+'</b>'
    +(pr.percent!=null?('<span class="cf-progress-num">'+pr.percent+'%</span>'):'<span>无确定进度</span>')
    +(pr.elapsedMs?('<span>· 已用 '+esc(fmtMs(pr.elapsedMs))+'</span>'):'')
    +(stats.steps?('<span>· '+stats.steps+' 步</span>'):'')+'</div>';
  if(!list.length){
    h+='<div class="cf-sechint">'+(HOSTED?'宿主未提供实时过程':'独立模式没有执行过程')+'</div>';
    box.innerHTML=h;return;
  }
  var reasonings=list.filter(function(e){return e.kind==='reasoning'||e.kind==='text';});
  var steps=list.filter(function(e){return e.kind==='tool'||e.kind==='step';});
  if(reasonings.length){
    h+='<div class="cf-think" tabindex="0">';
    reasonings.forEach(function(e){h+=esc(e.text)+(e.truncated?'\n…（已截断）':'')+'\n\n';});
    h+='</div>';
  }else{
    h+='<div class="cf-think degraded">思考内容不可用，以下为执行步骤</div>';
  }
  if(steps.length){
    h+='<div class="cf-steps" style="margin-top:6px">';
    steps.slice(-40).forEach(function(e){
      var cls=e.status==='error'?' error':(e.status==='running'?' running':(e.status==='ok'?' ok':''));
      h+='<div class="cf-step'+cls+'"><span class="cf-stname" title="'+esc(e.text)+'">'+esc(e.text)+'</span>'
        +'<span class="cf-stst">'+esc((e.status==='ok'?'完成':e.status==='error'?'出错':e.status==='running'?'运行中':'')+(e.ms?(' · '+fmtMs(e.ms)):''))+'</span></div>';
    });
    h+='</div>';
  }
  box.innerHTML=h;
  var think=box.querySelector('.cf-think');
  if(think&&!think.classList.contains('degraded')){
    think.scrollTop=think.scrollHeight;
    /* 用户向上滚动时暂停跟随，出现“回到底部” */
    var follow=true;
    think.addEventListener('scroll',function(){
      follow=think.scrollTop+think.clientHeight>=think.scrollHeight-24;
      var btn=think.querySelector('.cf-think-bottom');
      if(btn)btn.remove();
      if(!follow){
        var b=document.createElement('button');
        b.type='button';b.className='cf-btn mini cf-think-bottom';b.textContent='回到底部';
        b.addEventListener('click',function(ev){ev.stopPropagation();think.scrollTop=think.scrollHeight;b.remove();follow=true;});
        think.appendChild(b);
      }
    });
  }
}

/* ---- 撤销运行 ---- */
var undoBtnTimer=null;
function refreshUndoButtonSoon(){
  if(undoBtnTimer)return;
  undoBtnTimer=setTimeout(function(){undoBtnTimer=null;updateUndoButton();},400);
}
function updateUndoButton(){
  /* v1.3.0：状态经 setActionState 广播——工具栏图标与「运行」菜单项由同一
     份动作状态驱动（menu-ui.js 定义，同 IIFE 函数提升）。 */
  if(!HOSTED){setActionState('toolbar:cf-tb-undo',{hidden:true});return;}
  /* 保险：若最后一次轮询落在回合结束事件之前，ACT.running 可能滞留为 true
     （撤销按钮会一直禁用）。图里已无运行节点且活动数据已停更 2.5s 以上时，
     补一次轮询向宿主收敛状态；pollActivity 自带 inflight 防抖。 */
  if(ACT.running&&!hasRunningNodes()&&ACT.lastAt&&Date.now()-ACT.lastAt>2500){
    pollActivity();
  }
  var disabled=ACT.running||hasRunningNodes();
  setActionState('toolbar:cf-tb-undo',{disabled:disabled,
    title:disabled?'运行中不能撤销':'撤销最近一次画布运行：恢复文件与节点状态（也可 Ctrl+Alt+Z）'});
}
function openUndoDialog(){
  if(!HOSTED){toast('独立模式没有撤销功能','err');return;}
  var name=G.project&&G.project.name;
  if(!name){toast('先打开一个项目','err');return;}
  apiGet('/codeflow/api/undo?project='+encodeURIComponent(name)).then(function(res){
    renderUndoDialog(res||{});
  }).catch(function(err){toast('读取运行历史失败：'+((err&&err.message)||err),'err');});
}
function undoStateLabel(run,isLatest){
  if(run.undoable)return isLatest?['可撤销','ok']:['可撤销（先撤销更新的）','dim'];
  if(run.status==='undone')return['已撤销','dim'];
  if(run.status==='undo-failed')return['撤销失败','warn'];
  if(run.status==='interrupted')return['部分可撤销','warn'];
  return['不可撤销','warn'];
}
function renderUndoDialog(res){
  var runs=res.runs||[];
  var h=dHead('undo-2','运行历史（撤销）')
    +'<div class="cf-dbody">'
    +'<div class="cf-hintbox">撤销会把项目文件恢复到该次运行之前，并恢复当时各节点的执行状态；'
    +'只能按时间倒序逐次撤销，当前状态会先自动备份到 <b>.undo/&lt;运行ID&gt;/current-*</b>。'
    +'项目根之外的写入（如 shell 写到别处）不在恢复范围内。</div>';
  if(res.warning)h+='<div class="cf-hintbox" style="color:#f87171">'+esc(res.warning)+'</div>';
  if(!runs.length)h+='<div class="cf-sechint">还没有可撤销的运行。</div>';
  else{
    h+='<div class="cf-undolist">';
    runs.forEach(function(run,i){
      var label=undoStateLabel(run,i===0);
      var act=run.action==='RUN_ALL'?'运行全部':('运行节点'+(run.nodeId?(' '+(((byId(run.nodeId)||{}).title)||run.nodeId)):''));
      /* v0.6.0：历史标注该次运行作用的视图（文件快照是项目级的，跨视图 LIFO） */
      var viewTag=run.view==='modules'?'模块图':'任务图';
      h+='<div class="cf-undorow"'+(i>0?' title="只能撤销最近一次未撤销的运行：请先撤销更新的运行"':'')+'><div class="cf-uinfo">'
        +'<span class="cf-uline1">'+esc(fmtWhen(run.startedAt))+' · '+esc(act)+' · '+esc(viewTag)+'</span>'
        +'<span class="cf-uline2">'+(run.fileCount||0)+' 个文件'+(run.partial?' · 部分文件未纳入快照':'')+'</span>'
        +'</div><span class="cf-ustate '+label[1]+'">'+esc(label[0])+'</span>'
        +((i===0&&run.undoable&&!ACT.running&&!hasRunningNodes())?'<button type="button" class="cf-btn mini" data-run="'+esc(run.runId)+'">撤销这次运行</button>':'')
        +'</div>';
    });
    h+='</div>';
  }
  h+='</div><div class="cf-dfoot"><button type="button" class="cf-btn cf-primary" data-act="close">关闭</button></div>';
  openModal(h);
  var d=$('cf-dialog');
  d.querySelector('[data-act="close"]').addEventListener('click',closeModal);
  d.querySelectorAll('[data-run]').forEach(function(btn){
    btn.addEventListener('click',function(){confirmUndo(btn.getAttribute('data-run'));});
  });
}
function confirmUndo(runId){
  apiPost('undo',{project:G.project&&G.project.name,runId:runId,dryRun:true}).then(function(dry){
    if(!dry||dry.ok!==true){toast((dry&&dry.error)||'无法撤销','err');return;}
    var f=dry.files||{};
    var added=(f.added||[]).length,modified=(f.modified||[]).length,deleted=(f.deleted||[]).length;
    var h=dHead('alert-triangle','确认撤销这次运行？')
      +'<div class="cf-dbody">'
      +'<div class="cf-kv"><b>恢复到</b><span>'+esc(fmtWhen(Date.now()))+'（该次运行开始前）</span></div>'
      +'<div class="cf-kv"><b>文件变化</b><span class="cf-progress-num">新增 '+added+' 个（将删除） · 修改 '+modified+' 个（将覆盖） · 删除 '+deleted+' 个（将恢复）</span></div>'
      +'<div class="cf-hintbox" style="margin-top:8px">当前状态会先自动备份到 <b>.undo/'+esc(runId)+'/current-*</b>；'
      +'运行后你对同一文件的手动修改也会被覆盖；已提交的交付卡片可能因文件回滚而失效。</div>'
      +'</div>'
      +'<div class="cf-dfoot"><button type="button" class="cf-btn" data-act="close">取消</button>'
      +'<button type="button" class="cf-btn cf-danger" data-act="confirm">撤销</button></div>';
    openModal(h);
    var d=$('cf-dialog');
    d.querySelector('[data-act="close"]').addEventListener('click',closeModal);
    d.querySelector('[data-act="confirm"]').addEventListener('click',function(){
      closeModal();
      apiPost('undo',{project:G.project&&G.project.name,runId:runId}).then(function(res){
        activityResetLocal();
        var backup=res.backupDir||'.undo';
        showBanner('已撤销这次运行：文件与节点状态已恢复，撤销前状态备份在 '+backup+'。');
        toast('撤销成功','ok');
        refreshUndoButtonSoon();
      }).catch(function(err){toast('撤销失败：'+((err&&err.message)||err),'err');});
    });
  }).catch(function(err){toast('撤销预检失败：'+((err&&err.message)||err),'err');});
}
window.addEventListener('keydown',function(e){
  if(e.ctrlKey&&e.altKey&&(e.key==='z'||e.key==='Z')){e.preventDefault();openUndoDialog();}
});

      +'；画布已重置，请重新编辑后保存。');

  }
  else if(BOOT.sessionNew){showBanner('已为「'+((G.project&&G.project.name)||'项目')+'」创建独立会话；画布中的运行只在该会话执行。');bannerShown=true;}
  else if(SESSION.warning){showBanner(SESSION.warning);bannerShown=true;}
  /* v1.0（需求 C）：一次性迁移汇总（moved/conflicts/failed 都要点名） */

/* ================= v1.1：功能分组（features.json） =================
 * 数据来源：GET/POST /codeflow/api/features（宿主读 <项目>/features.json；
 * 画布只走同源 HTTP，不读磁盘）。仅 think/build 两个分类启用分组：
 *   - 组行点击 = spotlightNodes 整组高亮（不关浮层）；成员行点击沿用 pickNavRow
 *     （关浮层 + focusNode，行为与改动前完全一致）；
 *   - 组行右键 = 重命名 / 合并到… / 解散 / 重新识别（前三个 POST /api/features
 *     后重拉，重新识别 = ?refresh=1）；
 *   - 识别不出 → 列表顶部横幅 + 「让 agent 识别」（唯一的模型路径，仅显式点击；
 *     请求中禁用防重复）。识别/拉取失败一律退化为扁平列表，绝不白屏。
 * 折叠状态只存内存（navPop.collapsed Set），默认展开第一组；未分类组固定最后、
 * 默认收起。搜索沿用 navPop.query，跨组过滤：组内 0 命中整组隐藏，组名命中保留。
 * 所有动态字符串一律 esc()/textContent，禁止拼接未转义 HTML。 */
var FEATURES={data:null,reqId:0,nodeTags:null,uncatIds:[]};
var SPOT={active:false,ids:null,label:'',box:null};

function featuresEnabledFor(cat){
  return HOSTED&&(cat==='think'||cat==='build');
}
function featuresProjectName(){
  return (G.project&&G.project.name)||null;
}
/* 打开浮层时拉取（每次打开都拉：轻量、且能吃到宿主刚写盘的结果） */
function fetchFeatures(force){
  var name=featuresProjectName();
  if(!name)return Promise.resolve(null);
  var rid=++FEATURES.reqId;
  return fetchT('/codeflow/api/features?project='+encodeURIComponent(name)+'&view='+CURVIEW+(force?'&refresh=1':''),{headers:{'accept':'application/json'},cache:'no-store'})
    .then(function(r){return r.ok?r.json():null;})
    .then(function(p){
      if(rid===FEATURES.reqId){
        FEATURES.data=(p&&p.ok)?p:null;
        buildNodeTags();
      }
      return FEATURES.data;
    })
    .catch(function(){
      if(rid===FEATURES.reqId){FEATURES.data=null;buildNodeTags();}
      return null;
    });
}
function buildNodeTags(){
  var tags=null;
  var data=FEATURES.data;
  if(data&&Array.isArray(data.features)){
    tags={};
    data.features.forEach(function(f){
      (f.nodes||[]).forEach(function(id){
        if(!tags[id])tags[id]=[];
        if(tags[id].indexOf(f.name)<0)tags[id].push(f.name);
      });
    });
  }
  FEATURES.nodeTags=tags;
}
/* 写操作 → POST /api/features → 重拉 + 刷新浮层/详情/高亮 */
function featureOpRequest(op,body,okMsg){
  var name=featuresProjectName();
  if(!name)return;
  apiPost('features',Object.assign({op:op,project:name,view:CURVIEW},body)).then(function(res){
    if(res&&res.ok){
      if(okMsg)toast(okMsg,'ok');
      if(SPOT.active)clearSpotlight();
      refreshFeatures(false);
      return;
    }
    toast((res&&res.error)||'操作失败','err');
  }).catch(function(err){
    toast('操作失败：'+((err&&err.message)||err),'err');
  });
}
function refreshFeatures(force){
  var name=featuresProjectName();
  if(!name)return Promise.resolve(null);
  return fetchFeatures(force===true).then(function(){
    if(navPop.open&&featuresEnabledFor(navPop.cat)){renderNavPop();positionNavPop();}
    if(force===true&&SPOT.active)clearSpotlight();
    if(detailsNodeId!==null&&!$('cf-modal').hidden)openDetails(detailsNodeId);
    return FEATURES.data;
  });
}

/* ---- 浮层：打开时重置分组状态，数据到达后按需重渲染 ---- */
var openNavPopFeaturesBase=openNavPop;
openNavPop=function(cat,anchorBtn){
  FEATURES.data=null;
  FEATURES.nodeTags=null;
  FEATURES.uncatIds=[];
  navPop.collapsed=new Set();
  navPop.uncategorizedOpen=false;
  navPop.grouped=false;
  openNavPopFeaturesBase(cat,anchorBtn);
  if(featuresEnabledFor(cat)&&featuresProjectName()){
    fetchFeatures(false).then(function(){
      if(navPop.open&&navPop.cat===cat){renderNavPop();positionNavPop();}
    });
  }
};
/* 渲染分派：非 think/build 走原实现；think/build 由 features 渲染器接管 */
var renderNavPopFeaturesBase=renderNavPop;
renderNavPop=function(){
  if(!navPop.open)return;
  if(!featuresEnabledFor(navPop.cat)){navPop.grouped=false;renderNavPopFeaturesBase();return;}
  renderFeaturesNavPop();
};
var setNavActiveIdFeaturesBase=setNavActiveId;
setNavActiveId=function(id){
  if(!navPop.grouped){setNavActiveIdFeaturesBase(id);return;}
  var list=$('cf-navlist');
  navPop.active=-1;
  navPop.items.forEach(function(it,i){if(it.n.id===id)navPop.active=i;});
  Array.prototype.forEach.call(list.querySelectorAll('[data-id]'),function(row){
    var on=row.getAttribute('data-id')===id;
    row.classList.toggle('active',on);
    if(row.classList.contains('cf-navrow'))row.setAttribute('aria-selected',on?'true':'false');
  });
  scrollNavPopActive();
};
var scrollNavPopActiveFeaturesBase=scrollNavPopActive;
scrollNavPopActive=function(){
  var list=$('cf-navlist');
  var active=list.querySelector('.active');
  if(active&&active.scrollIntoView)try{active.scrollIntoView({block:'nearest'});}catch(e){}
};
var pickNavRowFeaturesBase=pickNavRow;
pickNavRow=function(id){
  if(typeof id==='string'&&id.indexOf('@group:')===0){
    spotlightGroup(id.slice('@group:'.length));
    return;
  }
  pickNavRowFeaturesBase(id);
};

/* ---- 分组渲染 ---- */
/* 与 navPopItems 同一套命中逻辑（标题/次级说明），但不过滤、不排序，
   供分组模式做「组内命中 + 组名命中」判断 */
function featureItemsOf(){
  var q=navPop.query.trim().toLowerCase();
  return navPopSource().map(function(n){
    var t=typeOf(n);
    var sub='';
    if(n.type==='module'&&n.params&&n.params.path){
      var segs=String(n.params.path).split('\\').join('/').split('/');
      sub=segs.slice(Math.max(0,segs.length-3)).join('/');
    }else{
      var st=STC[n.status]||STC.pending;
      sub=st[0]+(n.result?(' · '+n.result):'');
    }
    var title=String(n.title||t.label);
    var hitTitle=!q||title.toLowerCase().indexOf(q)>=0;
    var hitPath=!q||!sub?hitTitle:(sub.toLowerCase().indexOf(q)>=0);
    return {n:n,title:title,sub:sub,hitTitle:hitTitle,hitPath:hitPath,hit:hitTitle||hitPath};
  });
}
function renderFeaturesNavPop(){
  var list=$('cf-navlist');
  var data=FEATURES.data;
  if(!data){navPop.grouped=false;renderNavPopFeaturesBase();return;}
  var feats=Array.isArray(data.features)?data.features:[];
  if(feats.length===0){
    navPop.grouped=false;
    renderFlatWithBanner(list);
    return;
  }
  renderGrouped(list,feats);
}
/* 识别不出（features: []）：横幅 + 原扁平列表 */
function renderFlatWithBanner(list){
  var items=navPopItems();
  navPop.items=items;
  if(navPop.active>=items.length)navPop.active=items.length>0?items.length-1:-1;
  list.innerHTML='';
  var banner=featuresBannerEl();
  if(banner)list.appendChild(banner);
  if(!items.length){
    if(!banner)list.innerHTML='<div class="cf-navempty">没有匹配的节点</div>';
    scrollNavPopActive();
    return;
  }
  list.insertAdjacentHTML('beforeend',items.map(function(it,i){return navRowHtml(it,i===navPop.active);}).join(''));
  bindNavRowEvents(list);
  scrollNavPopActive();
}
function featuresBannerEl(){
  if(!HOSTED)return null;
  var data=FEATURES.data;
  if(!data||!Array.isArray(data.features)||data.features.length>0)return null;
  var wrap=document.createElement('div');
  wrap.className='cf-fempty';
  var text=document.createElement('span');
  text.textContent='未识别到功能，可让 agent 识别一次';
  var btn=document.createElement('button');
  btn.type='button';
  btn.className='cf-btn mini cf-fempty-btn';
  btn.textContent='让 agent 识别';
  btn.addEventListener('click',function(){
    if(btn.disabled)return;
    var name=featuresProjectName();
    if(!name)return;
    btn.disabled=true;
    btn.textContent='请求中…';
    apiPost('features/agent',{project:name,view:CURVIEW}).then(function(res){
      if(res&&res.ok)toast('已请求识别，结果会出现在画布会话','ok');
      else toast((res&&res.error)||'请求失败','err');
    }).catch(function(err){
      toast('请求失败：'+((err&&err.message)||err),'err');
    }).then(function(){
      btn.disabled=false;
      btn.textContent='让 agent 识别';
    });
  });
  wrap.appendChild(text);
  wrap.appendChild(btn);
  return wrap;
}
function groupRowHtml(name,count,expanded,hint,low){
  return '<div class="cf-fgroup" role="option" data-id="'+esc('@group:'+name)+'" aria-selected="false" aria-expanded="'+(expanded?'true':'false')+'">'
    +'<span class="cf-farrow" data-farrow="1" role="button" aria-label="'+esc((expanded?'收起 ':'展开 ')+name)+'">'+(expanded?'▾':'▸')+'</span>'
    +'<span class="cf-navdot" style="background:'+typeColor(navPop.cat)+'"></span>'
    +'<span class="cf-fgroup-name">'+esc(name)+'</span>'
    +'<span class="cf-fgroup-count">· '+count+'</span>'
    +(low?'<span class="cf-fgroup-low">低置信</span>':'')
    +(hint||'')+'</div>';
}
function featureMemberRowHtml(it,active){
  var html=navRowHtml(it,active);
  var names=(FEATURES.nodeTags||{})[it.n.id];
  if(names&&names.length){
    var shown=names.slice(0,2);
    var label=shown.join('/')+(names.length>2?('+'+(names.length-2)):'');
    html=html.replace(/<\/div>$/,'<span class="cf-ftag" title="'+esc(names.join('、'))+'">'+esc(label)+'</span></div>');
  }
  return html;
}
function renderGrouped(list,feats){
  var q=navPop.query.trim().toLowerCase();
  var all=featureItemsOf();
  var byIdMap={};
  all.forEach(function(it){byIdMap[it.n.id]=it;});
  var claimed={};
  var groups=[];
  feats.forEach(function(f){
    var nodesAll=(f.nodes||[]).filter(function(id){return byIdMap[id];}).map(function(id){return byIdMap[id];});
    nodesAll.forEach(function(it){claimed[it.n.id]=1;});
    var members=q?(f.name&&String(f.name).toLowerCase().indexOf(q)>=0?nodesAll:nodesAll.filter(function(it){return it.hit;})):nodesAll;
    groups.push({f:f,membersAll:nodesAll,members:members,nameHit:!!(q&&String(f.name).toLowerCase().indexOf(q)>=0)});
  });
  /* 组过滤：有命中成员、组名命中、或（任务视图零命中且模块图有货 → 切换提示） */
  var viewGroups=groups.filter(function(g){
    if(g.members.length>0)return true;
    if(g.nameHit)return true;
    if(!q&&CURVIEW==='tasks'&&(g.f.count===0)&&(g.f.modulesCount||0)>0)return true;
    return false;
  });
  var rest=all.filter(function(it){return !claimed[it.n.id]&&it.hit;});
  var rows=[];
  var html='';
  viewGroups.forEach(function(g){
    var expanded=!navPop.collapsed.has(g.f.name);
    var hint=(CURVIEW==='tasks'&&g.membersAll.length===0&&(g.f.modulesCount||0)>0)
      ?'<span class="cf-fgroup-hint">在模块结构图有 '+g.f.modulesCount+' 个模块 · 切换视图</span>':'';
    html+=groupRowHtml(g.f.name,g.membersAll.length,expanded,hint,g.f.low===true);
    /* 组行也要有 .n.id 形状：基础键盘导航（↑/↓/Enter）按 items[i].n.id 寻址 */
    rows.push({kind:'group',id:'@group:'+g.f.name,n:{id:'@group:'+g.f.name},name:g.f.name});
    if(expanded)g.members.forEach(function(it){
      html+=featureMemberRowHtml(it,rows.length===navPop.active);
      rows.push({kind:'node',it:it});
    });
  });
  /* 未分类组：固定最后，默认收起 */
  if(rest.length>0){
    var restExpanded=navPop.uncategorizedOpen===true;
    html+=groupRowHtml('未分类',rest.length,restExpanded,'',false);
    rows.push({kind:'group',id:'@group:未分类',n:{id:'@group:未分类'},name:'未分类',uncategorized:true});
    if(restExpanded)rest.forEach(function(it){
      html+=featureMemberRowHtml(it,rows.length===navPop.active);
      rows.push({kind:'node',it:it});
    });
  }
  FEATURES.uncatIds=rest.map(function(it){return it.n.id;});
  navPop.grouped=true;
  if(rows.length===0){
    list.innerHTML='<div class="cf-navempty">没有匹配的节点</div>';
    navPop.items=[];
    return;
  }
  navPop.items=rows;
  if(navPop.active<0||navPop.active>=rows.length)navPop.active=0;
  list.innerHTML=html;
  var activeId=navPop.items[navPop.active]?navPop.items[navPop.active].id:null;
  Array.prototype.forEach.call(list.querySelectorAll('[data-id]'),function(row){
    var on=row.getAttribute('data-id')===activeId;
    row.classList.toggle('active',on);
    if(row.classList.contains('cf-navrow'))row.setAttribute('aria-selected',on?'true':'false');
  });
  bindFeatureRowEvents(list);
  scrollNavPopActive();
}
function bindFeatureRowEvents(list){
  Array.prototype.forEach.call(list.querySelectorAll('.cf-fgroup'),function(row){
    var name=row.getAttribute('data-id').slice('@group:'.length);
    row.addEventListener('click',function(e){
      if(e.target&&e.target.closest&&e.target.closest('.cf-farrow'))return;
      spotlightGroup(name);
    });
    var arrow=row.querySelector('.cf-farrow');
    if(arrow)arrow.addEventListener('click',function(e){
      e.stopPropagation();
      if(name==='未分类')navPop.uncategorizedOpen=!(navPop.uncategorizedOpen===true);
      else if(navPop.collapsed.has(name))navPop.collapsed.delete(name);
      else navPop.collapsed.add(name);
      renderNavPop();
      positionNavPop();
    });
    row.addEventListener('pointermove',function(){setNavActiveId(row.getAttribute('data-id'));});
    row.addEventListener('contextmenu',function(e){
      e.preventDefault();e.stopPropagation();
      var rr=ROOT.getBoundingClientRect();
      openGroupMenu(name,e.clientX-rr.left,e.clientY-rr.top);
    });
  });
  Array.prototype.forEach.call(list.querySelectorAll('.cf-navrow'),function(row){
    row.addEventListener('click',function(){pickNavRow(row.dataset.id);});
    row.addEventListener('pointermove',function(){setNavActiveId(row.dataset.id);});
  });
}
/* 组行右键：重命名 / 合并到…（子菜单列其它功能）/ 解散 / 重新识别 */
function openGroupMenu(name,x,y){
  if(name==='未分类'){
    openMenu([{label:'重新识别',icon:'rotate-cw',act:function(){toast('正在重新识别…');refreshFeatures(true);}}],x,y);
    return;
  }
  var others=[];
  var data=FEATURES.data;
  if(data&&Array.isArray(data.features)){
    data.features.forEach(function(f){
      if(f.name!==name)others.push({label:f.name,icon:'copy',act:function(){
        featureOpRequest('merge',{from:name,to:f.name},'已把「'+name+'」合并到「'+f.name+'」');
      }});
    });
  }
  var items=[
    {label:'重命名…',icon:'pencil',act:function(){
      openPrompt('重命名功能','功能名称',name,function(v){
        if(v&&v!==name)featureOpRequest('rename',{from:name,to:v},'已重命名为「'+v+'」');
      });
    }},
  ];
  if(others.length>0)items.push({label:'合并到…',icon:'copy',sub:others});
  else items.push({label:'合并到…（没有其它功能）',icon:'copy',act:function(){toast('没有其它功能可合并');}});
  items.push({label:'解散',icon:'trash-2',danger:true,act:function(){
    featureOpRequest('dissolve',{feature:name},'已解散「'+name+'」');
  }});
  items.push({sep:true});
  items.push({label:'重新识别',icon:'rotate-cw',act:function(){toast('正在重新识别…');refreshFeatures(true);}});
  openMenu(items,x,y);
}

/* ---- 整组高亮（spotlight）：不动 focusNode 的 1.8s 逻辑（不同 class、不同状态） ---- */
function spotBBox(){
  var minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9,any=false;
  G.nodes.forEach(function(n){
    if(!SPOT.ids||!SPOT.ids[n.id])return;
    var el=nodeEls[n.id];
    var w=el?el.offsetWidth:(typeOf(n).w||240),h=el?el.offsetHeight:130;
    minx=Math.min(minx,n.pos[0]);miny=Math.min(miny,n.pos[1]);
    maxx=Math.max(maxx,n.pos[0]+w);maxy=Math.max(maxy,n.pos[1]+h);
    any=true;
  });
  return any?{minx:minx,miny:miny,maxx:maxx,maxy:maxy}:null;
}
function applySpotClasses(){
  if(!SPOT.active)return;
  G.nodes.forEach(function(n){
    var el=nodeEls[n.id];
    if(el)el.classList.toggle('cf-spot',!!SPOT.ids[n.id]);
  });
}
function applySpotLinkClasses(){
  Array.prototype.forEach.call($('cf-links').querySelectorAll('.cf-linksvg'),function(svg){
    var on=SPOT.active&&SPOT.ids&&SPOT.ids[svg.getAttribute('data-from')]&&SPOT.ids[svg.getAttribute('data-to')];
    var vis=svg.querySelector('.cf-link');
    if(vis)vis.classList.toggle('cf-spot-link',!!on);
  });
}
function ensureSpotBox(){
  if(SPOT.box&&SPOT.box.isConnected)return SPOT.box;
  var box=document.createElement('div');
  box.className='cf-spotbox';
  var label=document.createElement('span');
  label.className='cf-spotbox-label';
  box.appendChild(label);
  $('cf-stage').appendChild(box);
  SPOT.box=box;
  return box;
}
function removeSpotBox(){
  if(SPOT.box&&SPOT.box.parentNode)SPOT.box.parentNode.removeChild(SPOT.box);
  SPOT.box=null;
}
/* 虚线框挂在 stage 上，坐标=节点包围盒+padding 换算到屏幕；随 pan/zoom 重算 */
function layoutSpotBox(){
  if(!SPOT.active){removeSpotBox();return;}
  var box=spotBBox();
  if(!box){removeSpotBox();return;}
  var pad=80;
  var sx=view.x+(box.minx-pad)*view.k;
  var sy=view.y+(box.miny-pad)*view.k;
  var sw=((box.maxx-box.minx)+pad*2)*view.k;
  var sh=((box.maxy-box.miny)+pad*2)*view.k;
  var el=ensureSpotBox();
  el.style.left=sx+'px';
  el.style.top=sy+'px';
  el.style.width=Math.max(24,sw)+'px';
  el.style.height=Math.max(24,sh)+'px';
  var label=el.querySelector('.cf-spotbox-label');
  if(label)label.textContent=SPOT.label;
}
function spotlightNodes(ids,label){
  clearSpotlight();
  var set={};
  (ids||[]).forEach(function(id){set[id]=1;});
  SPOT.active=true;
  SPOT.ids=set;
  SPOT.label=String(label||'');
  ROOT.classList.add('cf-spotlight');
  applySpotClasses();
  var box=spotBBox();
  if(box){
    /* 缩放到包围盒：padding 80，k clamp [0.4, 1.2]，复用 animateView */
    var pad=80;
    var bw=Math.max(60,(box.maxx-box.minx)+pad*2),bh=Math.max(60,(box.maxy-box.miny)+pad*2);
    var cx=(box.minx+box.maxx)/2,cy=(box.miny+box.maxy)/2;
    var r=stageRect();
    var k=Math.max(0.4,Math.min(1.2,Math.min((r.width-40)/bw,(r.height-40)/bh)));
    animateView(r.width/2-cx*k,r.height/2-cy*k,k,340);
  }
  layoutSpotBox();
}
function clearSpotlight(){
  if(!SPOT.active)return;
  SPOT.active=false;
  SPOT.ids=null;
  SPOT.label='';
  ROOT.classList.remove('cf-spotlight');
  G.nodes.forEach(function(n){
    var el=nodeEls[n.id];
    if(el)el.classList.remove('cf-spot');
  });
  Array.prototype.forEach.call($('cf-links').querySelectorAll('.cf-linksvg'),function(svg){
    var vis=svg.querySelector('.cf-link');
    if(vis)vis.classList.remove('cf-spot-link');
  });
  removeSpotBox();
}
/* 组点击 → 整组高亮；任务视图零命中且模块图有货 → 切换后自动高亮 */
function spotlightGroup(name){
  if(name==='未分类'){
    var uncat=(FEATURES.uncatIds||[]).filter(function(id){return byId(id);});
    if(uncat.length>0)spotlightNodes(uncat,name);
    else toast('未分类组没有可高亮的节点');
    return;
  }
  var data=FEATURES.data;
  if(!data)return;
  var f=null;
  (data.features||[]).forEach(function(entry){if(entry.name===name)f=entry;});
  if(!f)return;
  var ids=(f.nodes||[]).filter(function(id){return byId(id);});
  if(ids.length===0&&CURVIEW==='tasks'&&(f.modulesCount||0)>0){switchAndSpot(name);return;}
  if(ids.length===0){toast('「'+name+'」在当前视图没有可高亮的节点');return;}
  spotlightNodes(ids,name);
}
function switchAndSpot(name){
  if(!HOSTED)return;
  toast('「'+name+'」在任务视图未命中：正在切换到模块结构图…');
  var after=function(){
    fetchFeatures(false).then(function(){
      var data=FEATURES.data;
      if(!data)return;
      var f=null;
      (data.features||[]).forEach(function(entry){if(entry.name===name)f=entry;});
      if(!f)return;
      var ids=(f.nodes||[]).filter(function(id){return byId(id);});
      if(ids.length>0)spotlightNodes(ids,name);
    });
  };
  try{
    var p=doSwitchView('modules');
    if(p&&typeof p.then==='function')p.then(after,after);
    else after();
  }catch(e){after();}
}
/* 清除时机：Esc / 画布空白按下 / 切换视图 / 删除节点 / 重新分组（重新点击即替换） */
window.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&SPOT.active)clearSpotlight();
});
stage.addEventListener('pointerdown',function(e){
  if(!SPOT.active||e.button===2)return;
  var t=e.target;
  if(t&&t.closest){
    if(t.closest('.cf-node')||t.closest('.cf-link-hit')||t.closest('.cf-mini')||t.closest('.cf-zoomer')
      ||t.closest('.cf-menu')||t.closest('.cf-modal')||t.closest('.cf-banner')||t.closest('.cf-navpop')
      ||t.closest('.cf-nav')||t.closest('.cf-monitor')||t.closest('.cf-spotbox'))return;
  }
  clearSpotlight();
},true);
var switchViewFeaturesBase=switchView;
switchView=function(next){
  if(SPOT.active)clearSpotlight();
  return switchViewFeaturesBase(next);

/* ================= v1.2：模块耦合分析（屎山程度） =================
 * 全部走宿主 HTTP（POST/GET /codeflow/api/coupling），零 agent、零 token。
 *   - 节点徽章：文件级 module 节点头部状态徽章左侧的小胶囊 + 右缘 3px 色条；
 *   - 左上角卡片：整体「屎山程度 · 低|中|高」+ 统计行 + 部分/过期角标；
 *   - 入口：节点右键「分析耦合」/ 空白右键「分析全部耦合」/ 工具栏按钮；
 *   - 任务视图：只显示卡片（meta.coupling 镜像）并标注「来自模块结构图」，
 *     绝不给任务节点打标签；
 *   - 过期：GET /api/coupling 的 stale 只做渲染叠加（灰化/虚线），不写图。
 * 所有动态文本一律 esc()/textContent，禁止拼接未转义 HTML。 */
var COUPLING={stale:null,staleKey:'',staleProject:'',running:false,card:null};

function couplingLevelText(level){return level==='high'?'高':level==='medium'?'中':'低';}
function couplingLevelColor(level){return level==='high'?'#ef4444':level==='medium'?'#eab308':'#22c55e';}
/* 与宿主 lib/coupling.js 的 isFileModuleNode 同一判定：type=module 且 symbol 为空 */
function canAnalyzeCouplingNode(n){
  return !!(n&&n.type==='module'&&n.params&&typeof n.params.path==='string'&&n.params.path.length>0
    &&(n.params.symbol===undefined||n.params.symbol===null||n.params.symbol===''));
}
function couplingProjectName(){return (G.project&&G.project.name)||null;}
function modulesAvailable(){
  return !!(HOSTED&&VIEWMETA&&VIEWMETA.modules&&VIEWMETA.modules.available);
}
function couplingMetaOf(){var m=G.meta&&G.meta.coupling;return (m&&m.overall)?m:null;}

/* ---- 强制刷新：宿主刚写完图、rev 与本地相同，常规采纳会被 rev 门槛挡住。
   仅在同步代码里短暂下调 syncRev（不落任何异步间隙），绝不手动改 G 绕过 rev。 */
var adoptServerStateCouplingBase=adoptServerState;
adoptServerState=function(payload,force){
  if(force===true&&payload&&typeof payload.rev==='number'&&payload.view===CURVIEW){
    var saved=syncRev;
    syncRev=payload.rev-1;
    var changed=false;
    try{changed=adoptServerStateCouplingBase(payload);}finally{if(!changed)syncRev=saved;}
    if(changed)refreshCouplingStale(false);
    return changed;
  }
  return adoptServerStateCouplingBase(payload);
};
var refreshLatestSoonCouplingBase=refreshLatestSoon;
refreshLatestSoon=function(force){
  if(force!==true){refreshLatestSoonCouplingBase();return;}
  var name=couplingProjectName();
  if(!name)return;
  var q='?project='+encodeURIComponent(name)+'&view='+CURVIEW;
  fetchT('/codeflow/api/state'+q,{headers:{'accept':'application/json'},cache:'no-store'})
    .then(function(r){return r.ok?r.json():null;})
    .then(function(p){if(p)adoptServerState(p,true);})
    .catch(function(){});
};

/* ---- 分析入口（节点右键 / 空白右键 / 工具栏共用） ----
   入队写队列与 pending autosave 串行（避免旧图覆盖耦合结果），但**不走
   queueWrite 的 syncRev 更新**：coupling 响应的 rev 属于 modules 视图，任务
   视图下点击若照抄会让下一次任务图 autosave 携带错误 expectedRev 撞 409。
   正确的 syncRev 由随后的 refreshLatestSoon(true) 按当前视图的拉取结果回填。 */
function queueWriteNoRev(kind,buildBody){
  var run=writeChain.then(function(){return apiPost(kind,buildBody());});
  writeChain=run.then(function(){},function(){});
  return run;
}
function runCouplingAnalysis(nodeId){
  if(!HOSTED){toast('耦合分析需要宿主环境','err');return;}
  var name=couplingProjectName();
  if(!name){toast('先打开一个项目','err');return;}
  if(!modulesAvailable()){toast('当前项目没有模块结构图，请先导入项目','err');return;}
  if(COUPLING.running){toast('耦合分析正在进行中，请稍候…');return;}
  COUPLING.running=true;
  updateCouplingButton();
  toast(nodeId?('正在分析「'+(((byId(nodeId)||{}).title)||nodeId)+'」的耦合…'):'正在分析全部模块的耦合…');
  queueWriteNoRev('coupling',function(){return {project:name,nodeId:nodeId||null};})
    .then(function(res){
      COUPLING.running=false;
      updateCouplingButton();
      refreshLatestSoon(true);
      /* v1.2.2 修复：这里此前调用了一个不存在的函数名（真实函数是下面的
         refreshCouplingStale——把前缀误写成了 fetch），分析成功后的刷新链
         在 ReferenceError 上断掉，用户看到「耦合分析失败：… is not defined」。
         宿主侧其实已写图成功，只有客户端刷新断了。tests/buttons.mjs 的
         undefined-symbol 检查会拦住这类拼写错误。 */
      refreshCouplingStale(true);
      renderCouplingCard();
      if(res&&res.warning)toast(res.warning,'err');
      if(res&&res.overall)toast('耦合分析完成：屎山程度 '+couplingLevelText(res.overall.level)+'（'+((res.durationMs==null)?'<1':res.durationMs)+'ms）','ok');
    })
    .catch(function(err){
      COUPLING.running=false;
      updateCouplingButton();
      if(err&&err.status===409)syncConflict(err);
      else toast('耦合分析失败：'+((err&&err.message)||err),'err');
    });
}

/* ---- 过期信息（GET /api/coupling：mtime 探测在宿主侧，10s 缓存） ---- */
function refreshCouplingStale(force){
  if(!HOSTED)return;
  var name=couplingProjectName();
  if(!name)return;
  var meta=couplingMetaOf();
  var key=(meta&&meta.at)?String(meta.at):'';
  if(force!==true&&COUPLING.stale&&COUPLING.staleKey===key&&COUPLING.staleProject===name)return;
  apiGet('/codeflow/api/coupling?project='+encodeURIComponent(name)+'&view=modules')
    .then(function(p){
      if(!p||p.ok===false)return;
      COUPLING.stale=p.stale||{overall:false,nodes:{}};
      COUPLING.staleKey=key;
      COUPLING.staleProject=name;
      renderCouplingCard();
      applyCouplingMarks();
    })
    .catch(function(){});
}

/* ---- 节点徽章 + 右缘色条（只增删 class/子元素，不为高亮整图重渲染） ---- */
function applyCouplingMarks(){
  var meta=couplingMetaOf();
  var stale=(COUPLING.stale&&COUPLING.stale.nodes)||{};
  for(var i=0;i<G.nodes.length;i++){
    var n=G.nodes[i];
    var el=nodeEls[n.id];
    if(!el)continue;
    var edge=el.querySelector('.cf-coupling-edge');
    var head=el.querySelector('.cf-node-head');
    var badge=head?head.querySelector('.cf-coupling-badge'):null;
    var usable=CURVIEW==='modules'&&canAnalyzeCouplingNode(n)&&n.coupling&&n.coupling.level;
    if(!usable){
      if(edge&&edge.parentNode)edge.parentNode.removeChild(edge);
      if(badge&&badge.parentNode)badge.parentNode.removeChild(badge);
      el.classList.remove('cf-coupling-stale');
      continue;
    }
    var level=n.coupling.level==='high'?'high':n.coupling.level==='medium'?'medium':'low';
    var isStale=stale[n.id]===true;
    el.classList.toggle('cf-coupling-stale',isStale);
    if(!edge){
      edge=document.createElement('div');
      edge.className='cf-coupling-edge';
      el.appendChild(edge);
    }
    edge.setAttribute('data-level',level);
    edge.classList.toggle('stale',isStale);
    if(head&&!badge){
      badge=document.createElement('span');
      badge.className='cf-coupling-badge';
      var statusBadge=head.querySelector('.cf-badge');
      if(statusBadge)head.insertBefore(badge,statusBadge);
      else head.appendChild(badge);
    }
    if(badge){
      badge.setAttribute('data-level',level);
      badge.classList.toggle('stale',isStale);
      badge.textContent='耦合 · '+couplingLevelText(level);
    }
  }
}

/* ---- 左上角卡片 ---- */
function ensureCouplingCard(){
  if(COUPLING.card&&COUPLING.card.isConnected)return COUPLING.card;
  var card=document.createElement('div');
  card.className='cf-coupling-card';
  card.id='cf-coupling-card';
  card.hidden=true;
  card.innerHTML='<div class="cf-coupling-line1"><span class="cf-coupling-dot"></span>'
    +'<span class="cf-coupling-title"></span><span class="cf-coupling-extra"></span></div>'
    +'<div class="cf-coupling-line2"></div>';
  card.addEventListener('click',openCouplingDetails);
  $('cf-stage').appendChild(card);
  COUPLING.card=card;
  return card;
}
function renderCouplingCard(){
  var card=ensureCouplingCard();
  var meta=couplingMetaOf();
  if(!meta){
    card.hidden=true;
    return;
  }
  var overall=meta.overall;
  var level=overall.level==='high'?'high':overall.level==='medium'?'medium':'low';
  var staleOverall=COUPLING.stale&&COUPLING.stale.overall===true;
  card.hidden=false;
  card.classList.toggle('stale',staleOverall===true);
  card.querySelector('.cf-coupling-dot').style.background=couplingLevelColor(level);
  card.querySelector('.cf-coupling-title').textContent='屎山程度 · '+couplingLevelText(level);
  var extras=[];
  if(staleOverall===true)extras.push('可能过期');
  if(overall.partial===true)extras.push('已分析 '+overall.analyzed+'/'+overall.modules);
  card.querySelector('.cf-coupling-extra').textContent=extras.length>0?('· '+extras.join(' · ')):'';
  var parts=['模块 '+overall.modules,'环 '+overall.cycles];
  /* 平均分只在模块视图能逐节点取到；任务视图显示「来自模块结构图」 */
  var restricted=0,analyzedNodes=0;
  if(CURVIEW==='modules'){
    var sum=0,count=0;
    for(var i=0;i<G.nodes.length;i++){
      var n=G.nodes[i];
      if(!canAnalyzeCouplingNode(n)||!n.coupling)continue;
      analyzedNodes+=1;
      if(n.coupling.metrics&&n.coupling.metrics.parsed===false)restricted+=1;
      sum+=n.coupling.score;count+=1;
    }
    if(count>0)parts=['模块 '+overall.modules,'平均 '+Math.round(sum/count),'环 '+overall.cycles];
    if(analyzedNodes>0&&restricted*3>=analyzedNodes*2)parts.push('多数文件解析受限');
  }else{
    parts.push('来自模块结构图');
  }
  card.querySelector('.cf-coupling-line2').textContent=parts.join(' · ');
  /* 入口启用状态由 updateCouplingButton() 经 setActionState 统一维护。 */
}

/* ---- 耦合分析入口状态（v1.3.0 起为「运行」菜单项；工具栏独立按钮已并入菜单） ---- */

/* ---- 详情弹窗：整体结论 + 模块表格（分数降序）+ 根目录/时间/受限数 ---- */
function openCouplingDetails(){
  var meta=couplingMetaOf();
  if(!meta){toast('还没有耦合分析结果，请先「分析全部耦合」','err');return;}
  var overall=meta.overall;
  var stale=(COUPLING.stale&&COUPLING.stale.nodes)||{};
  var rows=[];
  var restricted=0;
  if(CURVIEW==='modules'){
    for(var i=0;i<G.nodes.length;i++){
      var n=G.nodes[i];
      if(!canAnalyzeCouplingNode(n)||!n.coupling)continue;
      var m=n.coupling.metrics||{};
      if(m.parsed===false)restricted+=1;
      rows.push({id:n.id,title:n.title||n.id,level:n.coupling.level,score:n.coupling.score,
        fanIn:m.fanIn,fanOut:m.fanOut,scc:m.sccSize,refs:m.refs,symbols:m.symbols,parsed:m.parsed!==false});
    }
    rows.sort(function(a,b){return b.score-a.score||String(a.id).localeCompare(String(b.id));});
  }
  var h=dHead('activity','耦合分析 · 屎山程度 '+couplingLevelText(overall.level))
    +'<div class="cf-dbody">'
    +'<div class="cf-kv"><b>整体</b><span style="color:'+couplingLevelColor(overall.level)+'">'

    +'<div class="cf-kv"><b>规模</b><span>模块 '+overall.modules+' · 已分析 '+overall.analyzed
    +(overall.partial===true?'（部分结果）':'')+' · 环 '+overall.cycles+'</span></div>'
    +(CURVIEW!=='modules'?'<div class="cf-hintbox">以下逐模块明细来自模块结构图，请切换到模块结构图查看。</div>':'');
  if(CURVIEW==='modules'&&rows.length>0){
    h+='<div class="cf-sec"><div class="cf-sec-title">模块明细（按分数降序）</div>'

      +'<th>扇入 Ca</th><th>扇出 Ce</th><th>环</th><th>内部引用/符号</th></tr></thead><tbody>';
    rows.forEach(function(r){
      h+='<tr><td>'+esc(r.title)+'</td>'
        +'<td><span class="cf-coupling-level" data-level="'+r.level+'">'+esc(couplingLevelText(r.level))+'</span></td>'
        +'<td>'+r.score+'</td><td class="dim">'+r.fanIn+'</td><td class="dim">'+r.fanOut+'</td>'
        +'<td class="dim">'+r.scc+'</td><td class="dim">'+r.refs+' / '+r.symbols+(r.parsed?'':' · 解析受限')+'</td></tr>';
    });
    h+='</tbody></table></div>';
  }else if(CURVIEW==='modules'){
    h+='<div class="cf-sechint">模块图里还没有任何分析结果。</div>';
  }
  h+='<div class="cf-sec"><div class="cf-sechint">'
    +'根目录：'+esc(meta.root||'—')+'<br>分析时间：'+esc(meta.at||'—')
    +(restricted>0?('<br>解析受限的文件：'+restricted+' 个（按行数/体积给弱结论）'):'')
    +((COUPLING.stale&&COUPLING.stale.overall===true)?'<br><span style="color:#f87171">结果可能已过期：源文件在分析后被修改过，建议重新分析。</span>':'')
    +'</div></div>';
  h+='</div>'
    +'<div class="cf-dfoot" style="flex-wrap:wrap">'
    +(modulesAvailable()?'<button type="button" class="cf-btn mini" data-act="rerun">重新分析</button>':'')
    +'<span style="flex:1"></span>'
    +'<button type="button" class="cf-btn cf-primary mini" data-act="close">关闭</button></div>';
  openModal(h);
  var d=$('cf-dialog');
  d.querySelector('[data-act="close"]').addEventListener('click',closeModal);
  var rerun=d.querySelector('[data-act="rerun"]');
  if(rerun)rerun.addEventListener('click',function(){closeModal();runCouplingAnalysis(null);});
}

/* ================= v1.2：拖拽导入（文件夹 / 压缩包） =================
 * 上传通道是主路径（iframe 里拿不到拖入项的真实路径）：webkitGetAsEntry 递归
 * 收文件 → 本地预检（数量/大小，不合法直接 toast）→ 确认框 → begin/file/finalize。
 * 真实路径通道只在宿主暴露 getPathForFile 时生效（薄分支，有则用）。
 * 独立模式（!HOSTED）下拖拽禁用，drop 时 toast 提示。所有动态文本一律 esc()。 */
var DROP={overlay:null,depth:0,busy:false,cancelled:false,token:null};

function dropArchiveKind(name){
  return /\.(zip|tar|tar\.gz|tgz|7z|rar)$/i.test(String(name||''))?'archive':null;
}
function fmtBytes(n){
  if(typeof n!=='number'||!(n>=0))return '0 B';
  if(n<1024)return n+' B';
  if(n<1024*1024)return (n/1024).toFixed(1)+' KB';
  return (n/1024/1024).toFixed(1)+' MB';
}
/* 5.2 来源探测：File.path 已从 Electron 移除，逐个桥接探测，全失败返回 '' */
function pathOfDropped(file){
  try{if(file&&typeof file.path==='string'&&file.path)return file.path;}catch(e){}
  var hosts=[window.__DSH_ELECTRON__,window.dsh,window.electron,window.webUtils];
  for(var i=0;i<hosts.length;i++){
    try{
      var host=hosts[i];
      if(host&&typeof host.getPathForFile==='function'){
        var p=host.getPathForFile(file);
        if(typeof p==='string'&&p)return p;
      }
    }catch(e){}
  }
  return '';
}

/* ---- 拖拽事件：dragenter 计数防抖，overlay pointer-events:none 不拦截 ---- */
function ensureDropOverlay(){
  if(DROP.overlay&&DROP.overlay.isConnected)return DROP.overlay;
  var el=document.createElement('div');
  el.className='cf-drop-overlay';
  el.textContent='松开导入项目（文件夹 / zip / tar / tar.gz / 7z / rar）';
  ROOT.appendChild(el);
  DROP.overlay=el;
  return el;
}
function showDropOverlay(show){
  var el=show?ensureDropOverlay():DROP.overlay;
  if(el)el.hidden=!show;
}
window.addEventListener('drop',function(e){
  if(e&&e.preventDefault)e.preventDefault();
});
function initDropExtras(){
  ROOT.addEventListener('dragenter',function(e){
    if(e&&e.preventDefault)e.preventDefault();
    DROP.depth+=1;
    showDropOverlay(true);
  });
  ROOT.addEventListener('dragover',function(e){
    if(e&&e.preventDefault)e.preventDefault();
    if(e.dataTransfer)e.dataTransfer.dropEffect='copy';
    showDropOverlay(true);
  });
  ROOT.addEventListener('dragleave',function(e){
    DROP.depth=Math.max(0,DROP.depth-1);
    if(DROP.depth===0)showDropOverlay(false);
  });
  ROOT.addEventListener('drop',function(e){
    if(e&&e.preventDefault)e.preventDefault();
    DROP.depth=0;
    showDropOverlay(false);
    if(e&&e.stopPropagation)e.stopPropagation();
    onDropImport(e);
  });
  window.addEventListener('keydown',function(e){
    if(e.key==='Escape'&&DROP.overlay&&!DROP.overlay.hidden){showDropOverlay(false);DROP.depth=0;}
  });
}

/* ---- drop 分派：只处理第一个条目，其余提示忽略 ---- */
function onDropImport(e){
  if(DROP.busy){toast('正在导入上一个条目，请先等它完成','err');return;}
  var items=(e.dataTransfer&&e.dataTransfer.items)||[];
  var extra=items.length>1?('已忽略其余 '+(items.length-1)+' 个条目'):'';
  if(!items.length){
    toast('请拖入文件夹或压缩包（zip / tar / tar.gz / 7z / rar）','err');
    return;
  }
  var item=items[0];
  var entry=null;
  try{entry=(typeof item.webkitGetAsEntry==='function')?item.webkitGetAsEntry():null;}catch(err){entry=null;}
  if(!HOSTED){
    toast('拖拽导入需要宿主环境','err');
    return;
  }
  if(entry&&entry.isDirectory){
    startDropDirectory(entry,extra);
    return;
  }
  var file=null;
  try{file=(typeof item.getAsFile==='function')?item.getAsFile():null;}catch(err){file=null;}
  if(file&&dropArchiveKind(file.name)){
    startDropArchiveFile(file,extra);
    return;
  }
  if(entry&&entry.isFile){
    toast('请拖入文件夹或压缩包（zip / tar / tar.gz / 7z / rar）'+(extra?('；'+extra):''),'err');
    return;
  }
  toast('请拖入文件夹或压缩包（zip / tar / tar.gz / 7z / rar）','err');
}

/* ---- 目录条目递归（webkitGetAsEntry；空目录跳过，路径 / 分隔） ---- */
function walkDropEntry(entry,prefix,out,state){
  return new Promise(function(resolve){
    if(!entry)return resolve();
    if(entry.isFile){
      entry.file(function(file){
        if(DROP.cancelled)return resolve();
        out.push({rel:prefix+entry.name,file:file});
        state.bytes+=file.size||0;
        resolve();
      },function(){resolve();});
      return;
    }
    if(!entry.isDirectory)return resolve();
    var reader;
    try{reader=entry.createReader();}catch(err){return resolve();}
    var readBatch=function(){
      try{
        reader.readEntries(function(batch){
          if(!batch.length)return resolve();
          var chain=Promise.resolve();
          batch.forEach(function(child){
            chain=chain.then(function(){return walkDropEntry(child,prefix+entry.name+'/',out,state);});
          });
          chain.then(readBatch,function(){resolve();});
        },function(){resolve();});
      }catch(err){resolve();}
    };
    readBatch();
  });
}

/* ---- 目录流：预检 → 确认 → 上传 → finalize ---- */
function startDropDirectory(entry,extra){
  if(!entry)return;
  toast('正在统计文件夹内容…');
  var out=[],state={bytes:0};
  DROP.cancelled=false;
  walkDropEntry(entry,'',out,state).then(function(){
    if(DROP.cancelled)return;
    if(out.length===0){toast('该文件夹是空的，没有可导入的文件','err');return;}
    if(out.length>1000){toast('文件数超过 1000，已拒绝导入','err');return;}
    if(state.bytes>2048*1024*1024){toast('解压后超过 2048 MB，已拒绝导入','err');return;}
    if(extra)toast(extra);
    openDropConfirm({
      kind:'dir',name:entry.name,files:out.length,bytes:state.bytes,
      upload:function(opts){uploadDirectory(out,state,opts);},
    });
  });
}

/* ---- 压缩包流（单文件）：确认 → 上传本体 → finalize ---- */
function startDropArchiveFile(file,extra){
  if(file.size>2048*1024*1024){toast('压缩包超过 2048 MB，已拒绝导入','err');return;}
  if(extra)toast(extra);
  DROP.cancelled=false;
  openDropConfirm({
    kind:'archive',name:file.name,files:null,bytes:file.size,
    upload:function(opts){uploadArchive(file,opts);},
  });
}

/* ---- 进度弹窗：阶段文案 + 进度条 + 取消（仅上传阶段可取消） ---- */

function dropStage(stage,detail,percent){
  if($('cf-modal').hidden)return;
  var stageEl=$('cf-drop-stage');
  var barEl=$('cf-drop-bar');
  var detailEl=$('cf-drop-detail');
  if(stageEl)stageEl.textContent=stage;
  if(detailEl)detailEl.textContent=detail||'';
  if(barEl)barEl.style.width=(percent==null?0:Math.max(0,Math.min(100,percent)))+'%';
  var cancel=$('cf-dialog').querySelector('[data-act="cancel"]');
  if(cancel&&stage==='正在分析…')cancel.disabled=true;
}
function dropAbort(token){
  apiPost('drop/abort',{token:token}).catch(function(){});
}

/* ---- 上传通道：begin → 逐文件 POST（octet-stream）→ finalize ---- */
function uploadDirectory(out,state,opts){
  if(!HOSTED){toast('拖拽导入需要宿主环境','err');return;}
  DROP.busy=true;
  DROP.token=null;
  openDropProgress();
  dropStage('正在准备…','共 '+out.length+' 个文件 · '+fmtBytes(state.bytes));
  apiPost('drop/begin',{kind:'dir',name:opts.name,files:out.length,bytes:state.bytes})
    .then(function(res){
      if(!res||!res.token)throw new Error((res&&res.error)||'无法创建上传会话');
      DROP.token=res.token;
      var sent=0,sentBytes=0;
      var chain=Promise.resolve();
      out.forEach(function(entry){
        chain=chain.then(function(){
          if(DROP.cancelled)throw Object.assign(new Error('已取消'),{cancelled:true});
          dropStage('正在上传 '+sent+'/'+out.length+' · '+fmtBytes(sentBytes)+' / '+fmtBytes(state.bytes),
            entry.rel,out.length>0?(sent/out.length*100):0);
          return fetchT('/codeflow/api/drop/file?token='+encodeURIComponent(res.token)
            +'&path='+encodeURIComponent(entry.rel),
            {method:'POST',headers:{'content-type':'application/octet-stream'},cache:'no-store',body:entry.file},120000)
            .then(function(r){return parseResp(r);})
            .then(function(){
              sent+=1;
              sentBytes+=entry.file.size||0;
            });
        });
      });
      return chain.then(function(){
        if(DROP.cancelled)throw Object.assign(new Error('已取消'),{cancelled:true});
          dropStage('正在分析…','正在生成任务流水线与模块结构图（宿主本地执行）');
          return apiPost('drop/finalize',{token:res.token,kind:'dir',projectName:opts.name,
            project:(G.project&&G.project.name)||undefined,
            depth:opts.depth,fromComments:opts.fromComments,addTests:opts.addTests});
      });
    })
    .then(function(res){finishDropImport(res,opts,'folder');})
    .catch(function(err){
      var staleToken=DROP.token;
      DROP.busy=false;
      DROP.token=null;
      if($('cf-modal')&&!$('cf-modal').hidden)closeModal();
      if(err&&err.cancelled)return;
      if(err&&err.status===409&&err.data&&err.data.code==='conflict'){
        openDropConflict(err.data,function(decide){
          if(staleToken)dropAbort(staleToken);
          if(decide.action==='retry')uploadDirectory(out,state,Object.assign({},opts,decide.body));
        });
        return;
      }
      if(staleToken)dropAbort(staleToken);
      toast('导入失败：'+((err&&err.message)||err),'err');
    });
}
function uploadArchive(file,opts){
  if(!HOSTED){toast('拖拽导入需要宿主环境','err');return;}
  DROP.busy=true;
  DROP.token=null;
  openDropProgress();
  dropStage('正在准备…',file.name+' · '+fmtBytes(file.size));
  apiPost('drop/begin',{kind:'archive',name:file.name,files:1,bytes:file.size})
    .then(function(res){
      if(!res||!res.token)throw new Error((res&&res.error)||'无法创建上传会话');
      DROP.token=res.token;
      dropStage('正在上传 0/1 · 0 B / '+fmtBytes(file.size),file.name,0);
      return fetchT('/codeflow/api/drop/file?token='+encodeURIComponent(res.token)
        +'&path='+encodeURIComponent(file.name),
        {method:'POST',headers:{'content-type':'application/octet-stream'},cache:'no-store',body:file},300000)
        .then(function(r){return parseResp(r);})
        .then(function(){
          if(DROP.cancelled)throw Object.assign(new Error('已取消'),{cancelled:true});
          dropStage('正在解压…','宿主正在解压 '+file.name+'（zip/tar 本地解析；7z/rar 用系统工具）');
          return apiPost('drop/finalize',{token:res.token,kind:'archive',projectName:opts.name,
            project:(G.project&&G.project.name)||undefined,
            depth:opts.depth,fromComments:opts.fromComments,addTests:opts.addTests});
        });
    })
    .then(function(res){finishDropImport(res,opts,'archive');})
    .catch(function(err){
      var staleToken=DROP.token;
      DROP.busy=false;
      DROP.token=null;
      if($('cf-modal')&&!$('cf-modal').hidden)closeModal();
      if(err&&err.cancelled)return;
      if(err&&err.status===409&&err.data&&err.data.code==='conflict'){
        openDropConflict(err.data,function(decide){
          if(staleToken)dropAbort(staleToken);
          if(decide.action==='retry')uploadArchive(file,Object.assign({},opts,decide.body));
        });
        return;
      }
      if(staleToken)dropAbort(staleToken);
      toast('导入失败：'+((err&&err.message)||err),'err');
    });
}

/* ---- 409 冲突：覆盖 / 改名 / 取消 ---- */
function openDropConflict(conflict,retry){
  var what=conflict.target==='dir'?('CodeFlow/imports/ 下已存在同名目录'):('已存在同名项目');
  var h=dHead('alert-triangle','项目名冲突')
    +'<div class="cf-dbody">'
    +'<div class="cf-hintbox">'+esc(what)+'：<b>'+esc(conflict.current||'')+'</b></div>'
    +'<div class="cf-sechint">覆盖会先备份旧图文件（.bak-时间戳）再重新导入；改名会自动加 -2/-3 后缀。</div>'
    +'</div>'
    +'<div class="cf-dfoot">'
    +'<button type="button" class="cf-btn" data-act="cancel">取消</button>'
    +'<span style="flex:1"></span>'
    +'<button type="button" class="cf-btn" data-act="rename">改名</button>'
    +'<button type="button" class="cf-btn cf-danger" data-act="overwrite">覆盖</button>'
    +'</div>';
  openModal(h);
  var d=$('cf-dialog');
  d.querySelector('[data-act="cancel"]').addEventListener('click',function(){closeModal();retry({action:'cancel'});});
  d.querySelector('[data-act="rename"]').addEventListener('click',function(){closeModal();retry({action:'retry',body:{rename:true}});});
  d.querySelector('[data-act="overwrite"]').addEventListener('click',function(){closeModal();retry({action:'retry',body:{overwrite:true}});});
}

/* ---- 完成：关弹窗 → 打开新项目（任务视图）→ toast 摘要 ---- */
function finishDropImport(res,opts,kindLabel){
  DROP.busy=false;
  DROP.token=null;
  if($('cf-modal')&&!$('cf-modal').hidden)closeModal();
  if(!res||res.ok!==true){
    toast('导入失败：'+((res&&res.error)||'未知错误'),'err');
    return;
  }
  CURVIEW='tasks';
  if(res.views)VIEWMETA=res.views;
  if(res.graph&&valid(res.graph)){
    syncRev=typeof res.rev==='number'?res.rev:syncRev;
    G=clone(res.graph);
    if(!G.meta)G.meta={};
    sel={type:null,id:null};
    renderAll();
    applyView();
    if(G.nodes.length)requestAnimationFrame(function(){fitView();});
    renderViewTabs();
  }
  apiPost('view',{project:res.project,view:'tasks'}).catch(function(){});
  refreshCouplingStale(true);
  var overall=(res.coupling&&res.coupling.overall)||null;
  var summary='已导入'+(kindLabel==='archive'?'（解压）':'')+' · 模块 '+(overall?overall.modules:'—')
    +(overall?(' · 屎山程度 '+couplingLevelText(overall.level)):'');
  if(res.warning)showBanner('导入完成，但有一些提醒：'+res.warning);
  else toast(summary,'ok');
  if(res.modulesAvailable===false)showBanner('模块结构图未能生成：目录里几乎没有源码；任务流水线已正常导入。');
}

/* ---- 真实路径通道（薄分支）：宿主桥接可用且拿到路径时，就地导入 ---- */

}
/* ================= v1.2.1：导入目录树选择器 =================

  BROWSE.entries=[];BROWSE.active=-1;BROWSE.error=null;BROWSE.rootsMode=false;
