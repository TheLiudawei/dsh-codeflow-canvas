  BROWSE.input=null;
  if(input){try{input.focus({preventScroll:true});}catch(e){}}
}
/* Esc 闸门：模板的全局 Escape 处理会关掉整个导入对话框；浏览弹层打开时
   必须只关自己。port-canvas 已把模板的 Escape 分支改为先问这里。 */
function closeBrowseOnEscape(){
  if(!BROWSE.open)return false;
  closeBrowsePicker();
  return true;
}

/* ---- 数据加载 ---- */
function browseSetLoading(target){
  BROWSE.loading=true;BROWSE.error=null;
  BROWSE.pending=target;
  browseRenderStatus();
  browseRenderList();
  browseRenderCrumbs();
}
function browseLoad(path,allowRootsFallback){
  browseSetLoading(path);
  browseFetch(path).then(function(res){
    BROWSE.loading=false;
    if(!res||res.ok!==true){
      var message=(res&&res.error)||('读取失败（HTTP '+(res&&res.status||'')+'）');
      if(allowRootsFallback){BROWSE.error=null;enterBrowseRoots(res,message);}
      else browseFail(message,res);
      return;
    }
    if(res.roots===true||res.path===null){
      BROWSE.rootsMode=true;BROWSE.dir=null;BROWSE.parent=null;
    }else{
      BROWSE.rootsMode=false;BROWSE.dir=res.path;BROWSE.parent=res.parent;
    }
    BROWSE.entries=res.entries||[];
    BROWSE.truncated=res.truncated===true;
    BROWSE.filter='';BROWSE.active=-1;BROWSE.error=null;BROWSE.note=null;
    var box=$('cf-browse-filter');
    if(box){box.value='';box.placeholder='过滤当前层级的子目录…';}
    browseRenderAll();
  }).catch(function(err){
    BROWSE.loading=false;
    var message=(err&&err.message)||String(err);
    if(allowRootsFallback){enterBrowseRoots(null,message);return;}
    browseFail(message,null);
  });
}
/* 初始值非法/为空 → 从根清单开始（C1）；原错误作为一条提示展示，不关弹窗 */
function enterBrowseRoots(res,message){
  browseLoadRoots(message?('打开「'+String(BROWSE.pending||'').slice(0,80)+'」失败：'+message+'；已回到根清单。'):null);
  BROWSE.pending=null;
}
function browseLoadRoots(note){
  BROWSE.pending=null;
  browseSetLoading(null);
  browseFetch('').then(function(res){
    BROWSE.loading=false;
    if(!res||res.ok!==true){browseFail((res&&res.error)||'读取根清单失败',res);return;}
    BROWSE.rootsMode=true;BROWSE.dir=null;BROWSE.parent=null;
    BROWSE.entries=res.entries||[];
    BROWSE.truncated=res.truncated===true;
    BROWSE.filter='';BROWSE.active=-1;BROWSE.error=null;BROWSE.note=note||null;
    var box=$('cf-browse-filter');
    if(box){box.value='';box.placeholder='过滤根位置…';}
    browseRenderAll();
  }).catch(function(err){BROWSE.loading=false;browseFail((err&&err.message)||String(err),null);});
}
function browseFail(message,res){
  BROWSE.error=message;
  if(res&&res.code==='BROWSE_TIMEOUT')BROWSE.error=message+'（网络位置可能已断开）';
  browseRenderStatus();
  browseRenderList();
}
function browseEnter(entry){
  if(!entry||typeof entry.path!=='string')return;
  browseLoad(entry.path,false);
}
function browseGoUp(){
  if(BROWSE.rootsMode)return;
  if(BROWSE.loading)return;
  if(typeof BROWSE.parent==='string'&&BROWSE.parent.length>0){browseLoad(BROWSE.parent,false);}
  else browseLoadRoots();
}

/* ---- 渲染 ---- */
function browseRenderAll(){
  browseRenderCrumbs();
  browseRenderList();
  browseRenderStatus();
}
function browseVisibleEntries(){
  var q=BROWSE.filter.trim().toLowerCase();
  if(!q)return BROWSE.entries;
  return BROWSE.entries.filter(function(entry){return String(entry.name||'').toLowerCase().indexOf(q)>=0;});
}
function browseRenderCrumbs(){
  var box=$('cf-browse-crumbs');
  if(!box)return;
  if(BROWSE.loading&&BROWSE.pending){box.innerHTML='<span class="cf-browse-crumb-dim">正在打开…</span>';return;}
  if(BROWSE.rootsMode){box.innerHTML='<span class="cf-browse-crumb-dim">选择一个根位置进入</span>';return;}
  if(!BROWSE.dir){box.innerHTML='';return;}
  var crumbs=browseCrumbsOf(BROWSE.dir);
  var html='';
  crumbs.forEach(function(crumb,i){
    var last=i===crumbs.length-1;
    html+='<button type="button" class="cf-browse-crumb'+(last?' current':'')+'" data-crumb="'+esc(crumb.path)+'"'
      +(last?' disabled':'')+' title="'+esc(crumb.path)+'">'+esc(crumb.name)+'</button>';
    if(!last)html+='<span class="cf-browse-sep">›</span>';
  });
  box.innerHTML=html;
  Array.prototype.forEach.call(box.querySelectorAll('[data-crumb]'),function(btn){
    btn.addEventListener('click',function(){
      if(BROWSE.loading)return;
      browseLoad(btn.getAttribute('data-crumb'),false);
    });
  });
}
/* 面包屑拆解只用于**展示**；点击回跳发出的是服务端先前给出的完整路径 */
function browseCrumbsOf(dir){
  var sep=dir.indexOf('\\')>=0?'\\':'/';
  var parts=dir.split(sep).filter(function(part){return part.length>0;});
  var crumbs=[];
  var acc=dir.startsWith('\\\\')?'\\\\':(sep==='\\'&&/^[a-zA-Z]:/.test(dir)?'':'/');
  if(dir.startsWith('\\\\')){
    acc='\\\\'+parts[0];
    crumbs.push({name:'\\\\'+parts[0],path:acc});
    parts=parts.slice(1);
  }else if(sep==='\\'&&/^[a-zA-Z]:/.test(dir)){
    acc=dir.slice(0,2);
    crumbs.push({name:acc,path:acc+'\\'});
  }
  for(var i=0;i<parts.length;i++){
    acc=acc===undefined||acc===''?sep+parts[i]:(acc.endsWith(sep)?acc+parts[i]:acc+sep+parts[i]);
    crumbs.push({name:parts[i],path:acc});
  }
  return crumbs;
}
function browseFolderGlyph(){
  var body=(typeof ICONS!=='undefined'&&ICONS['folder-open'])||'<path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>';
  return '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">'+body+'</svg>';
}
function browseRenderList(){
  var list=$('cf-browse-list');
  if(!list)return;
  if(BROWSE.loading){list.innerHTML='<div class="cf-browse-empty"><span class="cf-act-spin">◐</span> 正在读取…</div>';return;}
  if(BROWSE.error){list.innerHTML='';return;}
  var items=browseVisibleEntries();
  if(BROWSE.active>=items.length)BROWSE.active=items.length>0?items.length-1:-1;
  if(!items.length){
    list.innerHTML='<div class="cf-browse-empty">'+(BROWSE.filter?'没有匹配的项':'没有子目录（仍可选择当前目录）')+'</div>';
    browseRenderPickButton(items);
    return;
  }
  var html='';
  items.forEach(function(entry,i){
    html+='<div class="cf-browse-row'+(i===BROWSE.active?' active':'')+'" role="option" data-i="'+i+'" aria-selected="'+(i===BROWSE.active?'true':'false')+'" tabindex="-1">'
      +'<span class="cf-browse-glyph">'+browseFolderGlyph()+'</span>'
      +'<span class="cf-browse-name" title="'+esc(entry.path)+'">'+esc(entry.name)+'</span>'
      +(entry.kind==='root'?'<span class="cf-browse-kind">根位置</span>':'')
      +'</div>';
  });
  if(BROWSE.truncated)html+='<div class="cf-browse-truncated">仅显示前 '+BROWSE.entries.length+' 项；请用过滤框缩小范围或进入更深的层级</div>';
  list.innerHTML=html;
  Array.prototype.forEach.call(list.querySelectorAll('.cf-browse-row'),function(row){
    var index=Number(row.getAttribute('data-i'));
    row.addEventListener('click',function(){browseSelectIndex(index);});
    row.addEventListener('dblclick',function(){
      var entry=browseVisibleEntries()[index];
      browseEnter(entry);
    });
  });
  browseRenderPickButton(items);
  scrollBrowseActive();
}
function browseRenderPickButton(items){
  var btn=$('cf-browse-pick');
  if(!btn)return;
  var selected=(items||browseVisibleEntries())[BROWSE.active];
  if(BROWSE.rootsMode){
    btn.disabled=!selected;
    btn.textContent=selected?('选择 '+selected.name):'选择此目录';
  }else{
    btn.disabled=false;
    btn.textContent=selected?('选择 '+selected.name):'选择此目录';
  }
}
function browseSelectIndex(index){
  BROWSE.active=index;
  Array.prototype.forEach.call($('cf-browse-list').querySelectorAll('.cf-browse-row'),function(row,i){
    row.classList.toggle('active',i===index);
    row.setAttribute('aria-selected',i===index?'true':'false');
  });
  browseRenderPickButton();
  scrollBrowseActive();
}
function scrollBrowseActive(){
  var active=$('cf-browse-list').querySelector('.cf-browse-row.active');
  if(active&&active.scrollIntoView)try{active.scrollIntoView({block:'nearest'});}catch(e){}
}
function browseRenderStatus(){
  var box=$('cf-browse-status');
  if(!box)return;
  if(BROWSE.loading){box.innerHTML='';return;}
  var html='';
  if(BROWSE.note)html+='<span class="cf-browse-note">'+esc(BROWSE.note)+'</span>';
  if(BROWSE.error){
    html+='<span class="cf-browse-error">'+esc(BROWSE.error)+'</span>'
      +'<button type="button" class="cf-btn mini" data-b="retry">重试</button>';
    box.innerHTML=html;
    box.querySelector('[data-b="retry"]').addEventListener('click',function(){
      BROWSE.error=null;
      if(BROWSE.rootsMode)browseLoadRoots();
      else if(BROWSE.dir)browseLoad(BROWSE.dir,false);
      else browseLoadRoots();
    });
    return;
  }
  if(BROWSE.rootsMode)html+='<span class="cf-browse-hint">进入一个根位置后，再选择具体目录</span>';
  else if(BROWSE.dir)html+='<span class="cf-browse-hint" title="'+esc(BROWSE.dir)+'">当前：'+esc(BROWSE.dir)+'</span>';
  box.innerHTML=html;
}

/* ---- 键盘 ---- */
function onBrowseKeydown(e){
  if(e.key==='ArrowDown'){
    e.preventDefault();
    var items=browseVisibleEntries();
    if(items.length){var nx=Math.min(items.length-1,BROWSE.active+1);browseSelectIndex(nx);}
  }else if(e.key==='ArrowUp'){
    e.preventDefault();
    var list=browseVisibleEntries();
    if(list.length){var pv=Math.max(0,BROWSE.active-1);browseSelectIndex(pv);}
  }else if(e.key==='Enter'){
    e.preventDefault();
    var entry=browseVisibleEntries()[Math.max(0,BROWSE.active)];
    if(entry)browseEnter(entry);
  }else if(e.key==='Backspace'){
    e.preventDefault();
    browseGoUp();
  }
}

/* ---- 回填（不自动提交） ---- */
function browsePick(){
  var items=browseVisibleEntries();
  var selected=items[BROWSE.active];
  var value=BROWSE.rootsMode?(selected?selected.path:null):(selected?selected.path:BROWSE.dir);
  if(typeof value!=='string'||value.length===0)return;
  var input=BROWSE.input;
  closeBrowsePicker();
  if(input){
    input.value=value;
    try{input.dispatchEvent(new Event('input',{bubbles:true}));}catch(e){}
  }
}
/* ================= v1.2.2：工作与报错日志（浏览器半边） =================
 * 画布是同源 iframe：浏览器侧异常、按钮失败、fetch 失败此前没有落盘通道。
 * 本补丁给画布加**一个**捕获阶段 click 监听 + 全局 error/rejection 钩子 +
 * 批量上报器（POST /codeflow/api/log，服务端白名单 + 限流）。
 *
 * 红线（任务书 §8.4）：
 *   - 不记录表单值、路径输入、提示词、图 JSON；project 名可以记录；
 *   - 控件标识只取 id/data-act/aria-label/文本（≤80 字符）；
 *   - data-cf-nolog="1" 的控件跳过；同一控件 300ms 内重复点击只记一次；
 *   - 队列 ≤200 条，500ms 或 20 条触发一次上报；序列化超 48 KiB 拆批；
 *     keepalive:true；失败静默丢弃并累计 dropped——绝不 toast、绝不重试风暴；
 *   - 页面卸载时 sendBeacon/fetch(keepalive) 冲一次；失败不阻塞卸载；
 *   - 日志关闭（CODEFLOW_LOG=off）时客户端照发、服务端丢弃；画布不读环境变量。
 * 所有动态文本一律 esc()，本补丁不渲染任何 UI。 */
var CFLOG={queue:[],dropped:0,timer:null,lastClick:{key:'',at:0},sending:false};

function cflogProject(){return (G&&G.project&&G.project.name)||null;}
function cflogControlOf(el){
  if(!el)return null;
  var label=(el.id?('#'+el.id):(el.getAttribute('data-act')?('@'+el.getAttribute('data-act')):''))
    ||el.getAttribute('aria-label')||String(el.textContent||'').trim();
  return String(label).slice(0,80)||'unnamed';
}
function cflogSurfaceOf(el){
  try{
    var mf=window.__CF_ACTION_MANIFEST__;
    if(Array.isArray(mf)){
      for(var i=0;i<mf.length;i++){
        var e=mf[i];
        if(e.id&&el.id===e.id)return e.surface;
        var act=el.getAttribute&&(el.getAttribute('data-act')||el.getAttribute('data-b'));
        if(e.selector&&act&&e.selector===('[data-act="'+act+'"]'))return e.surface;
      }
    }
  }catch(e){}
  return el&&el.closest&&el.closest('.cf-modal')?'dialog':(el&&el.closest&&el.closest('.cf-menu')?'menu':'canvas');
}
function cflogNow(){try{return Date.now();}catch(e){return 0;}}

function cflogPush(entry){
  if(CFLOG.queue.length>=200){CFLOG.dropped+=1;return;}
  CFLOG.queue.push(entry);
  if(CFLOG.queue.length>=20)cflogFlush();
  else if(!CFLOG.timer)CFLOG.timer=setTimeout(cflogFlush,500);
}

/* 点击后 0–300ms 内出现 modal/menu/toast 算「有可观察效果」（简化 outcome）。 */
function cflogOutcomeProbe(){
  var before={modal:!$('cf-modal').hidden,menus:document.querySelectorAll('.cf-menu').length,toasts:document.querySelectorAll('.cf-toast').length};
  return function(){
    var after={modal:!$('cf-modal').hidden,menus:document.querySelectorAll('.cf-menu').length,toasts:document.querySelectorAll('.cf-toast').length};
    var changed=before.modal!==after.modal||after.menus>before.menus||after.toasts>before.toasts;
    return changed?'ok':'noop';
  };
}

function cflogClick(e){
  var t=e.target;
  if(!t||!t.closest)return;
  var el=t.closest('button,[role="button"],[data-act],[data-cf-log]');
  if(!el)return;
  if(el.getAttribute&&el.getAttribute('data-cf-nolog')==='1')return;
  var control=cflogControlOf(el);
  var now=cflogNow();
  if(control===CFLOG.lastClick.key&&now-CFLOG.lastClick.at<300)return; // 双击去抖
  CFLOG.lastClick={key:control,at:now};
  var probe=cflogOutcomeProbe();
  setTimeout(function(){
    cflogPush({event:'ui.action',level:'info',data:{
      control:control,surface:cflogSurfaceOf(el),outcome:probe(),
      project:cflogProject(),view:CURVIEW,
    }});
  },0);
}

function cflogError(message,stack,extra){
  cflogPush({event:'ui.error',level:'error',data:Object.assign({
    control:null,message:String(message||'').slice(0,200),
    stack:typeof stack==='string'?String(stack).slice(0,600):undefined,
    project:cflogProject(),view:CURVIEW,
  },extra||{})});
  if(CFLOG.queue.length>=20)cflogFlush();
}

function cflogSerialize(){
  var batches=[[]],size=0;
  for(var i=0;i<CFLOG.queue.length;i++){
    var text='';
    try{text=JSON.stringify({events:[CFLOG.queue[i]]})||'';}catch(e){continue;}
    if(size+text.length>48*1024&&batches[batches.length-1].length>0){batches.push([]);size=0;}
    batches[batches.length-1].push(CFLOG.queue[i]);
    size+=text.length;
  }
  return batches;
}

function cflogFlush(){
  if(CFLOG.timer){clearTimeout(CFLOG.timer);CFLOG.timer=null;}
  if(CFLOG.sending)return;
  if(!CFLOG.queue.length)return;
  var batches=cflogSerialize();
  var first=batches.shift()||[];
  var rest=CFLOG.queue.slice(first.length);
  CFLOG.queue=rest;
  CFLOG.sending=true;
  var done=function(){CFLOG.sending=false;if(CFLOG.queue.length>=20)cflogFlush();};
  fetchT('/codeflow/api/log',{method:'POST',headers:{'content-type':'application/json'},cache:'no-store',keepalive:true,
    body:JSON.stringify({events:first})})
    .then(function(){done();})
    .catch(function(){CFLOG.dropped+=first.length;done();}); // 失败静默：不重试、不 toast
}

function initLogExtras(){
  /* 一个捕获阶段 click 监听（委托，不改任何既有控件）。 */
  document.addEventListener('click',cflogClick,true);
  window.addEventListener('error',function(e){
    cflogError(e&&e.message,e&&e.error&&e.error.stack,{source:e&&e.filename?String(e.filename).slice(-80):undefined,line:e&&e.lineno});
  });
  window.addEventListener('unhandledrejection',function(e){
    var r=e&&e.reason;
    cflogError((r&&(r.message||r))||'unhandled rejection',r&&r.stack,{source:'unhandledrejection'});
  });
  /* 页面卸载冲一次；失败不阻塞卸载。 */
  window.addEventListener('pagehide',function(){
    if(!CFLOG.queue.length)return;
    var batches=cflogSerialize();
    CFLOG.queue=[];
    for(var i=0;i<batches.length;i++){
      var body=JSON.stringify({events:batches[i]});
      try{
        if(navigator.sendBeacon&&navigator.sendBeacon('/codeflow/api/log',new Blob([body],{type:'application/json'})))continue;
      }catch(e){}
      try{fetch('/codeflow/api/log',{method:'POST',headers:{'content-type':'application/json'},keepalive:true,body:body}).catch(function(){});}catch(e){}
    }
  });
}
/* ================= v1.3.0：顶部命名菜单栏（绑定层） =================
 * 模型（lib/ui/menu.js）与渲染（lib/ui/menu-html.js，构建期已产出静态标记）
 * 之外的本层只做三件事，不写任何业务规则：
 *   1. 事件委托：点击项 → `ACTION_RUNNERS[action]()`——action key 到**现有**
 *      函数的查表，菜单项与主按钮共用同一份动作定义，绝不复制第二份 handler；
 *   2. 开/关 + 键盘 + 焦点：同一时间只开一个；Enter/Space/ArrowDown 打开，
 *      ↑/↓ 循环移动（跳过禁用项与分隔线），Home/End 到首/尾，Esc 关闭并还
 *      焦点给触发按钮，Tab 直接关闭不困焦点；
 *   3. 状态广播：setActionState(key,{disabled,hidden,title}) 把动作状态同时
 *      应用到工具栏按钮与菜单项（同一 [data-action] 选择器一次覆盖）。
 * 响应式折叠由 menu-ui.css 的媒体查询完成，展开态与折叠态面板出自同一模型。
 * 所有动态文本一律 esc()/textContent，禁止拼接未转义 HTML。 */
var MENUBAR={open:null};

/* action key → 现有函数（唯一查表处；主按钮沿用模板既有的直接绑定，
   菜单项经这里复用同一个函数——不存在第二份处理逻辑）。 */
var ACTION_RUNNERS={
  'toolbar:cf-tb-new':function(){openNewDialog();},
  'toolbar:cf-tb-import':function(){openImportDialog();},
  'toolbar:cf-tb-runall':function(){runAll();},
  'toolbar:cf-tb-undo':function(){openUndoDialog();},
  'toolbar:cf-tb-save':function(){saveProject();},
  'toolbar:cf-tb-settings':function(){openSettingsDialog();},
  'toolbar:cf-tb-coupling':function(){runCouplingAnalysis(null);},
  'toolbar:cf-tb-add':function(){openAddDialog(null);},
  'toolbar:cf-tb-layout':function(){autoLayout();},
  'toolbar:cf-tb-fit':function(){fitView();},
  'toolbar:cf-tb-help':function(){openHelp();},
  'toolbar:cf-vtab-tasks':function(){switchView('tasks');},
  'toolbar:cf-vtab-modules':function(){switchView('modules');},
  'cards:cleanup-stale':function(){cleanupStaleCards();},
  'logs:open-viewer':function(){openLogViewer();}
};

/* 把动作状态应用到该 action 的全部呈现（工具栏按钮 + 菜单项 + 折叠面板项）。
   disabled 同步写 disabled 属性与 aria-disabled；title 同步 tooltip。 */
function setActionState(key,state){
  var els;
  try{els=document.querySelectorAll('[data-action="'+key+'"]');}catch(e){return;}
  for(var i=0;i<els.length;i++){
    var el=els[i];
    if(state.hidden!==undefined)el.hidden=!!state.hidden;
    if(state.disabled!==undefined){
      el.disabled=!!state.disabled;
      el.setAttribute('aria-disabled',state.disabled?'true':'false');
    }
    if(state.title!==undefined){
      el.setAttribute('title',state.title);
      try{el.setAttribute('data-tooltip',state.title);}catch(e2){}
    }
  }
}

function menuPopOf(group){return document.getElementById('cf-menupop-'+group);}
function menuTriggerOf(group){return document.getElementById('cf-menu-'+group);}
/* 可聚焦项：面板内 role=menuitem 且未禁用/未隐藏（分隔线天然不在其中）。 */
function menuFocusableItems(pop){
  if(!pop)return [];
  var all=pop.querySelectorAll('[role="menuitem"]');
  var out=[];
  for(var i=0;i<all.length;i++){
    var el=all[i];
    if(el.hidden||el.disabled||el.getAttribute('aria-disabled')==='true')continue;
    out.push(el);
  }
  return out;
}
function focusMenuItemAt(pop,index){
  var items=menuFocusableItems(pop);
  if(!items.length)return;
  var el=items[Math.max(0,Math.min(items.length-1,index))];
  try{el.focus({preventScroll:true});}catch(e){try{el.focus();}catch(e2){}}
}

function openMenuBar(group,focusLast){
  closeMenuBar(false);
  var pop=menuPopOf(group);
  var trigger=menuTriggerOf(group);
  if(!pop||!trigger)return;
  pop.hidden=false;
  trigger.setAttribute('aria-expanded','true');
  MENUBAR.open=group;
  var items=menuFocusableItems(pop);
  focusMenuItemAt(pop,focusLast?(items.length-1):0);
}
function closeMenuBar(refocusTrigger){
  if(MENUBAR.open===null)return false;
  var group=MENUBAR.open;
  var pop=menuPopOf(group);
  var trigger=menuTriggerOf(group);
  if(pop)pop.hidden=true;
  if(trigger)trigger.setAttribute('aria-expanded','false');
  MENUBAR.open=null;
  if(refocusTrigger&&trigger){try{trigger.focus({preventScroll:true});}catch(e){try{trigger.focus();}catch(e2){}}}
  return true;
}
/* Esc 闸门：模板的全局 Escape 分支最先问这里（插入在 closeBrowseOnEscape 之前）。 */
function closeMenuBarOnEscape(){
  if(MENUBAR.open===null)return false;
  closeMenuBar(true);
  return true;
}

function menuCurrentIndex(pop,active){
  var items=menuFocusableItems(pop);
  for(var i=0;i<items.length;i++){if(items[i]===active)return i;}
  return -1;
}
function menuStep(pop,from,delta){
  var items=menuFocusableItems(pop);
  if(!items.length)return;
  var next=from;
  for(var guard=0;guard<items.length;guard++){
    next=(next+delta+items.length)%items.length;
    break;
  }
  focusMenuItemAt(pop,next);
}

function initMenuExtras(){
  /* 触发与执行：一次捕获阶段委托（触发按钮开/关、面板项执行后关闭、
     外部点击关闭）。不 preventDefault——不干扰任何既有手势。 */
  document.addEventListener('click',function(e){
    var t=e.target;
    if(!t||!t.closest)return;
    var trigger=t.closest('[data-cf-menu]');
    if(trigger){
      var group=trigger.getAttribute('data-cf-menu');
      if(MENUBAR.open===group)closeMenuBar(true);
      else openMenuBar(group);
      return;
    }
    if(MENUBAR.open===null)return;
    var item=t.closest('[data-action]');
    if(item&&item.closest&&item.closest('.cf-menupop')){
      if(item.disabled||item.getAttribute('aria-disabled')==='true')return;
      var key=item.getAttribute('data-action');
      closeMenuBar(false);
      var runner=ACTION_RUNNERS[key];
      if(runner)runner();
      else toast('该动作暂不可用','err');
      return;
    }
    if(!t.closest('.cf-menupop')&&!t.closest('.cf-menubar'))closeMenuBar(false);
  },true);

  /* 键盘：触发按钮上 Enter/Space/↓ 开（↑ 开并聚焦末项）；面板内 ↑/↓/Home/
     End 循环移动；Tab 关闭（不 preventDefault，焦点自然离开）；捕获阶段
     stopPropagation 防止画布快捷键（Delete 等）误触。Esc 走模板全局链的
     closeMenuBarOnEscape 闸门（避免双通道重复处理）。 */
  document.addEventListener('keydown',function(e){
    var t=e.target;
    if(!t||!t.closest)return;
    var trigger=t.closest('[data-cf-menu]');
    if(trigger){
      var group=trigger.getAttribute('data-cf-menu');
      if(e.key==='Enter'||e.key===' '||e.key==='ArrowDown'){
        e.preventDefault();e.stopPropagation();openMenuBar(group);
      }else if(e.key==='ArrowUp'){
        e.preventDefault();e.stopPropagation();openMenuBar(group,true);
      }
      return;
    }
    if(MENUBAR.open===null)return;
    var pop=menuPopOf(MENUBAR.open);
    var inPop=t.closest&&t.closest('.cf-menupop');
    if(!inPop)return;
    var idx=menuCurrentIndex(pop,document.activeElement);
    if(e.key==='ArrowDown'){e.preventDefault();e.stopPropagation();menuStep(pop,idx<0?-1:idx,1);}
    else if(e.key==='ArrowUp'){e.preventDefault();e.stopPropagation();menuStep(pop,idx<0?0:idx,-1);}
    else if(e.key==='Home'){e.preventDefault();e.stopPropagation();focusMenuItemAt(pop,0);}
    else if(e.key==='End'){e.preventDefault();e.stopPropagation();var n=menuFocusableItems(pop).length;if(n)focusMenuItemAt(pop,n-1);}
    else if(e.key==='Tab'){closeMenuBar(false);}
  },true);

  /* 滚动画布 / 面板尺寸变化时收起（面板是 CSS 定位，无需重算坐标）。 */
  document.addEventListener('pointerdown',function(e){
    if(MENUBAR.open===null)return;
    var t=e.target;
    if(t&&t.closest&&t.closest('.cf-menupop'))return;
    if(t&&t.closest&&t.closest('[data-cf-menu]'))return;
    closeMenuBar(false);
  },true);
  try{
    if(typeof ResizeObserver==='function'){
      var mbRo=new ResizeObserver(function(){closeMenuBar(false);});
      mbRo.observe($('cf-stage'));
    }
  }catch(e){}
}
/* ================= v1.3.0：任务卡片持久化（画布半边，需求三） =================
 * 职责（全部经 HTTP API，绝不直接读 config.json / 图文件）：
 *   - 首次询问（默认关闭；按工作区 asked 记忆；✕ 等同「暂不开启」）；
 *   - 失效卡片标记（meta.cf.stale → 徽章「源码中已不存在」，不用大块红色）；
 *   - 运行守卫：失效卡片不参与「运行全部」（宿主 gestures 已过滤）、单节点
 *     运行在画布侧直接提示；
 *   - 「清理失效卡片…」（项目菜单；唯一删除路径，二次确认）。
 * 状态经 setActionState 广播（menu-ui.js）。合并本身在宿主 lib/cards/merge.js。 */
var CARDS={persist:false,asked:false};

function isStaleCard(n){return !!(n&&n.meta&&n.meta.cf&&n.meta.cf.stale===true);}
function staleCardCount(){var n=0;for(var i=0;i<G.nodes.length;i++){if(isStaleCard(G.nodes[i]))n++;}return n;}

/* 状态广播：清理动作的可用性 + 失效标记重绘。 */
function updateCardsState(){
  var count=staleCardCount();
  setActionState('cards:cleanup-stale',{disabled:!(CARDS.persist&&count>0),
    title:CARDS.persist?('清理 '+count+' 张失效卡片'):'开启卡片持久化并出现失效卡片后可用'});
  applyStaleMarks();
}

function applyStaleMarks(){
  for(var i=0;i<G.nodes.length;i++){
    var n=G.nodes[i];
    var el=nodeEls[n.id];
    if(!el)continue;
    var stale=isStaleCard(n);
    el.classList.toggle('cf-stale-card',stale);
    var head=el.querySelector('.cf-node-head');
    var badge=head?head.querySelector('.cf-stale-badge'):null;
    if(stale&&head){
      if(!badge){
        badge=document.createElement('span');
        badge.className='cf-stale-badge';
        head.appendChild(badge);
      }
      badge.textContent='源码中已不存在';
      badge.title='失效卡片：重新导入时源码里已没有对应项；不参与「运行全部」。可在「项目」菜单清理。';
    }else if(badge&&badge.parentNode){
      badge.parentNode.removeChild(badge);
    }
  }
}
var renderNodesCardsBase=renderNodes;
renderNodes=function(){renderNodesCardsBase();applyStaleMarks();};

/* 单节点运行守卫：失效卡片直接提示（宿主 gestures 也有同样守卫，双保险）。 */
var runNodeCardsBase=runNode;
runNode=function(id,rerun){
  if(isStaleCard(byId(id))){
    toast('失效卡片（源码中已不存在）不能运行；可从「项目」菜单清理，或直接删除该卡片','err');
    return;
  }
  runNodeCardsBase(id,rerun);
};

/* 清理失效卡片：二次确认、列数量；确认后从图中删除并保存。 */
function cleanupStaleCards(){
  if(!CARDS.persist){toast('先在设置里开启「重新导入时保留任务卡片」','err');return;}
  var count=staleCardCount();
  if(count===0){toast('没有失效卡片');return;}
  openConfirm('清理失效卡片','将从图中删除 '+count+' 张「源码中已不存在」的卡片（不影响磁盘文件）。确定继续？',function(){
    G.nodes=G.nodes.filter(function(n){return !isStaleCard(n);});
    sel={type:null,id:null};
    renderAll();
    saveState(true);
    updateCardsState();
    toast('已清理 '+count+' 张失效卡片','ok');
  });
}

/* 首次询问：只弹一次（asked 按工作区记忆）；默认不开启；失败不写 asked。 */
function maybeAskCardsPersist(){
  if(!HOSTED)return;
  apiGet('/codeflow/api/config').then(function(cfg){
    if(!cfg||cfg.ok!==true)return;
    CARDS.persist=cfg.cards&&cfg.cards.persist===true;
    CARDS.asked=cfg.cards&&cfg.cards.asked===true;
    updateCardsState();
    if(CARDS.asked)return;
    openCardsAskDialog();
  }).catch(function(){/* 配置读不到：画布照常可用；稍后可在设置里开启 */});
}
function saveCardsChoice(persist){
  apiPost('config',{cards:{persist:persist,asked:true}}).then(function(res){
    closeModal();
    CARDS.persist=res&&res.cards&&res.cards.persist===true;
    CARDS.asked=true;
    updateCardsState();
    if(CARDS.persist)toast('已开启：重新导入将保留任务卡片','ok');
  }).catch(function(){
    closeModal();
    toast('设置未保存，稍后可在设置里开启','err');
  });
}
function openCardsAskDialog(){
  var h=dHead('file-plus-2','把任务卡片保存在项目里？')
    +'<div class="cf-dbody">'
    +'<div class="cf-hintbox">开启后，重新导入同一项目会保留卡片的<b>运行状态、结果、画布位置</b>和你改过的标题/参数；'
    +'源码里已删除的任务会保留为「失效卡片」（不参与运行，可从「项目」菜单一键清理）。</div>'
    +'<div class="cf-hintbox">关闭时每次导入都会重建卡片（旧图自动备份为 .bak-时间）。数据只保存在本地项目目录，不上传。</div>'
    +'</div>'
    +'<div class="cf-dfoot"><button type="button" class="cf-btn" data-act="cancel">暂不开启</button>'
    +'<button type="button" class="cf-btn cf-primary" data-act="confirm">开启并继续</button></div>';
  openModal(h);
  var d=$('cf-dialog');
  d.querySelector('[data-act="cancel"]').addEventListener('click',function(){saveCardsChoice(false);});
  d.querySelector('[data-act="confirm"]').addEventListener('click',function(){saveCardsChoice(true);});
  /* 右上角 ✕ 等同「暂不开启」（任务书 §6.6）；委托的 closeModal 幂等。 */
  var x=d.querySelector('.cf-dclose');
  if(x)x.addEventListener('click',function(){saveCardsChoice(false);});
}

function initCardsExtras(){
  if(!HOSTED)return;
  maybeAskCardsPersist();
}
/* ================= v1.3.0：工作日志查看器（需求四） =================
 * 只读查看器：级别过滤（客户端过滤已取回的行，切换不重新请求）、搜索
 * （客户端大小写不敏感，只匹配 event/msg/data）、跟随尾部（贴底自动追加，
 * 上滚暂停 + 回到底部）、复制可见原始 JSONL 行、打开所在目录（501 时提示
 * 复制路径）。打开期间每 2 秒轮询（页面隐藏暂停）；关闭立即停止轮询。
 * 隐私红线：只读本地文件，无上传/分享/外发；日志内容一律 DOM API 渲染
 * （不用 innerHTML 拼接，日志里可能有 <）。 */
var LOGVIEW={open:false,timer:null,rows:[],level:'all',q:'',follow:true,fetchSeq:0};

function logviewStopPoll(){
  if(LOGVIEW.timer){clearInterval(LOGVIEW.timer);LOGVIEW.timer=null;}
}
function logviewFetch(){
  if(!LOGVIEW.open)return;
  if(document.visibilityState==='hidden')return; // 页面隐藏暂停轮询
  var seq=++LOGVIEW.fetchSeq;
  apiGet('/codeflow/api/log?tail=2000&rotated=0').then(function(res){
    if(!LOGVIEW.open||seq!==LOGVIEW.fetchSeq)return;
    if(!res||res.ok!==true)return;
    LOGVIEW.rows=Array.isArray(res.lines)?res.lines:[];
    var infoEl=$('cf-lv-file');
    if(infoEl){
      var sizeText=(res.size?(res.size/1024).toFixed(0)+' KB':'');
      infoEl.textContent='';
      infoEl.textContent='文件：'+String(res.path||'—')
        +(sizeText?' · '+sizeText:'')
        +(res.mtime?' · '+String(res.mtime).replace('T',' ').slice(0,19):'')
        +(res.truncated?' · 已截断（仅显示尾部）':'')
        +(res.invalidLines?(' · 跳过坏行 '+res.invalidLines):'');
    }
    logviewRenderRows();
  }).catch(function(){/* 轮询失败静默：下一轮再试 */});
}
function logviewStartPoll(){
  logviewStopPoll();
  LOGVIEW.timer=setInterval(logviewFetch,2000);
}
function logviewVisibleRows(){
  var q=LOGVIEW.q.trim().toLowerCase();
  var out=[];
  for(var i=0;i<LOGVIEW.rows.length;i++){
    var row=LOGVIEW.rows[i];
    if(LOGVIEW.level!=='all'&&row.level!==LOGVIEW.level)continue;
    if(q.length>0){
      var hay=(String(row.event||'')+' '+String(row.msg||'')).toLowerCase();
      var data=row.data;
      if(data!==undefined&&data!==null&&typeof data==='object'){
        for(var k in data){if(typeof data[k]==='string')hay+=' '+String(data[k]).toLowerCase();}
      }
      if(hay.indexOf(q)<0)continue;
    }
    out.push(row);
  }
  return out;
}
function logviewRenderRows(){
  var list=$('cf-lv-list');
  if(!list)return;
  list.textContent='';
  var rows=logviewVisibleRows();
  if(LOGVIEW.rows.length===0){
    var empty=document.createElement('div');
    empty.className='cf-lv-empty';
    empty.textContent='还没有日志文件，产生一次操作后再来看。';
    list.appendChild(empty);
    return;
  }
  if(rows.length===0){
    var none=document.createElement('div');
    none.className='cf-lv-empty';
    none.textContent='没有匹配的日志（调整级别过滤或搜索词）。';
    list.appendChild(none);
    return;
  }
  for(var i=0;i<rows.length;i++){
    var row=rows[i];
    var line=document.createElement('div');
    line.className='cf-lv-line lv-'+row.level;
    var time=document.createElement('span');
    time.className='cf-lv-time';
    time.textContent=String(row.ts||'').replace('T',' ').slice(11,19)||'—';
    var level=document.createElement('span');
    level.className='cf-lv-level lv-'+row.level;
    level.textContent=row.level.toUpperCase();
    var event=document.createElement('span');
    event.className='cf-lv-event';
    event.textContent=row.event;
    line.appendChild(time);
    line.appendChild(level);
    line.appendChild(event);
    if(row.msg!==undefined&&row.msg!==null&&String(row.msg).length>0){
      var msg=document.createElement('span');
      msg.className='cf-lv-msg';
      msg.textContent=String(row.msg);
      line.appendChild(msg);
    }
    if(row.data!==undefined&&row.data!==null){
      var data=document.createElement('span');
      data.className='cf-lv-data';
      var pairs=[];
      try{
        var keys=Object.keys(row.data);
        for(var j=0;j<keys.length&&j<6;j++){pairs.push(keys[j]+'='+JSON.stringify(row.data[keys[j]]));}
        if(keys.length>6)pairs.push('…');
      }catch(e){}
      data.textContent=pairs.join(' ');
      line.appendChild(data);
    }
    list.appendChild(line);
  }
  if(LOGVIEW.follow)list.scrollTop=list.scrollHeight;
}
function logviewApplyFilter(){
  var rows=logviewVisibleRows();
  var countEl=$('cf-lv-count');
  if(countEl)countEl.textContent=String(rows.length)+' / '+LOGVIEW.rows.length+' 行';
  logviewRenderRows();
}

function openLogViewer(){
  if(!HOSTED){toast('独立模式没有宿主日志','err');return;}
  LOGVIEW.open=true;
  LOGVIEW.level='all';
  LOGVIEW.q='';
  LOGVIEW.follow=true;
  var h=dHead('file-text','CodeFlow 工作日志')
    +'<div class="cf-dbody cf-lv-body">'
    +'<div class="cf-lv-fileline" id="cf-lv-file">读取中…</div>'
    +'<div class="cf-lv-bar">'
    +'<span class="cf-lv-levels" id="cf-lv-levels">'
    +'<button type="button" class="cf-btn mini" data-lv-level="all">全部</button>'
    +'<button type="button" class="cf-btn mini" data-lv-level="info">Info</button>'
    +'<button type="button" class="cf-btn mini" data-lv-level="warn">Warn</button>'
    +'<button type="button" class="cf-btn mini" data-lv-level="error">Error</button>'
    +'</span>'
    +'<input class="cf-in cf-lv-search" id="cf-lv-search" type="text" placeholder="搜索 event / msg / data…" aria-label="搜索日志">'
    +'<label class="cf-chk cf-lv-follow" style="display:flex;gap:5px;align-items:center;white-space:nowrap"><input type="checkbox" id="cf-lv-follow" checked> <span>跟随尾部</span></label>'
    +'<span class="cf-lv-count" id="cf-lv-count"></span>'
    +'</div>'
    +'<div class="cf-lv-bar">'
    +'<button type="button" class="cf-btn mini" data-lv="copy">复制可见行</button>'
    +'<button type="button" class="cf-btn mini" data-lv="reveal">打开所在目录</button>'
    +'<button type="button" class="cf-btn mini" data-lv="refresh">刷新</button>'
    +'<span class="cf-sechint" style="margin:0 0 0 auto">只读本地文件；不上传、不外发</span>'
    +'</div>'
    +'<div class="cf-lv-list" id="cf-lv-list" role="log" aria-label="日志行" tabindex="0"></div>'
    +'</div>'
    +'<div class="cf-dfoot"><button type="button" class="cf-btn" data-lv="bottom" hidden>回到底部</button>'
    +'<span style="flex:1"></span>'
    +'<button type="button" class="cf-btn cf-primary mini" data-act="close">关闭</button></div>';
  openModal(h);
  var d=$('cf-dialog');
  d.querySelector('[data-act="close"]').addEventListener('click',closeModal);
  d.querySelectorAll('[data-lv-level]').forEach(function(btn){
    btn.addEventListener('click',function(){
      LOGVIEW.level=btn.getAttribute('data-lv-level');
      d.querySelectorAll('[data-lv-level]').forEach(function(b){b.classList.toggle('cf-primary',b===btn);});
      logviewApplyFilter();
    });
  });
  d.querySelector('[data-lv-level="all"]').classList.add('cf-primary');
  var search=d.querySelector('#cf-lv-search');
  search.addEventListener('input',function(){LOGVIEW.q=String(search.value||'');logviewApplyFilter();});
  var follow=d.querySelector('#cf-lv-follow');
  follow.addEventListener('change',function(){LOGVIEW.follow=follow.checked;if(LOGVIEW.follow)logviewRenderRows();});
  d.querySelector('[data-lv="copy"]').addEventListener('click',function(){
    var rows=logviewVisibleRows();
    if(!rows.length){toast('没有可复制的日志行');return;}
    /* 复制可见行的**原始 JSONL**（一行一条，便于贴 issue）。 */
    var text=rows.map(function(row){return JSON.stringify(row);}).join('\n');
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){toast('已复制 '+rows.length+' 行原始 JSONL','ok');},function(){toast('复制失败：请手动选择复制','err');});
    }else{toast('当前环境不支持自动复制','err');}
  });
  d.querySelector('[data-lv="reveal"]').addEventListener('click',function(){
    apiPost('log/reveal',{kind:'item'}).then(function(res){
      toast('已在文件管理器中定位日志','ok');
    }).catch(function(err){
      toast((err&&err.message)||'当前宿主不支持打开目录；请复制上面的路径手动查看','err');
    });
  });
  d.querySelector('[data-lv="refresh"]').addEventListener('click',function(){logviewFetch();});
  var bottom=d.querySelector('[data-lv="bottom"]');
  bottom.addEventListener('click',function(){LOGVIEW.follow=true;follow.checked=true;logviewRenderRows();bottom.hidden=true;});
  var list=d.querySelector('#cf-lv-list');
  list.addEventListener('scroll',function(){
    var atBottom=list.scrollTop+list.clientHeight>=list.scrollHeight-24;
    if(!atBottom&&LOGVIEW.follow){LOGVIEW.follow=false;follow.checked=false;bottom.hidden=false;}
    else if(atBottom&&!LOGVIEW.follow){LOGVIEW.follow=true;follow.checked=true;bottom.hidden=true;}
  });
  /* 禁用级别按钮在「日志关闭/读取失败」时的空态文案由 fetch 结果渲染。 */
  logviewFetch();
  logviewStartPoll();
}
/* 关闭 modal（含 Esc / ✕ / 遮罩点击）立即停止轮询、清空定时器。 */
var closeModalLogviewBase=closeModal;
closeModal=function(){
  logviewStopPoll();
  LOGVIEW.open=false;
  closeModalLogviewBase();
};
boot();
initCanvasExtras();
initCouplingExtras();
initDropExtras();
initLogExtras();
initMenuExtras();
initCardsExtras();
})();
</script>
